<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="theme-color" content="#140e0a">
<title>落日与海 · 涡流笔触</title>
<style>
  :root{
    color-scheme:dark;
    --ink:#f4e3c2; --dim:#b99f7d; --amber:#e8963c; --gold:#f6bb5e; --teal:#39a3ad; --deep:#0b2434;
    --bg:#140e0a; --panel:#1e1510; --line:#3a2a1d;
  }
  *{box-sizing:border-box}
  html,body{margin:0;height:100%;background:var(--bg);color:var(--ink);
    font-family:"Noto Serif SC","Songti SC",SimSun,serif;}
  body{display:flex;flex-direction:column;overflow:hidden}
  .hall{display:flex;flex-direction:column;height:100%;padding:14px 20px 10px;gap:10px}
  header{display:flex;align-items:baseline;gap:14px;flex-wrap:wrap}
  h1{margin:0;font-size:20px;font-weight:600;letter-spacing:.14em;color:var(--gold)}
  .tagline{font-size:12px;letter-spacing:.22em;color:var(--dim)}
  .sign{margin-left:auto;font-size:11px;letter-spacing:.12em;color:#7d6647}
  main{flex:1;display:flex;align-items:center;justify-content:center;min-height:0}
  .frame{position:relative;width:min(100%,calc((100svh - 232px)*1.6));aspect-ratio:1.6;
    background:#0d141c;border:1px solid var(--line);border-radius:6px;overflow:hidden;
    box-shadow:0 18px 60px -22px rgba(232,150,60,.28), 0 6px 24px -12px rgba(0,0,0,.8);}
  .frame canvas{position:absolute;inset:0;width:100%;height:100%;display:block}
  .frame:fullscreen{width:100%;height:100%;aspect-ratio:auto;border:0;border-radius:0}
  .frame:fullscreen canvas{left:50%;top:50%;transform:translate(-50%,-50%);
    width:max(100vw,160vh);height:max(100vh,62.5vw)}
  .hint{position:absolute;left:12px;bottom:10px;font-size:11px;letter-spacing:.14em;color:#d8c193;
    text-shadow:0 1px 6px rgba(0,0,0,.8);pointer-events:none;opacity:.85}
  #skip{position:absolute;right:12px;top:10px;font:inherit;font-size:11px;letter-spacing:.16em;
    color:#f4e3c2;background:rgba(20,14,10,.55);border:1px solid rgba(246,187,94,.4);
    border-radius:999px;padding:5px 12px;cursor:pointer;backdrop-filter:blur(3px)}
  #skip:hover{background:rgba(232,150,60,.28)}
  #skip[hidden]{display:none}
  .deck{display:flex;align-items:center;gap:16px;flex-wrap:wrap;
    background:var(--panel);border:1px solid var(--line);border-radius:8px;padding:10px 14px}
  button{font:inherit;font-size:12px;letter-spacing:.14em;color:var(--ink);cursor:pointer;
    background:linear-gradient(180deg,#2a1d13,#20150e);border:1px solid #4a3521;border-radius:6px;
    padding:7px 14px;transition:border-color .15s, background .15s, transform .05s}
  button:hover{border-color:var(--amber);background:linear-gradient(180deg,#33241663,#20150e),#2a1d13}
  button:active{transform:translateY(1px)}
  button:disabled{opacity:.45;cursor:default}
  #pause{min-width:76px;border-color:#5a4026;color:var(--gold)}
  .ctl{display:flex;align-items:center;gap:8px;font-size:11px;letter-spacing:.1em;color:var(--dim)}
  .ctl output{min-width:44px;text-align:right;color:var(--gold);font-variant-numeric:tabular-nums}
  input[type=range]{-webkit-appearance:none;appearance:none;width:110px;height:4px;border-radius:2px;
    background:linear-gradient(90deg,var(--teal),var(--amber));outline:none;cursor:pointer}
  input[type=range]::-webkit-slider-thumb{-webkit-appearance:none;appearance:none;width:13px;height:13px;
    border-radius:50%;background:var(--gold);border:2px solid #20150e;box-shadow:0 0 8px rgba(246,187,94,.6)}
  input[type=range]::-moz-range-thumb{width:13px;height:13px;border-radius:50%;background:var(--gold);
    border:2px solid #20150e;box-shadow:0 0 8px rgba(246,187,94,.6)}
  input[type=range]:focus-visible{box-shadow:0 0 0 2px rgba(57,163,173,.5)}
  .acts{margin-left:auto;display:flex;gap:8px}
  footer{display:flex;align-items:center;gap:10px;font-size:11px;letter-spacing:.14em;color:#7d6647}
  #status{color:var(--dim)}
  .deck::-webkit-scrollbar,.hall::-webkit-scrollbar{height:8px;width:8px}
  .deck::-webkit-scrollbar-track,.hall::-webkit-scrollbar-track{background:#1a120c}
  .deck::-webkit-scrollbar-thumb,.hall::-webkit-scrollbar-thumb{background:#4a3521;border-radius:4px}
  .deck::-webkit-scrollbar-thumb:hover,.hall::-webkit-scrollbar-thumb:hover{background:var(--amber)}
  @media(max-width:680px){
    .hall{padding:10px 12px 8px}
    h1{font-size:16px}
    .sign{display:none}
    .frame{width:100%;aspect-ratio:1.45}
    .deck{gap:10px;padding:8px 10px;overflow-x:auto;flex-wrap:nowrap}
    .ctl{flex:0 0 auto}
    input[type=range]{width:84px}
    .acts{margin-left:0}
  }
  @media(prefers-reduced-motion:reduce){*{transition:none!important}}
</style>
</head>
<body>
<div class="hall">
  <header>
    <h1>落日与海</h1>
    <span class="tagline">涡流笔触 · 生长开场</span>
    <span class="sign">零依赖 · Canvas2D + WebGL2</span>
  </header>
  <main>
    <div class="frame" id="frame">
      <canvas id="sky" role="img" aria-label="落日与海：梵高式流线笔触，橙金天空涡卷围绕半升落日，深青海面泛起金色倒影。"></canvas>
      <span class="hint">空格 暂停 · R 重绘 · F 全屏 · S 保存</span>
      <button id="skip" hidden>跳过生长 ›</button>
    </div>
  </main>
  <div class="deck">
    <button id="pause">暂停</button>
    <label class="ctl">流速<input id="speed" type="range" min="0.2" max="3" step="0.05" value="1"><output id="speedOut">1.00</output></label>
    <label class="ctl">笔触<input id="density" type="range" min="2000" max="32000" step="500" value="20000"><output id="densityOut">20000</output></label>
    <label class="ctl">辉光<input id="bloom" type="range" min="0" max="2" step="0.05" value="0.5"><output id="bloomOut">0.50</output></label>
    <label class="ctl">曝光<input id="exposure" type="range" min="0.4" max="2.5" step="0.05" value="1.05"><output id="exposureOut">1.05</output></label>
    <div class="acts">
      <button id="redraw">重新绘制</button>
      <button id="save">保存画面</button>
      <button id="full">全屏</button>
    </div>
  </div>
  <footer><span id="status">正在起笔…</span></footer>
</div>

<script>
'use strict';
/* ============================================================
   落日与海 · 涡流笔触（单文件 / 零依赖 / 无外部资源）
   复刻目标：橙金涡卷天空 + 半升落日同心光晕 + 深青海面金色倒影
   管线：Canvas2D 粒子笔触 → WebGL2 浮点拖尾累积 → 辉光 → ACES
   开场：数处光辉点燃后缓慢蔓延成画（生长效果），可跳过
   ============================================================ */

const TAU = Math.PI * 2;
const W = 1.6, H = 1;
const HOR = 0.55;                          // 海平线
const SUN = { x: 0.60, y: 0.50, r: 0.10 }; // 半升落日
const $ = s => document.querySelector(s);

const skyEl = $('#sky'), frameEl = $('#frame'), statusEl = $('#status');
const pauseBtn = $('#pause'), skipBtn = $('#skip');
const reducedMotion = matchMedia('(prefers-reduced-motion: reduce)').matches;

const PREF_KEY = 'sunset-sea.prefs.v1';
const params = { speed: 1, density: 24000, bloom: 0.5, exposure: 1.05 };
try {
  const saved = JSON.parse(localStorage.getItem(PREF_KEY) || 'null');
  if (saved) for (const k of Object.keys(params)) if (typeof saved[k] === 'number') params[k] = saved[k];
} catch {}
params.speed = Math.min(3, Math.max(0.2, params.speed));
params.density = Math.min(32000, Math.max(2000, Math.round(params.density)));
params.bloom = Math.min(2, Math.max(0, params.bloom));
params.exposure = Math.min(2.5, Math.max(0.4, params.exposure));
function remember() { try { localStorage.setItem(PREF_KEY, JSON.stringify(params)); } catch {} }

let seed = 18890601;
function rnd() { seed = (Math.imul(seed, 1664525) + 1013904223) >>> 0; return seed / 4294967296; }

/* ---------- 天空涡卷 ---------- */
const VORT = [
  { x: 0.17, y: 0.28, r: 0.075, s: 0.16, warm: true },
  { x: 0.335, y: 0.205, r: 0.055, s: -0.14, warm: true },
  { x: 0.02, y: 0.26, r: 0.050, s: 0.12, warm: true },
  { x: 0.86, y: 0.18, r: 0.042, s: -0.10, warm: true },
  { x: SUN.x, y: SUN.y, r: SUN.r, s: -0.20, warm: true },
];
/* ---------- 流线带：天空细浪 / 海面涌浪 ---------- */
const SKY_BANDS = [
  { y0: 0.045, A: 0.012, k: 5.0, p: 0.4 },
  { y0: 0.085, A: 0.014, k: 4.4, p: 1.7 },
  { y0: 0.125, A: 0.016, k: 6.1, p: 2.9 },
  { y0: 0.165, A: 0.014, k: 5.6, p: 0.9 },
  { y0: 0.205, A: 0.017, k: 4.2, p: 2.2 },
  { y0: 0.245, A: 0.015, k: 6.6, p: 1.1 },
  { y0: 0.285, A: 0.016, k: 5.1, p: 3.4 },
  { y0: 0.325, A: 0.014, k: 4.7, p: 0.6 },
  { y0: 0.365, A: 0.015, k: 6.3, p: 2.5 },
  { y0: 0.405, A: 0.013, k: 5.4, p: 1.4 },
  { y0: 0.445, A: 0.012, k: 6.9, p: 3.0 },
  { y0: 0.485, A: 0.010, k: 5.8, p: 0.2 },
  { y0: 0.520, A: 0.008, k: 6.4, p: 1.9 },
];
const SEA_BANDS = [
  { y0: 0.585, A: 0.014, k: 6.5, p: 0.3 },
  { y0: 0.630, A: 0.017, k: 5.4, p: 1.4 },
  { y0: 0.675, A: 0.020, k: 6.9, p: 2.6 },
  { y0: 0.720, A: 0.022, k: 5.9, p: 0.8 },
  { y0: 0.765, A: 0.024, k: 6.4, p: 2.0 },
  { y0: 0.810, A: 0.025, k: 5.2, p: 1.1 },
  { y0: 0.855, A: 0.026, k: 6.7, p: 3.2 },
  { y0: 0.900, A: 0.027, k: 5.6, p: 0.5 },
  { y0: 0.945, A: 0.027, k: 6.2, p: 2.3 },
  { y0: 0.990, A: 0.026, k: 5.0, p: 1.6 },
];
const bandY = (b, x) => b.y0 + b.A * Math.sin(b.k * x + b.p) + 0.006 * Math.sin(b.k * 2.3 * x + b.p * 1.7);
const bandD = (b, x) => b.A * b.k * Math.cos(b.k * x + b.p) + 0.006 * b.k * 2.3 * Math.cos(b.k * 2.3 * x + b.p * 1.7);
const reflW = y => 0.035 + 0.30 * Math.max(0, y - HOR);   // 金色倒影随深度展宽

function field(x, y) {
  const sea = y >= HOR;
  const bands = sea ? SEA_BANDS : SKY_BANDS;
  let vx = sea ? 0.13 + 0.03 * Math.sin(y * 23 + x * 5) : 0.10 + 0.02 * Math.sin(y * 17 + x * 3);
  let vy = 0;
  // 沿最近流带的切线方向走，形成起伏的横向流线
  let best = 1e9, bw = 0, bd = 0;
  for (const b of bands) {
    const d = y - bandY(b, x);
    const w = Math.exp(-((d / 0.035) ** 2));
    if (w > bw) { bw = w; bd = bandD(b, x); }
    if (Math.abs(d) < best) best = Math.abs(d);
  }
  vy += bw * bd * vx * 0.9;
  // 天空涡卷 + 落日旋涡
  let gmax = 0, rx = 0, ry = 0;
  for (const v of VORT) {
    const dx = x - v.x, dy = (y - v.y) / 0.85;
    const r2 = dx * dx + dy * dy;
    const cut = v.r * 3.4;
    if (r2 > cut * cut) continue;
    const g = Math.exp(-r2 / (2 * v.r * v.r));
    if (g > gmax) gmax = g;
    const a = v.s * g / Math.sqrt(r2 + 0.0012);
    const sink = 0.16 * g;
    rx += -dy * a - dx * sink;
    ry += dx * a * 0.85 - dy * sink * 0.85;
  }
  const damp = sea ? 0.35 : 1;   // 海面以下涡卷减弱
  vx = vx * (1 - 0.7 * gmax * damp) + rx * damp;
  vy = vy * (1 - 0.7 * gmax * damp) + ry * damp;
  return [vx, vy];
}

function emphasis(x, y) {
  const sea = y >= HOR;
  let s = sea ? 0.05 : 0.06;
  for (const b of (sea ? SEA_BANDS : SKY_BANDS)) {
    const d = y - bandY(b, x);
    s = Math.max(s, (sea ? 1.0 : 0.95) * Math.exp(-((d / (sea ? 0.011 : 0.010)) ** 2)));
  }
  if (!sea) {
    for (const v of VORT) {
      const r = Math.hypot(x - v.x, (y - v.y) / 0.85) / v.r;
      if (r > 3.6) continue;
      const ang = Math.atan2((y - v.y) / 0.85, x - v.x);
      const brush = 0.78 + 0.22 * Math.sin(ang * 2 + Math.log(r + 0.15) * 2.4 + v.x * 4);
      s = Math.max(s, Math.exp(-(((r - 1.05) / 0.68) ** 2)) * brush * 0.9);
    }
    // 落日同心光环（仅海平线以上）
    const d = Math.hypot(x - SUN.x, (y - SUN.y) / 0.9) / SUN.r;
    for (const rr of [0.45, 0.7, 0.95, 1.25, 1.6]) {
      s = Math.max(s, 1.0 * Math.exp(-(((d - rr) / 0.07) ** 2)));
    }
  } else {
    // 倒影列：浪尖上的金色更亮
    const g = Math.exp(-(((x - SUN.x) / reflW(y)) ** 2));
    s = Math.max(s, 0.5 * g);
  }
  return Math.min(1, s);
}

/* ---------- 配色：天空暖橙 / 海面深青 / 倒影金 / 日核米白 ---------- */
const SKY = ['#3b3247', '#7a3a22', '#a85426', '#cf752c', '#e8963c', '#f6bb5e', '#ffdf9a'];
const SEA = ['#0b2434', '#123c50', '#1a566b', '#237b8c', '#39a3ad', '#63c9c9', '#a8e6da'];
const GOLD = ['#8a6a2c', '#b3873a', '#d9a94a', '#f2c766', '#ffe08c', '#fff0b8', '#fff6d8'];
const SUNC = ['#e8b45c', '#f2c766', '#ffdf9a', '#ffedb0'];
const FEATHER = 0.10;
let growth = null;
const cellCache = new Map();
function cellInfo(x, y) {
  const key = ((x * 80) | 0) * 128 + ((y * 80) | 0);
  let c = cellCache.get(key);
  if (c) return c;
  const sea = y >= HOR;
  const em = emphasis(x, y);
  const dSun = Math.hypot(x - SUN.x, (y - SUN.y) / 0.9);
  const sun = sea ? 0 : Math.exp(-((dSun / (SUN.r * 0.55)) ** 2));
  let gold = 0;
  if (sea) {
    gold = Math.exp(-(((x - SUN.x) / reflW(y)) ** 2)) * (0.35 + 0.65 * em);
  }
  const kind = sun > 0.45 ? 3 : (gold > 0.38 ? 2 : (sea ? 1 : 0));
  let g = 1;
  if (growth) {
    g = 0;
    for (const s of growth) {
      if (s.rOut2 <= 0) continue;
      const dx = x - s.x, dy = y - s.y, d2 = dx * dx + dy * dy;
      if (d2 >= s.rOut2) continue;
      const d = Math.sqrt(d2);
      const v = d <= s.r ? 1 : (s.rOut - d) / FEATHER;
      if (v > g) g = v;
      if (g >= 1) break;
    }
  }
  const f = field(x, y);
  c = { em, kind, g, fx: f[0], fy: f[1] };
  cellCache.set(key, c);
  return c;
}
function colorOf(info, tone) {
  if (info.kind === 3) return SUNC[tone % 4];
  if (info.kind === 2) return GOLD[Math.min(5, tone)];
  return (info.kind === 0 ? SKY : SEA)[tone];
}
function colorAt(x, y, tone) { return colorOf(cellInfo(x, y), tone); }

/* ---------- WebGL2 合成器 ---------- */
class Film {
  constructor(canvas) {
    const gl = canvas.getContext('webgl2', { alpha: false, antialias: false, preserveDrawingBuffer: true, powerPreference: 'high-performance' });
    if (!gl) throw new Error('no webgl2');
    this.gl = gl;
    this.hdr = !!gl.getExtension('EXT_color_buffer_float');
    const VS = `#version 300 es
      layout(location=0) in vec2 aPos; out vec2 vUv;
      void main(){ vUv = aPos * .5 + .5; gl_Position = vec4(aPos, 0., 1.); }`;
    const HEAD = `#version 300 es
      precision highp float; in vec2 vUv; out vec4 o;`;
    const FS_ACC = HEAD + `
      uniform sampler2D uInk, uBase, uPrev; uniform float uDecay;
      uniform float uGrow; uniform vec4 uSeeds[6];
      vec3 lin(vec3 c){ return pow(c, vec3(2.2)); }
      void main(){
        vec2 uv = vec2(vUv.x, 1. - vUv.y);
        vec4 ink = texture(uInk, uv);
        vec3 base = lin(texture(uBase, uv).rgb);
        if (uGrow > .5) {
          vec2 p = vec2(uv.x * 1.6, uv.y);
          float g = 0.;
          for (int i = 0; i < 6; i++) {
            vec4 s = uSeeds[i];
            if (s.w <= 0.) continue;
            g = max(g, clamp((s.w - length(p - s.xy)) / 0.10, 0., 1.));
          }
          base *= g;
        }
        vec3 prev = texture(uPrev, vUv).rgb;
        o = vec4(prev * (1. - uDecay) + base * uDecay + lin(ink.rgb) * ink.a * .5, 1.);
      }`;
    const FS_EXT = HEAD + `
      uniform sampler2D uSrc;
      void main(){
        vec3 c = texture(uSrc, vUv).rgb * 2.;
        float l = max(c.r, max(c.g, c.b));
        o = vec4(c * smoothstep(.15, .7, l), 1.);
      }`;
    const FS_BLUR = HEAD + `
      uniform sampler2D uSrc; uniform vec2 uTexel, uDir;
      void main(){
        vec2 d = uTexel * uDir;
        vec3 c = texture(uSrc, vUv).rgb * .227027;
        c += (texture(uSrc, vUv + d * 1.384615).rgb + texture(uSrc, vUv - d * 1.384615).rgb) * .316216;
        c += (texture(uSrc, vUv + d * 3.230769).rgb + texture(uSrc, vUv - d * 3.230769).rgb) * .070270;
        o = vec4(c, 1.);
      }`;
    const FS_COMP = HEAD + `
      uniform sampler2D uScene, uGlow; uniform float uBloom, uExposure;
      vec3 aces(vec3 x){ return clamp((x * (2.51 * x + .03)) / (x * (2.43 * x + .59) + .14), 0., 1.); }
      void main(){
        vec3 base = texture(uScene, vUv).rgb * 2.;
        vec3 c = aces((base + texture(uGlow, vUv).rgb * uBloom * .75) * uExposure);
        float vig = 1. - .16 * pow(length((vUv - .5) * vec2(1.1, 1.)), 1.5);
        c = pow(c * vig, vec3(1. / 2.2));
        float grain = fract(sin(dot(gl_FragCoord.xy, vec2(12.9898, 78.233))) * 43758.5453) - .5;
        o = vec4(clamp(c + grain * .003, 0., 1.), 1.);
      }`;
    this.pAcc = this.prog(VS, FS_ACC);
    this.pExt = this.prog(VS, FS_EXT);
    this.pBlur = this.prog(VS, FS_BLUR);
    this.pComp = this.prog(VS, FS_COMP);
    this.buf = gl.createBuffer();
    gl.bindBuffer(gl.ARRAY_BUFFER, this.buf);
    gl.bufferData(gl.ARRAY_BUFFER, new Float32Array([-1, -1, 1, -1, -1, 1, 1, 1]), gl.STATIC_DRAW);
    gl.enableVertexAttribArray(0);
    gl.vertexAttribPointer(0, 2, gl.FLOAT, false, 0, 0);
    this.ink = this.tex(); this.base = this.tex();
    this.hist = []; this.bloomT = []; this.idx = 0;
  }
  prog(vs, fs) {
    const gl = this.gl, p = gl.createProgram();
    for (const [t, src] of [[gl.VERTEX_SHADER, vs], [gl.FRAGMENT_SHADER, fs]]) {
      const s = gl.createShader(t);
      gl.shaderSource(s, src); gl.compileShader(s);
      if (!gl.getShaderParameter(s, gl.COMPILE_STATUS)) throw new Error(gl.getShaderInfoLog(s));
      gl.attachShader(p, s); gl.deleteShader(s);
    }
    gl.linkProgram(p);
    if (!gl.getProgramParameter(p, gl.LINK_STATUS)) throw new Error(gl.getProgramInfoLog(p));
    const u = {};
    const n = gl.getProgramParameter(p, gl.ACTIVE_UNIFORMS);
    for (let i = 0; i < n; i++) { const info = gl.getActiveUniform(p, i); u[info.name] = gl.getUniformLocation(p, info.name); u[info.name.replace('[0]', '')] = u[info.name]; }
    return { p, u };
  }
  tex() {
    const gl = this.gl, t = gl.createTexture();
    gl.bindTexture(gl.TEXTURE_2D, t);
    gl.texParameteri(gl.TEXTURE_2D, gl.TEXTURE_MIN_FILTER, gl.LINEAR);
    gl.texParameteri(gl.TEXTURE_2D, gl.TEXTURE_MAG_FILTER, gl.LINEAR);
    gl.texParameteri(gl.TEXTURE_2D, gl.TEXTURE_WRAP_S, gl.CLAMP_TO_EDGE);
    gl.texParameteri(gl.TEXTURE_2D, gl.TEXTURE_WRAP_T, gl.CLAMP_TO_EDGE);
    return t;
  }
  target(w, h) {
    const gl = this.gl, t = this.tex();
    gl.texImage2D(gl.TEXTURE_2D, 0, this.hdr ? gl.RGBA16F : gl.RGBA, w, h, 0, gl.RGBA, this.hdr ? gl.HALF_FLOAT : gl.UNSIGNED_BYTE, null);
    const f = gl.createFramebuffer();
    gl.bindFramebuffer(gl.FRAMEBUFFER, f);

/* ---------- 生长开场 ---------- */
const SEEDS = [

  { x: 0.17, y: 0.28, t0: 0.90, dur: 5.9, maxR: 0.95, warm: true },

  { x: 0.82, y: 0.80, t0: 2.80, dur: 5.2, maxR: 0.90, warm: false },

/* ---------- 状态机 ---------- */
