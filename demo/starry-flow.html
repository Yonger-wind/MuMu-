<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="theme-color" content="#060d15">
<title>星月夜 · 风的笔迹</title>
<style>
  :root{
    color-scheme:dark;
    --bg:#060d15; --panel:#0e1a24; --line:#9db8ac26;
    --text:#ece7d3; --muted:#87a0a3; --gold:#e3cd84; --cyan:#8fc6cf;
  }
  *{box-sizing:border-box}
  html,body{margin:0}
  body{
    background:
      radial-gradient(ellipse at 12% -4%, #14303c4d, transparent 46%),
      radial-gradient(ellipse at 92% 104%, #33301c1f, transparent 42%),
      var(--bg);
    color:var(--text);
    font-family:"Microsoft YaHei","PingFang SC",sans-serif;
  }
  .hall{min-height:100svh;max-width:1760px;margin:0 auto;display:flex;flex-direction:column;gap:20px;padding:26px 3.4vw 18px}
  header{display:flex;justify-content:space-between;align-items:flex-end;gap:18px;padding:0 4px}
  h1{margin:0;font-family:"Noto Serif SC","Songti SC",SimSun,serif;font-weight:400;font-size:30px;letter-spacing:.22em;color:#eee5c4;text-shadow:0 0 26px #e3cd8418}
  .tagline{margin:8px 0 0;font-size:11px;letter-spacing:.24em;color:var(--muted)}
  .sign{font:italic 19px Georgia,serif;color:#aebfb6;text-align:right}
  .sign small{display:block;margin-top:6px;font:10px "Microsoft YaHei",sans-serif;letter-spacing:.14em;color:var(--muted)}
  main{flex:1;min-height:220px;display:flex;align-items:center;justify-content:center}
  .frame{
    position:relative;width:min(100%,calc((100svh - 232px)*1.6));aspect-ratio:1.6;
    background:#081019;border-radius:4px;overflow:hidden;
    box-shadow:0 0 0 1px #bccdb51c, 0 22px 90px #000a, 0 0 80px #2c647222;
  }
  .frame canvas{position:absolute;inset:0;display:block;width:100%;height:100%}
  #sky{opacity:1}
  .frame:fullscreen{width:100vw;height:100vh;display:flex;align-items:center;justify-content:center;background:#081019;border-radius:0}
  .frame:fullscreen canvas{position:absolute;left:50%;top:50%;transform:translate(-50%,-50%);width:min(100vw,160vh);height:min(100vh,62.5vw)}
  .hint{position:absolute;left:20px;bottom:14px;font-size:11px;letter-spacing:.14em;color:#b7c9bc;opacity:.55;pointer-events:none;transition:opacity .8s}
  .frame:hover .hint{opacity:.95}
  #skip{
    position:absolute;right:16px;bottom:12px;font-size:11px;letter-spacing:.18em;
    color:#d8e4da;background:#0d1a23b8;border:1px solid #819c9b45;border-radius:999px;
    padding:7px 14px;cursor:pointer;transition:opacity .4s,border-color .2s;
  }
  #skip:hover{border-color:#d8c57288}
  #skip.gone{opacity:0;pointer-events:none}
  .deck{
    align-self:center;max-width:100%;display:flex;flex-wrap:wrap;align-items:center;justify-content:center;
    gap:13px 20px;padding:13px 20px;border-radius:12px;
    background:linear-gradient(112deg,#13212bd6,#0f1a23d6);
    border:1px solid var(--line);box-shadow:0 14px 44px #0006;
  }
  button{
    font:12px "Microsoft YaHei",sans-serif;color:var(--text);white-space:nowrap;cursor:pointer;
    background:#c8d9c808;border:1px solid #819c9b3d;border-radius:7px;padding:9px 14px;
    transition:background .2s,border-color .2s,transform .2s;
  }
  button:hover{background:#d8c57216;border-color:#d8c57285;transform:translateY(-1px)}
  button:disabled{opacity:.4;cursor:default;transform:none}
  button:focus-visible,input:focus-visible{outline:2px solid var(--gold);outline-offset:3px}
  button.main{border-color:#c4b36780;color:#f0dc97;background:#dbc06410}
  .ctl{display:flex;align-items:center;gap:8px;font-size:11px;color:var(--muted)}
  .ctl input[type=range]{width:84px;accent-color:var(--gold);cursor:pointer}
  .ctl output{min-width:34px;font-size:10px;color:#d6ded2;font-variant-numeric:tabular-nums}
  .acts{display:flex;gap:8px}
  footer{display:flex;justify-content:center;flex-wrap:wrap;gap:6px 18px;min-height:16px;font-size:10px;letter-spacing:.1em;color:#6f8689}
  footer .live{color:var(--gold)}
  @media(max-width:680px){
    .hall{padding:20px 14px 14px;gap:16px}
    h1{font-size:23px}
    .sign{font-size:15px}
    .sign small{font-size:9px}
    .frame{width:100%}
    main{min-height:200px}
    .deck{gap:11px 14px;padding:11px 14px}
    .ctl input[type=range]{width:86px}
    .hint{left:12px;bottom:10px;font-size:9px}
    #skip{right:10px;bottom:8px}
  }
  @media(prefers-reduced-motion:reduce){*{transition:none!important}}
</style>
</head>
<body>
<div class="hall">
  <header>
    <div>
      <h1>星月夜 · 风的笔迹</h1>
      <p class="tagline">粒子为颜料 · 流场为画笔</p>
    </div>
    <div class="sign">The Starry Night<small>程序化笔触 · 向文森特·梵高致意 · 1889</small></div>
  </header>

  <main>
    <div class="frame" id="frame">
      <canvas id="sky" role="img" aria-label="梵高星月夜风格的流动星空：蓝青色笔触围绕金色星体旋转，下方是起伏的光带。"></canvas>
      <span class="hint">空格 暂停 / 继续 · F 全屏 · S 保存</span>
      <button id="skip" type="button">跳过开场 ›</button>
    </div>
  </main>

  <div class="deck" aria-label="画面控制">
    <button id="pause" class="main" aria-pressed="false" disabled>暂停流动</button>
    <label class="ctl">流动速度<input id="speed" type="range" min="0.25" max="2" step="0.05" value="1"><output id="speed-out">1.00×</output></label>
    <label class="ctl">笔触密度<input id="density" type="range" min="6000" max="32000" step="1000" value="20000"><output id="density-out">20000</output></label>
    <label class="ctl">辉光<input id="bloom" type="range" min="0" max="1.8" step="0.05" value="0.35"><output id="bloom-out">0.35</output></label>
    <label class="ctl">曝光<input id="exposure" type="range" min="0.6" max="2" step="0.05" value="1"><output id="exposure-out">1.00</output></label>
    <div class="acts">
      <button id="redraw">重新绘制</button>
      <button id="save">保存图片</button>
      <button id="full">全屏欣赏</button>
    </div>
  </div>

  <footer>
    <span>一笔一划皆由算法生成，非原画逐像素复刻</span>
    <span id="status" class="live" role="status" aria-live="polite">正在铺开夜色…</span>
  </footer>
</div>

<script>
'use strict';
/* ============================================================
   星月夜 · 风的笔迹 —— 单文件 / 零依赖 / 无外部资源
   管线：Canvas2D 粒子笔触 → WebGL2 浮点拖尾累积 → 辉光 → ACES
   开场：数处光辉同时点燃，笔触沿各自流场缓慢蔓延成画（约 8.6s）
   ============================================================ */

const TAU = Math.PI * 2;
const W = 1.6, H = 1;                       // 画布逻辑坐标：宽 1.6 × 高 1
const $ = s => document.querySelector(s);

const skyEl = $('#sky'), frameEl = $('#frame');
const statusEl = $('#status'), pauseBtn = $('#pause'), skipBtn = $('#skip');
const reducedMotion = matchMedia('(prefers-reduced-motion: reduce)').matches;

/* ---------- 可调参数（localStorage 记忆） ---------- */
const PREF_KEY = 'starry-flow.prefs.v1';
const params = { speed: 1, density: 20000, bloom: 0.35, exposure: 1 };
try {
  const saved = JSON.parse(localStorage.getItem(PREF_KEY) || '{}');
  for (const k of Object.keys(params)) {
    const v = Number(saved[k]);
    if (Number.isFinite(v)) params[k] = v;
  }
} catch {}
params.speed = Math.min(2, Math.max(0.25, params.speed));
params.density = Math.round(Math.min(32000, Math.max(6000, params.density)) / 1000) * 1000;
params.bloom = Math.min(1.8, Math.max(0, params.bloom));
params.exposure = Math.min(2, Math.max(0.6, params.exposure));
function remember() { try { localStorage.setItem(PREF_KEY, JSON.stringify(params)); } catch {} }

/* ---------- 确定性随机 ---------- */
let seed = 18890601;
function rnd() { seed = (Math.imul(seed, 1664525) + 1013904223) >>> 0; return seed / 4294967296; }

/* ---------- 流场：涡旋 + 横向风 + 起伏光带 ---------- */
const VORT = [
  { x: 0.60, y: 0.40, r: 0.150, s: -0.34, warm: false },  // 主涡旋
  { x: 0.79, y: 0.50, r: 0.092, s: -0.22, warm: false },  // 副涡旋
  { x: 1.28, y: 0.22, r: 0.100, s: -0.26, warm: true },   // 大星
  { x: 1.47, y: 0.115, r: 0.075, s: 0.18, warm: true },   // 月
  { x: 0.18, y: 0.16, r: 0.052, s: 0.15, warm: true },
  { x: 0.42, y: 0.10, r: 0.038, s: -0.12, warm: true },
  { x: 0.95, y: 0.12, r: 0.042, s: 0.13, warm: true },
  { x: 1.12, y: 0.43, r: 0.050, s: -0.14, warm: true },
  { x: 0.30, y: 0.31, r: 0.046, s: 0.12, warm: false },
  { x: 1.42, y: 0.40, r: 0.040, s: 0.10, warm: true },
  { x: 0.10, y: 0.44, r: 0.050, s: -0.12, warm: false },
];
const waveY = x => 0.72 + 0.05 * Math.sin(5.5 * x - 0.8) + 0.012 * Math.sin(13 * x);
const lowY  = x => 0.855 + 0.032 * Math.sin(4.6 * x + 1.1) + 0.011 * Math.sin(11 * x - 0.6);
const deepY = x => 0.955 + 0.022 * Math.sin(5.8 * x - 1.3);

function field(x, y) {
  let vx = 0.10 + 0.02 * Math.sin(y * 13 + x * 2.5);
  let vy = 0.02 * Math.sin(x * 8 + y * 4);
  let gmax = 0, rx = 0, ry = 0;
  for (const v of VORT) {
    const dx = x - v.x + 0.01 * Math.sin(y * 12 + x * 2);
    const dy = (y - v.y) / 0.85;
    const r2 = dx * dx + dy * dy;
    const cut = v.r * 3.4;
    if (r2 > cut * cut) continue;          // 远场高斯已可忽略，跳过 exp/sqrt
    const g = Math.exp(-r2 / (2 * v.r * v.r));
    if (g > gmax) gmax = g;
    const a = v.s * g / Math.sqrt(r2 + 0.0012);
    const sink = (v.warm ? 0.12 : 0.22) * g;
    rx += -dy * a - dx * sink;
    ry += dx * a * 0.85 - dy * sink * 0.85;
  }
  const band = Math.exp(-(((y - waveY(x)) / 0.06) ** 2));
  vx = vx * (1 - 0.8 * gmax) + rx + 0.15 * band;
  vy = vy * (1 - 0.8 * gmax) + ry + 0.15 * band * (0.275 * Math.cos(5.5 * x - 0.8) + 0.156 * Math.cos(13 * x));
  const bA = Math.exp(-(((y - lowY(x)) / 0.045) ** 2));
  const bB = Math.exp(-(((y - deepY(x)) / 0.055) ** 2));
  vx += 0.10 * bA + 0.08 * bB;
  vy += 0.10 * bA * (0.147 * Math.cos(4.6 * x + 1.1) + 0.121 * Math.cos(11 * x - 0.6))
      + 0.08 * bB * 0.128 * Math.cos(5.8 * x - 1.3);
  return [vx, vy];
}

/* 亮度权重：涡旋环 / 光带 / 天空横带，决定笔触透明度 */
function emphasis(x, y) {
  let s = 0.05;
  for (const v of VORT) {
    const r = Math.hypot(x - v.x, (y - v.y) / 0.85) / v.r;
    if (r > 3.6) continue;                 // 环权重已可忽略
    const ang = Math.atan2((y - v.y) / 0.85, x - v.x);
    const brush = 0.78 + 0.22 * Math.sin(ang * 2 + Math.log(r + 0.15) * 2.4 + v.x * 4);
    const ring = Math.exp(-(((r - 1.05) / 0.68) ** 2));
    s = Math.max(s, ring * brush * (v.warm ? 0.95 : 0.9));
  }
  s = Math.max(s, 0.85 * Math.exp(-(((y - waveY(x)) / 0.036) ** 2)));
  s = Math.max(s, 0.48 * Math.exp(-(((y - (0.40 + 0.15 * Math.sin(x * 4 - 0.6))) / 0.06) ** 2)));
  s = Math.max(s, 0.44 * Math.exp(-(((x - 0.43) / 0.38) ** 4)) * Math.exp(-(((y - (0.21 + 0.065 * Math.sin(x * 7 - 0.6))) / 0.048) ** 2)));
  s = Math.max(s, 0.43 * Math.exp(-(((x - 1.41) / 0.30) ** 4)) * Math.exp(-(((y - (0.51 + 0.045 * Math.sin(x * 10))) / 0.065) ** 2)));
  s = Math.max(s, 0.56 * Math.exp(-(((y - lowY(x)) / 0.035) ** 2)));
  s = Math.max(s, 0.38 * Math.exp(-(((y - deepY(x)) / 0.042) ** 2)));
  return Math.min(1, s);
}

const COLD = ['#123049', '#1f5069', '#35799a', '#5aa3b8', '#8cc6cd', '#bcdad2', '#e2e8c9'];
const GOLD = ['#4a4a26', '#837c34', '#b3a53e', '#d2bc4e', '#ebd067', '#ffe296', '#ffefb0'];
/* 单元格缓存：亮度权重 / 暖度 / 低带金斑 / 开场生长门控，避免每粒子重复超越函数 */
const FEATHER = 0.10;
let growth = null;                 // 开场时为各光辉处的扩散半径数组，live 时为 null
const cellCache = new Map();
function cellInfo(x, y) {
  const key = ((x * 80) | 0) * 128 + ((y * 80) | 0);
  let c = cellCache.get(key);
  if (c) return c;
  let warmth = 0;
  for (const v of VORT) if (v.warm) {
    const dx = x - v.x, dy = y - v.y;
    const d2 = dx * dx + dy * dy;
    if (d2 > v.r * v.r * 9) continue;
    warmth = Math.max(warmth, Math.exp(-d2 / (1.55 * v.r * v.r)));
  }
  if (Math.abs(y - waveY(x)) < 0.027) warmth = Math.max(warmth, 0.77);
  const goldLow = y > 0.80 && Math.abs(y - lowY(x)) < 0.006 && Math.sin(x * 9 + 0.8) > 0.25;
  let g = 1;
  if (growth) {
    g = 0;
    for (const s of growth) {
      if (s.rOut2 <= 0) continue;
      const dx = x - s.x, dy = y - s.y, d2 = dx * dx + dy * dy;
      if (d2 >= s.rOut2) continue;
      const d = Math.sqrt(d2);
      const v = d <= s.r ? 1 : (s.rOut - d) / FEATHER;
      if (v > g) g = v;
      if (g >= 1) break;
    }
  }
  const f = field(x, y);                   // 流场按单元格缓存，避免每粒子重复 11 涡旋超越函数
  c = { em: emphasis(x, y), warmth, goldLow, g, fx: f[0], fy: f[1] };
  cellCache.set(key, c);
  return c;
}
function colorOf(info, tone) {
  if (info.goldLow) return GOLD[Math.min(4, tone)];
  return (info.warmth > 0.32 ? GOLD : COLD)[tone];
}
function colorAt(x, y, tone) { return colorOf(cellInfo(x, y), tone); }

/* ---------- WebGL2 电影感合成器（拖尾 / 辉光 / ACES） ---------- */
class Film {
  constructor(canvas) {
    const gl = canvas.getContext('webgl2', { alpha: false, antialias: false, preserveDrawingBuffer: true, powerPreference: 'high-performance' });
    if (!gl) throw new Error('no webgl2');
    this.gl = gl;
    this.hdr = !!gl.getExtension('EXT_color_buffer_float');
    const VS = `#version 300 es
      layout(location=0) in vec2 aPos; out vec2 vUv;
      void main(){ vUv = aPos * .5 + .5; gl_Position = vec4(aPos, 0., 1.); }`;
    const HEAD = `#version 300 es
      precision highp float; in vec2 vUv; out vec4 o;`;
    const FS_ACC = HEAD + `
      uniform sampler2D uInk, uBase, uPrev; uniform float uDecay;
      vec3 lin(vec3 c){ return pow(c, vec3(2.2)); }
      void main(){
        vec2 uv = vec2(vUv.x, 1. - vUv.y);
        vec4 ink = texture(uInk, uv);
        vec3 base = lin(texture(uBase, uv).rgb);
        vec3 prev = texture(uPrev, vUv).rgb;
        o = vec4(prev * (1. - uDecay) + base * uDecay + lin(ink.rgb) * ink.a * .5, 1.);
      }`;
    const FS_EXT = HEAD + `
      uniform sampler2D uSrc;
      void main(){
        vec3 c = texture(uSrc, vUv).rgb * 2.;
        float l = max(c.r, max(c.g, c.b));
        o = vec4(c * smoothstep(.15, .7, l), 1.);
      }`;
    const FS_BLUR = HEAD + `
      uniform sampler2D uSrc; uniform vec2 uTexel, uDir;
      void main(){
        vec2 d = uTexel * uDir;
        vec3 c = texture(uSrc, vUv).rgb * .227027;
        c += (texture(uSrc, vUv + d * 1.384615).rgb + texture(uSrc, vUv - d * 1.384615).rgb) * .316216;
        c += (texture(uSrc, vUv + d * 3.230769).rgb + texture(uSrc, vUv - d * 3.230769).rgb) * .070270;
        o = vec4(c, 1.);
      }`;
    const FS_COMP = HEAD + `
      uniform sampler2D uScene, uGlow; uniform float uBloom, uExposure;
      vec3 aces(vec3 x){ return clamp((x * (2.51 * x + .03)) / (x * (2.43 * x + .59) + .14), 0., 1.); }
      void main(){
        vec3 base = texture(uScene, vUv).rgb * 2.;
        vec3 c = aces((base + texture(uGlow, vUv).rgb * uBloom * .75) * uExposure);
        float vig = 1. - .18 * pow(length((vUv - .5) * vec2(1.1, 1.)), 1.5);
        c = pow(c * vig, vec3(1. / 2.2));
        float grain = fract(sin(dot(gl_FragCoord.xy, vec2(12.9898, 78.233))) * 43758.5453) - .5;
        o = vec4(clamp(c + grain * .003, 0., 1.), 1.);
      }`;
    this.pAcc = this.prog(VS, FS_ACC);
    this.pExt = this.prog(VS, FS_EXT);
    this.pBlur = this.prog(VS, FS_BLUR);
    this.pComp = this.prog(VS, FS_COMP);
    this.buf = gl.createBuffer();
    gl.bindBuffer(gl.ARRAY_BUFFER, this.buf);
    gl.bufferData(gl.ARRAY_BUFFER, new Float32Array([-1, -1, 1, -1, -1, 1, 1, 1]), gl.STATIC_DRAW);
    gl.enableVertexAttribArray(0);
    gl.vertexAttribPointer(0, 2, gl.FLOAT, false, 0, 0);
    this.ink = this.tex(); this.base = this.tex();
    this.hist = []; this.bloomT = []; this.idx = 0;
  }
  prog(vs, fs) {
    const gl = this.gl, p = gl.createProgram();
    for (const [t, src] of [[gl.VERTEX_SHADER, vs], [gl.FRAGMENT_SHADER, fs]]) {
      const s = gl.createShader(t);
      gl.shaderSource(s, src); gl.compileShader(s);
      if (!gl.getShaderParameter(s, gl.COMPILE_STATUS)) throw new Error(gl.getShaderInfoLog(s));
      gl.attachShader(p, s); gl.deleteShader(s);
    }
    gl.linkProgram(p);
    if (!gl.getProgramParameter(p, gl.LINK_STATUS)) throw new Error(gl.getProgramInfoLog(p));
    const u = {};
    const n = gl.getProgramParameter(p, gl.ACTIVE_UNIFORMS);
    for (let i = 0; i < n; i++) { const info = gl.getActiveUniform(p, i); u[info.name] = gl.getUniformLocation(p, info.name); }
    return { p, u };
  }
  tex() {
    const gl = this.gl, t = gl.createTexture();
    gl.bindTexture(gl.TEXTURE_2D, t);
    gl.texParameteri(gl.TEXTURE_2D, gl.TEXTURE_MIN_FILTER, gl.LINEAR);
    gl.texParameteri(gl.TEXTURE_2D, gl.TEXTURE_MAG_FILTER, gl.LINEAR);
    gl.texParameteri(gl.TEXTURE_2D, gl.TEXTURE_WRAP_S, gl.CLAMP_TO_EDGE);
    gl.texParameteri(gl.TEXTURE_2D, gl.TEXTURE_WRAP_T, gl.CLAMP_TO_EDGE);
    return t;
  }
  target(w, h) {
    const gl = this.gl, t = this.tex();
    gl.texImage2D(gl.TEXTURE_2D, 0, this.hdr ? gl.RGBA16F : gl.RGBA, w, h, 0, gl.RGBA, this.hdr ? gl.HALF_FLOAT : gl.UNSIGNED_BYTE, null);
    const f = gl.createFramebuffer();
    gl.bindFramebuffer(gl.FRAMEBUFFER, f);
    gl.framebufferTexture2D(gl.FRAMEBUFFER, gl.COLOR_ATTACHMENT0, gl.TEXTURE_2D, t, 0);
    if (gl.checkFramebufferStatus(gl.FRAMEBUFFER) !== gl.FRAMEBUFFER_COMPLETE) throw new Error('bad fbo');
    gl.clearColor(0, 0, 0, 1); gl.clear(gl.COLOR_BUFFER_BIT);
    return { t, f };
  }
  resize(w, h) {
    const gl = this.gl;
    for (const x of [...this.hist, ...this.bloomT]) { gl.deleteTexture(x.t); gl.deleteFramebuffer(x.f); }
    this.w = w; this.h = h;
    this.bw = Math.max(1, w >> 2); this.bh = Math.max(1, h >> 2);
    this.hist = [this.target(w, h), this.target(w, h)];
    this.bloomT = [this.target(this.bw, this.bh), this.target(this.bw, this.bh)];
    this.idx = 0;
    gl.bindFramebuffer(gl.FRAMEBUFFER, null);
  }
  bind(t, unit) { const gl = this.gl; gl.activeTexture(gl.TEXTURE0 + unit); gl.bindTexture(gl.TEXTURE_2D, t); }
  draw(prog, fbo, w, h) {
    const gl = this.gl;
    gl.bindFramebuffer(gl.FRAMEBUFFER, fbo);
    gl.viewport(0, 0, w, h);
    gl.useProgram(prog.p);
    gl.bindBuffer(gl.ARRAY_BUFFER, this.buf);
    gl.vertexAttribPointer(0, 2, gl.FLOAT, false, 0, 0);
  }
  setBase(src) { this.bind(this.base, 0); this.gl.texImage2D(this.gl.TEXTURE_2D, 0, this.gl.RGBA, this.gl.RGBA, this.gl.UNSIGNED_BYTE, src); }
  advance(inkCanvas, dt) {
    const gl = this.gl, next = 1 - this.idx;
    this.bind(this.ink, 0);
    gl.texImage2D(gl.TEXTURE_2D, 0, gl.RGBA, gl.RGBA, gl.UNSIGNED_BYTE, inkCanvas);
    this.draw(this.pAcc, this.hist[next].f, this.w, this.h);
    this.bind(this.ink, 0); this.bind(this.base, 1); this.bind(this.hist[this.idx].t, 2);
    gl.uniform1i(this.pAcc.u.uInk, 0); gl.uniform1i(this.pAcc.u.uBase, 1); gl.uniform1i(this.pAcc.u.uPrev, 2);
    gl.uniform1f(this.pAcc.u.uDecay, Math.min(0.3, 0.03 * dt));
    gl.drawArrays(gl.TRIANGLE_STRIP, 0, 4);
    this.idx = next;
    gl.activeTexture(gl.TEXTURE0);
  }
  render() {
    const gl = this.gl;
    this.draw(this.pExt, this.bloomT[0].f, this.bw, this.bh);
    this.bind(this.hist[this.idx].t, 0); gl.uniform1i(this.pExt.u.uSrc, 0);
    gl.drawArrays(gl.TRIANGLE_STRIP, 0, 4);
    for (let i = 0; i < 6; i++) {
      const dst = (i + 1) % 2;
      this.draw(this.pBlur, this.bloomT[dst].f, this.bw, this.bh);
      this.bind(this.bloomT[i % 2].t, 0);
      gl.uniform1i(this.pBlur.u.uSrc, 0);
      gl.uniform2f(this.pBlur.u.uTexel, 1 / this.bw, 1 / this.bh);
      gl.uniform2f(this.pBlur.u.uDir, i % 2 === 0 ? 1.2 : 0, i % 2 === 1 ? 1.2 : 0);
      gl.drawArrays(gl.TRIANGLE_STRIP, 0, 4);
    }
    this.draw(this.pComp, null, this.w, this.h);
    this.bind(this.hist[this.idx].t, 0); this.bind(this.bloomT[0].t, 1);
    gl.uniform1i(this.pComp.u.uScene, 0); gl.uniform1i(this.pComp.u.uGlow, 1);
    gl.uniform1f(this.pComp.u.uBloom, params.bloom);
    gl.uniform1f(this.pComp.u.uExposure, params.exposure);
    gl.drawArrays(gl.TRIANGLE_STRIP, 0, 4);
    gl.activeTexture(gl.TEXTURE0);
  }
}

/* ---------- 画布与渲染器 ---------- */
let sky = skyEl, gpu = null, ctx2d = null;
try { gpu = new Film(sky); }
catch (err) {
  console.warn('WebGL2 不可用，回退 Canvas：', err.message);
  const clone = sky.cloneNode(); sky.replaceWith(clone); sky = clone;
  ctx2d = sky.getContext('2d', { alpha: false });
  $('#bloom').disabled = true; $('#exposure').disabled = true;
}
const under = document.createElement('canvas'), baseCtx = under.getContext('2d', { alpha: false });
const ink = document.createElement('canvas'), inkCtx = ink.getContext('2d', { alpha: !!gpu });
/* 开场生长遮罩：mask 累积各光辉处的扩散半径，baseIntro 为被遮罩的底涂 */
const maskC = document.createElement('canvas'), maskCtx = maskC.getContext('2d');
const baseIntro = document.createElement('canvas'), bIntroCtx = baseIntro.getContext('2d', { alpha: false });
let scale = 800;

/* ---------- 底涂：静态短笔触 + 暖色星核 ---------- */
function paintUnder() {
  const w = under.width, h = under.height;
  const grad = baseCtx.createLinearGradient(0, 0, 0, h);
  grad.addColorStop(0, '#081019'); grad.addColorStop(0.62, '#0c161f'); grad.addColorStop(1, '#070f17');
  baseCtx.fillStyle = grad; baseCtx.fillRect(0, 0, w, h);
  baseCtx.lineCap = 'round';
  for (let i = 0; i < 26000; i++) {
    let x = rnd() * W, y = rnd();
    if (i % 4 === 1) { x = 0.06 + rnd() * 1.06; y = 0.015 + rnd() * 0.38; }
    if (i % 4 === 2) { x = rnd() * W; y = 0.79 + rnd() * 0.22; }
    if (i % 3 === 0) {
      const v = VORT[Math.floor(rnd() * VORT.length)], a = rnd() * TAU, r = v.r * (0.4 + rnd() * 1.5);
      x = v.x + Math.cos(a) * r; y = v.y + Math.sin(a) * r * 0.85;
    }
    const tone = Math.min(6, Math.floor(rnd() * 7));
    baseCtx.strokeStyle = colorAt(x, y, tone);
    baseCtx.globalAlpha = (0.09 + rnd() * 0.46) * emphasis(x, y);
    baseCtx.lineWidth = (0.4 + rnd() ** 2 * 1.9) * scale / 800;
    baseCtx.beginPath(); baseCtx.moveTo(x * scale, y * scale);
    const steps = 5 + Math.floor(rnd() * 30);
    for (let j = 0; j < steps; j++) { const d = field(x, y); x += d[0] * 0.012; y += d[1] * 0.012; baseCtx.lineTo(x * scale, y * scale); }
    baseCtx.stroke();
  }
  baseCtx.globalAlpha = 1;
  for (const v of VORT) if (v.warm) {
    const g = baseCtx.createRadialGradient(v.x * scale, v.y * scale, 0, v.x * scale, v.y * scale, v.r * scale);
    g.addColorStop(0, '#e2d18a7d'); g.addColorStop(0.12, '#b5a14c30'); g.addColorStop(1, '#b5a14c00');
    baseCtx.fillStyle = g;
    baseCtx.fillRect((v.x - v.r) * scale, (v.y - v.r) * scale, v.r * 2 * scale, v.r * 2 * scale);
  }
  inkCtx.drawImage(under, 0, 0);
}

/* ---------- 粒子笔触 ---------- */
let particles = [];
function spawn(initial) {
  let x = rnd() * 1.7 - 0.05, y = rnd() * 1.08 - 0.04;
  const area = rnd();
  if (area < 0.28) { x = 0.06 + rnd() * 1.06; y = 0.015 + rnd() * 0.38; }
  else if (area < 0.50) { x = rnd() * W; y = 0.79 + rnd() * 0.22; }
  return { x, y, age: initial ? Math.floor(rnd() * 180) : 0, life: 120 + Math.floor(rnd() * 220), tone: Math.min(6, Math.floor(rnd() ** 1.35 * 7)), width: 0.3 + rnd() ** 2 * 1.0, phase: rnd() * TAU };
}
/* 笔触批处理：按 颜色×透明度档×粗细档 合并成一次 stroke()，
   把每帧数万次绘制调用压到几百次 */
const buckets = new Map();
function step(dt, show) {
  if (growth) refreshGrowth();
  if (gpu) {
    inkCtx.clearRect(0, 0, ink.width, ink.height);
    if (growth) gpu.setBase(baseIntro);
  } else {
    inkCtx.globalAlpha = Math.min(0.9, 0.028 * dt);
    inkCtx.drawImage(growth ? baseIntro : under, 0, 0);
    inkCtx.globalAlpha = 1;
  }
  cellCache.clear();
  buckets.clear();
  for (let i = 0; i < particles.length; i++) {
    let p = particles[i];
    p.age += dt;
    if (p.age > p.life || p.x < -0.12 || p.x > 1.72 || p.y < -0.12 || p.y > 1.12) p = particles[i] = spawn(false);
    const info = cellInfo(p.x, p.y);
    const nx = p.x + info.fx * 0.018 * dt, ny = p.y + info.fy * 0.018 * dt;
    const alpha = (0.28 + 0.4 * Math.sin(p.phase + p.age * 0.025) ** 2) * info.em * info.g;
    if (alpha > 0.02) {
      const ci = (info.goldLow || info.warmth > 0.32 ? 7 : 0) + (info.goldLow ? Math.min(4, p.tone) : p.tone);
      const aq = Math.min(7, Math.round(alpha * 7));
      const wq = Math.min(3, Math.round(p.width * 2.5));
      const key = ci * 32 + aq * 4 + wq;
      let b = buckets.get(key);
      if (!b) {
        b = { style: colorOf(info, p.tone), alpha: aq / 7, width: (wq / 2.5) * scale / 800, pts: [] };
        buckets.set(key, b);
      }
      b.pts.push(p.x * scale, p.y * scale, nx * scale, ny * scale);
    }
    p.x = nx; p.y = ny;
  }
  inkCtx.lineCap = 'round';
  for (const b of buckets.values()) {
    inkCtx.strokeStyle = b.style;
    inkCtx.globalAlpha = b.alpha;
    inkCtx.lineWidth = Math.max(0.3, b.width);
    inkCtx.beginPath();
    const pts = b.pts;
    for (let j = 0; j < pts.length; j += 4) {
      inkCtx.moveTo(pts[j], pts[j + 1]);
      inkCtx.lineTo(pts[j + 2], pts[j + 3]);
    }
    inkCtx.stroke();
  }
  inkCtx.globalAlpha = 1;
  if (growth) {
    // 开场：各光辉处点燃后注入径向柔光，随扩散半径缓缓亮起
    for (const s of growth) {
      if (s.rOut2 <= 0) continue;
      const fade = Math.min(1, Math.max(0, (introT - s.t0) / 0.5));
      const r = (s.warm ? 0.09 : 0.085) * scale;
      const col = s.warm ? '255,240,179' : '190,230,238';
      const a0 = s.warm ? 0.05 : 0.03;
      const g = inkCtx.createRadialGradient(s.x * scale, s.y * scale, 0, s.x * scale, s.y * scale, r);
      g.addColorStop(0, `rgba(${col},${a0 * fade})`);
      g.addColorStop(0.4, `rgba(${col},${a0 * 0.45 * fade})`);
      g.addColorStop(1, `rgba(${col},0)`);
      inkCtx.fillStyle = g;
      inkCtx.fillRect(s.x * scale - r, s.y * scale - r, r * 2, r * 2);
    }
  } else {
    // 星月核：每步注入一点径向柔光，累积后中心亮黄、边缘融入笔触
    for (const v of VORT) if (v.warm) {
      const r = v.r * 0.95 * scale;
      const g = inkCtx.createRadialGradient(v.x * scale, v.y * scale, 0, v.x * scale, v.y * scale, r);
      g.addColorStop(0, 'rgba(255,240,179,0.055)');
      g.addColorStop(0.35, 'rgba(226,209,138,0.028)');
      g.addColorStop(1, 'rgba(226,209,138,0)');
      inkCtx.fillStyle = g;
      inkCtx.fillRect(v.x * scale - r, v.y * scale - r, r * 2, r * 2);
    }
  }
  if (gpu) gpu.advance(ink, dt);
  if (show) present();
}
function present() { if (gpu) gpu.render(); else ctx2d.drawImage(ink, 0, 0); }

/* ---------- 开场：光辉生长 ----------
   挑数处光辉（主/副涡旋、大星、月、左小星、地平光带）同时点燃，
   各自的扩散半径随时间缓慢长大，笔触只在该处已蔓延到的区域里出现，
   且顺着当地流场方向运动 —— 看起来像画面从几个光点慢慢「长」出来。 */
const SEEDS = [
  { x: 0.60, y: 0.40, t0: 0.15, dur: 6.4, maxR: 1.05, warm: false },  // 主涡旋
  { x: 1.28, y: 0.22, t0: 0.85, dur: 5.9, maxR: 0.95, warm: true },   // 大星
  { x: 1.47, y: 0.115, t0: 1.50, dur: 5.5, maxR: 0.90, warm: true },  // 月
  { x: 0.79, y: 0.50, t0: 2.10, dur: 5.6, maxR: 0.95, warm: false },  // 副涡旋
  { x: 0.18, y: 0.16, t0: 2.65, dur: 5.2, maxR: 0.90, warm: true },   // 左小星
  { x: 0.32, y: 0.73, t0: 3.20, dur: 5.2, maxR: 0.95, warm: true },   // 地平光带
];
const INTRO_END = 8.6;
let introT = 0;
const easeGrow = u => u;   // 线性：扩散前沿匀速推进，读作「一点点蔓延」而非中途加速
function updateGrowth(t) {
  introT = t;
  for (const s of SEEDS) {
    const u = Math.min(1, Math.max(0, (t - s.t0) / s.dur));
    s.r = u <= 0 ? 0 : s.maxR * easeGrow(u);
    s.rOut = s.r + FEATHER;
    s.rOut2 = s.rOut * s.rOut;
  }
}
/* 用各光辉处的扩散圆并集遮罩底涂，让未蔓延到的区域保持夜色 */
function refreshGrowth() {
  const w = under.width, h = under.height;
  maskCtx.clearRect(0, 0, w, h);
  maskCtx.globalCompositeOperation = 'lighter';
  for (const s of growth) {
    if (s.rOut2 <= 0) continue;
    const R = s.rOut * scale;
    const g = maskCtx.createRadialGradient(s.x * scale, s.y * scale, 0, s.x * scale, s.y * scale, R);
    const inner = Math.max(0, Math.min(1, s.r / s.rOut));
    g.addColorStop(0, 'rgba(255,255,255,1)');
    g.addColorStop(inner, 'rgba(255,255,255,1)');
    g.addColorStop(1, 'rgba(255,255,255,0)');
    maskCtx.fillStyle = g;
    maskCtx.fillRect(s.x * scale - R, s.y * scale - R, R * 2, R * 2);
  }
  maskCtx.globalCompositeOperation = 'source-over';
  bIntroCtx.clearRect(0, 0, w, h);
  bIntroCtx.drawImage(under, 0, 0);
  bIntroCtx.globalCompositeOperation = 'destination-in';
  bIntroCtx.drawImage(maskC, 0, 0);
  bIntroCtx.globalCompositeOperation = 'source-over';
}

/* ---------- 状态机与主循环 ---------- */
let phase = 'boot';            // boot → intro → live（resize 重建时为 warm）
let introStart = 0;
let running = !reducedMotion;
let warmLeft = 0, last = 0, acc = 0;
let fps = 0, fpsCount = 0, fpsAt = 0;

function setStatus(txt) { statusEl.textContent = txt; }
function beginIntro(now) {
  phase = 'intro'; introStart = now; introT = 0;
  growth = SEEDS;
  updateGrowth(0);
  skipBtn.classList.remove('gone');
  pauseBtn.disabled = true;
  setStatus('星辉正在生长…');
}
function endIntro() {
  growth = null;
  if (gpu) gpu.setBase(under);
  phase = 'live';
  skipBtn.classList.add('gone');
  pauseBtn.disabled = false;
  last = 0;
  setStatus(running ? '夜色正在流动' : '已暂停 · 空格继续');
}
function skipIntro() {
  if (phase !== 'intro') return;
  growth = null;
  if (gpu) gpu.setBase(under);
  for (let i = 0; i < 12; i++) step(1, false);   // 快速铺满拖尾，立即呈现完整画面
  present();
  endIntro();
}

let setupEpoch = 0;
function setup(replayIntro) {
  const rect = frameEl.getBoundingClientRect();
  scale = Math.min(1600, Math.max(600, rect.width * Math.min(devicePixelRatio || 1, 2) / W));
  const pw = Math.round(scale * W), ph = Math.round(scale);
  for (const c of [sky, under, ink, maskC, baseIntro]) { c.width = pw; c.height = ph; }
  if (gpu) gpu.resize(pw, ph);
  seed = 18890601;
  paintUnder();
  if (gpu) gpu.setBase(under);
  particles = Array.from({ length: params.density }, () => spawn(true));
  warmLeft = 48;
  const epoch = ++setupEpoch;
  if (replayIntro && !reducedMotion) { beginIntro(performance.now()); return; }
  // 无开场：分批预热后立即呈现
  growth = null;
  phase = 'warm';
  pauseBtn.disabled = true;
  (function warm() {
    if (epoch !== setupEpoch) return;
    for (let i = 0; i < 4 && warmLeft > 0; i++, warmLeft--) step(1, false);
    present();
    if (warmLeft > 0) requestAnimationFrame(warm);
    else { phase = 'live'; pauseBtn.disabled = false; last = 0; setStatus(running ? '夜色正在流动' : '已暂停 · 空格继续'); }
  })();
}

function frame(now) {
  requestAnimationFrame(frame);
  fpsCount++;
  if (now - fpsAt >= 1000) { fps = fpsCount * 1000 / (now - fpsAt); fpsCount = 0; fpsAt = now; }
  if (phase === 'intro') {
    const t = (now - introStart) / 1000;
    updateGrowth(t);
    if (!last) last = now;
    acc += Math.min(80, now - last); last = now;
    if (acc >= 1000 / 30) {
      const dt = Math.min(2, acc / (1000 / 30));
      acc = 0;
      step(dt, true);
    }
    if (t >= INTRO_END) endIntro();
    return;
  }
  if (document.hidden || !running || phase === 'warm' || phase === 'boot') { last = now; return; }
  if (!last) last = now;
  acc += Math.min(80, now - last); last = now;
  if (acc >= 1000 / 30) {
    const dt = Math.min(2, acc / (1000 / 30)) * params.speed;
    acc = 0;
    step(dt, true);
  }
  // 自动降级：帧率不足时逐级减少笔触数量（只降不升，避免振荡）
  if (phase === 'live' && now - govAt > 2500) {
    govAt = now;
    if (fps > 0 && fps < 48 && quality < 2) { quality++; applyDensity(); }
  }
}
let quality = 0, govAt = 0;
const Q_FACTOR = [1, 0.65, 0.45];
function applyDensity() {
  const target = Math.round(params.density * Q_FACTOR[quality]);
  while (particles.length < target) particles.push(spawn(true));
  particles.length = target;
}

/* ---------- UI ---------- */
function syncOutputs() {
  $('#speed').value = params.speed; $('#speed-out').textContent = params.speed.toFixed(2) + '×';
  $('#density').value = params.density; $('#density-out').textContent = params.density;
  $('#bloom').value = params.bloom; $('#bloom-out').textContent = params.bloom.toFixed(2);
  $('#exposure').value = params.exposure; $('#exposure-out').textContent = params.exposure.toFixed(2);
}
function toggle() {
  running = !running;
  pauseBtn.textContent = running ? '暂停流动' : '继续流动';
  pauseBtn.setAttribute('aria-pressed', String(!running));
  setStatus(running ? '夜色正在流动' : '已暂停 · 空格继续');
}
function save() {
  const a = document.createElement('a');
  a.download = '星月夜-风的笔迹-' + new Date().toISOString().replace(/[:.]/g, '-') + '.png';
  a.href = sky.toDataURL('image/png');
  a.click();
  setStatus('已保存当前画面');
}
async function fullscreen() {
  try {
    if (document.fullscreenElement) await document.exitFullscreen();
    else await frameEl.requestFullscreen();
  } catch { setStatus('此环境不支持全屏，可在浏览器中打开'); }
}
pauseBtn.onclick = toggle;
$('#save').onclick = save;
$('#full').onclick = fullscreen;
$('#redraw').onclick = () => setup(true);
skipBtn.onclick = () => skipIntro();
frameEl.addEventListener('pointerdown', () => { if (phase === 'intro') skipIntro(); });
$('#speed').oninput = e => { params.speed = +e.target.value; $('#speed-out').textContent = params.speed.toFixed(2) + '×'; remember(); };
$('#density').oninput = e => {
  params.density = +e.target.value; $('#density-out').textContent = params.density;
  applyDensity();
  remember();
};
$('#bloom').oninput = e => { params.bloom = +e.target.value; $('#bloom-out').textContent = params.bloom.toFixed(2); if (phase === 'live') present(); remember(); };
$('#exposure').oninput = e => { params.exposure = +e.target.value; $('#exposure-out').textContent = params.exposure.toFixed(2); if (phase === 'live') present(); remember(); };
document.addEventListener('keydown', e => {
  if (/INPUT|BUTTON|TEXTAREA/.test(e.target.tagName) || e.ctrlKey || e.altKey || e.metaKey) return;
  if (e.code === 'Space') { e.preventDefault(); if (phase === 'live') toggle(); }
  if (e.key.toLowerCase() === 'f') fullscreen();
  if (e.key.toLowerCase() === 's') save();
});
let resizeTimer;
new ResizeObserver(() => {
  clearTimeout(resizeTimer);
  resizeTimer = setTimeout(() => {
    const wasIntro = phase === 'intro';
    setup(wasIntro);
  }, 200);
}).observe(frameEl);

/* ---------- 调试钩子（自动化验证用） ---------- */
window.__flow = {
  get t() { return phase === 'intro' ? (performance.now() - introStart) / 1000 : 99; },
  get phase() { return phase; },
  get fps() { return fps; },
  get renderer() { return gpu ? 'webgl2' : 'canvas2d'; },
  params,
  skip: () => skipIntro(),
};

/* ---------- 启动 ---------- */
syncOutputs();
remember();
if (!running) { pauseBtn.textContent = '继续流动'; pauseBtn.setAttribute('aria-pressed', 'true'); }
setup(!reducedMotion);
requestAnimationFrame(frame);
</script>
</body>
</html>
