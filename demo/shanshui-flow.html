<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="theme-color" content="#0a1712">
<title>青绿江山 · 涡流笔触</title>
<style>
  :root{
    color-scheme:dark;
    --ink:#eaf6ee; --dim:#9dc0ac; --jade:#45c4a8; --mint:#8fd8b8; --gold:#e8c877; --deep:#0d3b36;
    --bg:#0a1712; --panel:#10231b; --line:#23483a;
  }
  *{box-sizing:border-box}
  html,body{margin:0;height:100%;background:var(--bg);color:var(--ink);
    font-family:"Noto Serif SC","Songti SC",SimSun,serif;}
  body{display:flex;flex-direction:column;overflow:hidden}
  .hall{display:flex;flex-direction:column;height:100%;padding:14px 20px 10px;gap:10px}
  header{display:flex;align-items:baseline;gap:14px;flex-wrap:wrap}
  h1{margin:0;font-size:20px;font-weight:600;letter-spacing:.14em;color:var(--mint)}
  .tagline{font-size:12px;letter-spacing:.22em;color:var(--dim)}
  .sign{margin-left:auto;font-size:11px;letter-spacing:.12em;color:#5f8271}
  main{flex:1;display:flex;align-items:center;justify-content:center;min-height:0}
  .frame{position:relative;width:min(100%,calc((100svh - 232px)*1.6));aspect-ratio:1.6;
    background:#0d1f19;border:1px solid var(--line);border-radius:6px;overflow:hidden;
    box-shadow:0 18px 60px -22px rgba(69,196,168,.26), 0 6px 24px -12px rgba(0,0,0,.8);}
  .frame canvas{position:absolute;inset:0;width:100%;height:100%;display:block}
  .frame:fullscreen{width:100%;height:100%;aspect-ratio:auto;border:0;border-radius:0}
  .frame:fullscreen canvas{left:50%;top:50%;transform:translate(-50%,-50%);
    width:max(100vw,160vh);height:max(100vh,62.5vw)}
  .hint{position:absolute;left:12px;bottom:10px;font-size:11px;letter-spacing:.14em;color:#d9efe2;
    text-shadow:0 1px 6px rgba(6,26,20,.85);pointer-events:none;opacity:.85}
  #skip{position:absolute;right:12px;top:10px;font:inherit;font-size:11px;letter-spacing:.16em;
    color:#eaf6ee;background:rgba(10,23,18,.55);border:1px solid rgba(143,216,184,.45);
    border-radius:999px;padding:5px 12px;cursor:pointer;backdrop-filter:blur(3px)}
  #skip:hover{background:rgba(69,196,168,.28)}
  #skip[hidden]{display:none}
  .deck{display:flex;align-items:center;gap:16px;flex-wrap:wrap;
    background:var(--panel);border:1px solid var(--line);border-radius:8px;padding:10px 14px}
  button{font:inherit;font-size:12px;letter-spacing:.14em;color:var(--ink);cursor:pointer;
    background:linear-gradient(180deg,#173428,#10231b);border:1px solid #2c5a48;border-radius:6px;
    padding:7px 14px;transition:border-color .15s, background .15s, transform .05s}
  button:hover{border-color:var(--jade);background:linear-gradient(180deg,#1d4433,#10231b)}
  button:active{transform:translateY(1px)}
  button:disabled{opacity:.45;cursor:default}
  #pause{min-width:76px;border-color:#37684f;color:var(--mint)}
  .ctl{display:flex;align-items:center;gap:8px;font-size:11px;letter-spacing:.1em;color:var(--dim)}
  .ctl output{min-width:44px;text-align:right;color:var(--gold);font-variant-numeric:tabular-nums}
  input[type=range]{-webkit-appearance:none;appearance:none;width:104px;height:4px;border-radius:2px;
    background:linear-gradient(90deg,var(--deep),var(--jade),var(--gold));outline:none;cursor:pointer}
  input[type=range]::-webkit-slider-thumb{-webkit-appearance:none;appearance:none;width:13px;height:13px;
    border-radius:50%;background:var(--gold);border:2px solid #10231b;box-shadow:0 0 8px rgba(232,200,119,.55)}
  input[type=range]::-moz-range-thumb{width:13px;height:13px;border-radius:50%;background:var(--gold);
    border:2px solid #10231b;box-shadow:0 0 8px rgba(232,200,119,.55)}
  input[type=range]:focus-visible{box-shadow:0 0 0 2px rgba(69,196,168,.5)}
  .acts{margin-left:auto;display:flex;gap:8px}
  footer{display:flex;align-items:center;gap:10px;font-size:11px;letter-spacing:.14em;color:#5f8271}
  #status{color:var(--dim)}
  .deck::-webkit-scrollbar,.hall::-webkit-scrollbar{height:8px;width:8px}
  .deck::-webkit-scrollbar-track,.hall::-webkit-scrollbar-track{background:#0c1c15}
  .deck::-webkit-scrollbar-thumb,.hall::-webkit-scrollbar-thumb{background:#2c5a48;border-radius:4px}
  .deck::-webkit-scrollbar-thumb:hover,.hall::-webkit-scrollbar-thumb:hover{background:var(--jade)}
  @media(max-width:680px){
    .hall{padding:10px 12px 8px}
    h1{font-size:16px}
    .sign{display:none}
    .frame{width:100%;aspect-ratio:1.45}
    .deck{gap:10px;padding:8px 10px;overflow-x:auto;flex-wrap:nowrap}
    .ctl{flex:0 0 auto}
    input[type=range]{width:84px}
    .acts{margin-left:0}
  }
  @media(prefers-reduced-motion:reduce){*{transition:none!important}}
</style>
</head>
<body>
<div class="hall">
  <header>
    <h1>青绿江山</h1>
    <span class="tagline">涡流笔触 · 生长开场</span>
    <span class="sign">零依赖 · Canvas2D + WebGL2</span>
  </header>
  <main>
    <div class="frame" id="frame">
      <canvas id="sky" role="img" aria-label="青绿江山：薄荷色天空下，青绿群山由等高流线织成，山脊洒金，白色云涡盘绕山腰，山脚一江碧水蜿蜒泛光。"></canvas>
      <span class="hint">空格 暂停 · R 重绘 · F 全屏 · S 保存</span>
      <button id="skip" hidden>跳过生长 ›</button>
    </div>
  </main>
  <div class="deck">
    <button id="pause">暂停</button>
    <label class="ctl">流速<input id="speed" type="range" min="0.2" max="3" step="0.05" value="1"><output id="speedOut">1.00</output></label>
    <label class="ctl">笔触<input id="density" type="range" min="2000" max="32000" step="500" value="22000"><output id="densityOut">22000</output></label>
    <label class="ctl">云雾<input id="mist" type="range" min="0" max="1" step="0.05" value="0.7"><output id="mistOut">0.70</output></label>
    <label class="ctl">金粉<input id="gold" type="range" min="0" max="1" step="0.05" value="0.8"><output id="goldOut">0.80</output></label>
    <label class="ctl">辉光<input id="bloom" type="range" min="0" max="2" step="0.05" value="0.55"><output id="bloomOut">0.55</output></label>
    <label class="ctl">曝光<input id="exposure" type="range" min="0.4" max="2.5" step="0.05" value="1"><output id="exposureOut">1.00</output></label>
    <div class="acts">
      <button id="redraw">重新绘制</button>
      <button id="save">保存画面</button>
      <button id="full">全屏</button>
    </div>
  </div>
  <footer><span id="status">正在起笔…</span></footer>
</div>

<script>
'use strict';
/* ============================================================
   青绿江山 · 涡流笔触（单文件 / 零依赖 / 无外部资源）
   复刻目标：薄荷天空 + 青绿等高线群山（山脊洒金）+ 白色云涡 + 山脚蜿蜒江流
   管线：Canvas2D 粒子笔触 → WebGL2 浮点拖尾累积 → 辉光 → ACES
   开场：数处光辉点燃后缓慢蔓延成画（生长效果），可跳过
   ============================================================ */

const TAU = Math.PI * 2;
const W = 1.6, H = 1;
const $ = s => document.querySelector(s);

const skyEl = $('#sky'), frameEl = $('#frame'), statusEl = $('#status');
const pauseBtn = $('#pause'), skipBtn = $('#skip');
const reducedMotion = matchMedia('(prefers-reduced-motion: reduce)').matches;

const PREF_KEY = 'shanshui.prefs.v1';
const params = { speed: 1, density: 22000, mist: 0.7, gold: 0.8, bloom: 0.55, exposure: 1.0 };
try {
  const saved = JSON.parse(localStorage.getItem(PREF_KEY) || 'null');
  if (saved) for (const k of Object.keys(params)) if (typeof saved[k] === 'number') params[k] = saved[k];
} catch {}
params.speed = Math.min(3, Math.max(0.2, params.speed));
params.density = Math.min(32000, Math.max(2000, Math.round(params.density)));
params.mist = Math.min(1, Math.max(0, params.mist));
params.gold = Math.min(1, Math.max(0, params.gold));
params.bloom = Math.min(2, Math.max(0, params.bloom));
params.exposure = Math.min(2.5, Math.max(0.4, params.exposure));
function remember() { try { localStorage.setItem(PREF_KEY, JSON.stringify(params)); } catch {} }

let seed = 12060413;
function rnd() { seed = (Math.imul(seed, 1664525) + 1013904223) >>> 0; return seed / 4294967296; }

/* ---------- 山体：近→远排列，_own 取第一座山脊高于该点的山 ---------- */
/* peaks: [峰心x, 峰高, 峰宽]；ridge(x) = base - Σ 高斯峰 */
const RANGES = [
  { base: 0.80, peaks: [[0.15, 0.56, 0.130], [0.00, 0.34, 0.080], [0.30, 0.26, 0.060]], near: true },   // 左前景大山
  { base: 0.84, peaks: [[0.99, 0.47, 0.150], [0.87, 0.24, 0.070]], near: true },   // 右前景坡岭
  { base: 0.80, peaks: [[0.78, 0.70, 0.130], [0.40, 0.48, 0.110], [0.58, 0.30, 0.070]], near: false }, // 中景主峰
  { base: 0.60, peaks: [[0.28, 0.30, 0.090], [0.52, 0.34, 0.080], [0.88, 0.28, 0.090]], near: false }, // 远山淡金
];
function ridgeOf(r, x) {
  let y = r.base;
  for (const [px, h, w] of r.peaks) { const t = (x - px) / w; y -= h * Math.exp(-t * t); }
  return y;
}
function ridgeDOf(r, x) {
  let d = 0;
  for (const [px, h, w] of r.peaks) { const t = (x - px) / w; d += h * Math.exp(-t * t) * 2 * t / w; }
  return d;
}
function ownerOf(x, y) {
  for (let i = 0; i < RANGES.length; i++) if (y >= ridgeAt(i, x) - 0.004) return i;
  return -1;
}
/* 山脊查表：每帧数万次求值走线性插值，避免重复高斯 */
const RN = 384;
let ridgeTab = [], ridgeDTab = [];
function buildRidgeTabs() {
  ridgeTab = RANGES.map(r => { const a = new Float32Array(RN + 1); for (let i = 0; i <= RN; i++) a[i] = ridgeOf(r, i / RN * W); return a; });
  ridgeDTab = RANGES.map(r => { const a = new Float32Array(RN + 1); for (let i = 0; i <= RN; i++) a[i] = ridgeDOf(r, i / RN * W); return a; });
}
function ridgeAt(oi, x) {
  const t = Math.min(RN - 1e-6, Math.max(0, x / W * RN)); const i = t | 0, f = t - i;
  const a = ridgeTab[oi]; return a[i] + (a[i + 1] - a[i]) * f;
}
function ridgeDAt(oi, x) {
  const t = Math.min(RN - 1e-6, Math.max(0, x / W * RN)); const i = t | 0, f = t - i;
  const a = ridgeDTab[oi]; return a[i] + (a[i + 1] - a[i]) * f;
}
/* ---------- 江面：蜿蜒顶线 + 平行流带 ---------- */
const riverTop = x => 0.735 + 0.050 * Math.sin(2.0 * x + 0.7) + 0.015 * Math.sin(4.7 * x + 2);
const riverTopD = x => 0.100 * Math.cos(2.0 * x + 0.7) + 0.0705 * Math.cos(4.7 * x + 2);
const RIVER_BANDS = [
  { off: 0.030, A: 0.010, k: 5.2, p: 0.4 },
  { off: 0.065, A: 0.013, k: 6.1, p: 1.6 },
  { off: 0.100, A: 0.016, k: 5.5, p: 2.7 },
  { off: 0.140, A: 0.018, k: 6.6, p: 0.9 },
  { off: 0.180, A: 0.020, k: 5.8, p: 2.1 },
  { off: 0.220, A: 0.021, k: 6.3, p: 3.3 },
  { off: 0.260, A: 0.022, k: 5.1, p: 1.2 },
];
const rbandY = (b, x) => riverTop(x) + b.off + b.A * Math.sin(b.k * x + b.p);
const rbandD = (b, x) => riverTopD(x) + b.A * b.k * Math.cos(b.k * x + b.p);
/* ---------- 云涡：白色螺旋 ---------- */
const SWIRL = [
  { x: 0.720, y: 0.475, r: 0.055, s: 0.15 },
  { x: 0.845, y: 0.455, r: 0.040, s: -0.13 },
  { x: 0.175, y: 0.645, r: 0.050, s: 0.14 },
  { x: 0.115, y: 0.715, r: 0.038, s: -0.12 },
  { x: 0.630, y: 0.575, r: 0.030, s: 0.11 },
  { x: 0.800, y: 0.745, r: 0.034, s: -0.11 },
  { x: 0.420, y: 0.440, r: 0.026, s: 0.10 },
];
/* ---------- 云雾带 ---------- */
const MIST_BANDS = [
  { y0: 0.585, A: 0.020, k: 3.1, p: 0.5, w: 0.026 },
  { y0: 0.690, A: 0.025, k: 2.3, p: 1.8, w: 0.030 },
];
function mistAt(x, y) {
  let m = 0;
  for (const b of MIST_BANDS) {
    const d = y - (b.y0 + b.A * Math.sin(b.k * x + b.p));
    m = Math.max(m, Math.exp(-((d / b.w) ** 2)) * (0.45 + 0.55 * Math.sin(x * 5.3 + b.p * 2)));
  }
  for (const v of SWIRL) {
    if (Math.abs(x - v.x) > v.r * 2.6 || Math.abs(y - v.y) > v.r * 2.4) continue;
    const r = Math.hypot(x - v.x, (y - v.y) / 0.9) / v.r;
    if (r > 2.6) continue;
    m = Math.max(m, Math.exp(-(((r - 1.0) / 0.62) ** 2)) * 0.95);
  }
  return Math.min(1, m * params.mist);
}

function fieldAt(x, y, rt, own) {
  let vx, vy = 0;
  if (y > rt) {                                   // 江流：顺流带切线
    vx = 0.16 + 0.03 * Math.sin(y * 21 + x * 4);
    let bw = 0, bd = 0;
    for (const b of RIVER_BANDS) {
      const w = Math.exp(-(((y - rbandY(b, x)) / 0.035) ** 2));
      if (w > bw) { bw = w; bd = rbandD(b, x); }
    }
    vy = bw * bd * vx * 0.9;
  } else if (own < 0) {                           // 天空：极缓横风
    vx = 0.045 + 0.012 * Math.sin(y * 13 + x * 3);
    vy = 0.006 * Math.sin(x * 7 + y * 5);
  } else {                                        // 山体：沿等高线（山脊切线）
    vx = 0.085 + 0.02 * Math.sin(y * 15 + own * 2.1);
    vy = ridgeDAt(own, x) * vx * 0.92 + 0.008 * Math.sin(x * 26 + y * 9 + own);
    // 接近下一座山的遮挡边界时改顺边界切线，避免两族流线对冲堆积成亮缝
    const nr = ownerOf(x, y + 0.08);
    if (nr >= 0 && nr !== own) {
      const db = ridgeAt(nr, x) - y;
      if (db < 0.06) {
        const w = 1 - db / 0.06;
        vy = vy * (1 - w) + (ridgeDAt(nr, x) * vx * 0.92) * w;
      }
    }
  }
  // 云涡旋卷
  let gmax = 0, rx = 0, ry = 0;
  for (const v of SWIRL) {
    const dx = x - v.x, dy = (y - v.y) / 0.9;
    const r2 = dx * dx + dy * dy;
    const cut = v.r * 3.2;
    if (r2 > cut * cut) continue;
    const g = Math.exp(-r2 / (2 * v.r * v.r));
    if (g > gmax) gmax = g;
    const a = v.s * g / Math.sqrt(r2 + 0.0012);
    const sink = 0.06 * g;
    rx += -dy * a - dx * sink;
    ry += dx * a * 0.9 - dy * sink * 0.9;
  }
  vx = vx * (1 - 0.6 * gmax) + rx;
  vy = vy * (1 - 0.6 * gmax) + ry;
  return [vx, vy];
}
function field(x, y) {
  const rt = riverTop(x);
  return fieldAt(x, y, rt, y > rt ? -1 : ownerOf(x, y));
}

function emphasisAt(x, y, rt, own, m) {
  if (y > rt) {                                   // 江面浪尖亮线
    let s = 0.10;
    for (const b of RIVER_BANDS) {
      const d = y - rbandY(b, x);
      s = Math.max(s, Math.exp(-((d / 0.009) ** 2)));
    }
    return Math.min(1, s);
  }
  if (m > 0.62) {                                 // 云涡环带笔触
    let s = 0.30 * m;
    for (const v of SWIRL) {
      if (Math.abs(x - v.x) > v.r * 3.2 || Math.abs(y - v.y) > v.r * 2.9) continue;
      const r = Math.hypot(x - v.x, (y - v.y) / 0.9) / v.r;
      if (r > 3.2) continue;
      const ang = Math.atan2((y - v.y) / 0.9, x - v.x);
      const brush = 0.78 + 0.22 * Math.sin(ang * 2 + Math.log(r + 0.15) * 2.4 + v.x * 4);
      s = Math.max(s, Math.exp(-(((r - 1.05) / 0.66) ** 2)) * brush * 0.95);
    }
    return Math.min(1, s);
  }
  if (own < 0) return 0.06;                       // 天空几乎留白
  const d = y - ridgeAt(own, x);
  // 等高条纹：随山脊起伏的平行亮线
  const phase = d / 0.015 + 0.12 * Math.sin(x * 9 + own * 1.7);
  const stripe = 0.5 + 0.5 * Math.cos(TAU * phase);
  let s = 0.22 + 0.78 * stripe * stripe;
  s = Math.max(s, Math.exp(-((d / 0.020) ** 2)));  // 山脊金线
  if (own === 3) s *= 0.70;                        // 远山淡化
  return Math.min(1, s);
}
function emphasis(x, y) {
  const rt = riverTop(x);
  const own = y > rt ? -1 : ownerOf(x, y);
  return emphasisAt(x, y, rt, own, y > rt ? 0 : mistAt(x, y));
}

/* ---------- 配色：薄荷天 / 远山淡金 / 中景翠 / 前景深青 / 江碧 / 云白 / 脊金 ---------- */
const PALS = [
  ['#a8d8c0', '#bfe6d2', '#d2f0e0', '#e4f7ea', '#f2fbf4', '#ffffff', '#fdf6da'], // 0 天空
  ['#c9c39a', '#d8d3ac', '#e6e2c0', '#f0eccd', '#f7f3dc', '#fbf8e8', '#fffdf2'], // 1 远山
  ['#123f36', '#1a5a4a', '#237a62', '#2f9c7d', '#45b98f', '#6fd3a8', '#a5e8c4'], // 2 中景翠
  ['#175f52', '#23806c', '#33a184', '#4fbf9c', '#7fd8b8', '#b2ecd4', '#eafff5'], // 3 江流
  ['#cfe8dc', '#ddf2e6', '#e9f8ee', '#f4fcf6', '#fbfefb', '#ffffff', '#fdf8e4'], // 4 云雾
  ['#b98f3e', '#d3b061', '#e6cb8b', '#f2e0ac', '#f9edc8', '#fdf6e0', '#fffdf2'], // 5 山脊金
  ['#082a26', '#0d3b34', '#145448', '#1d7261', '#2a9078', '#3fb08c', '#7fd0ae'], // 6 前景深青
];
const FEATHER = 0.10;
let growth = null;
const cellCache = new Map();
function cellInfo(x, y) {
  const key = ((x * 80) | 0) * 128 + ((y * 80) | 0);
  let c = cellCache.get(key);
  if (c) return c;
  const rt = riverTop(x);
  let kind, shift = 0, em, f;
  if (y > rt) {
    kind = 3; em = emphasisAt(x, y, rt, -1, 0); f = fieldAt(x, y, rt, -1);
  } else {
    const own = ownerOf(x, y);
    const m = mistAt(x, y);
    if (m > 0.62) {
      kind = 4; em = emphasisAt(x, y, rt, own, m); f = fieldAt(x, y, rt, own);
    } else if (own < 0) {
      kind = 0; em = 0.06; f = fieldAt(x, y, rt, -1);
    } else {
      const d = y - ridgeAt(own, x);
      const cr = Math.exp(-((d / 0.018) ** 2));
      const stripe = 0.5 + 0.5 * Math.cos(TAU * (d / 0.015 + 0.12 * Math.sin(x * 9 + own * 1.7)));
      if (cr > 0.45) kind = 5;
      else {
        kind = own === 3 ? 1 : (RANGES[own].near ? 6 : 2);
        shift = Math.round(cr * 2) + (stripe > 0.55 ? 3 : 0) - (d > 0.30 ? 1 : 0);
      }
      em = emphasisAt(x, y, rt, own, m); f = fieldAt(x, y, rt, own);
    }
  }
  let g = 1;
  if (growth) {
    g = 0;
    for (const s of growth) {
      if (s.rOut2 <= 0) continue;
      const dx = x - s.x, dy = y - s.y, d2 = dx * dx + dy * dy;
      if (d2 >= s.rOut2) continue;
      const d = Math.sqrt(d2);
      const v = d <= s.r ? 1 : (s.rOut - d) / FEATHER;
      if (v > g) g = v;
      if (g >= 1) break;
    }
  }
  c = { em, kind, shift, g, fx: f[0], fy: f[1] };
  cellCache.set(key, c);
  return c;
}
const toneAt = (info, tone) => Math.min(6, Math.max(0, tone + info.shift));
function colorOf(info, tone) { return PALS[info.kind][toneAt(info, tone)]; }
function colorAt(x, y, tone) { return colorOf(cellInfo(x, y), tone); }

/* ---------- WebGL2 合成器 ---------- */
class Film {
  constructor(canvas) {
    const gl = canvas.getContext('webgl2', { alpha: false, antialias: false, preserveDrawingBuffer: true, powerPreference: 'high-performance' });
    if (!gl) throw new Error('no webgl2');
    this.gl = gl;

/* ---------- 底涂：薄荷天空 + 四层山体 + 云团 + 江面 + 山脊金线 ---------- */
function paintUnder() {
  const w = under.width, h = under.height;
  const gSky = baseCtx.createLinearGradient(0, 0, 0, 0.66 * scale);
  gSky.addColorStop(0, '#b7e0c8'); gSky.addColorStop(0.55, '#cfeadb'); gSky.addColorStop(1, '#e4f4e6');
  baseCtx.fillStyle = gSky; baseCtx.fillRect(0, 0, w, h);
  // 山体自远而近铺底
  const order = [3, 2, 1, 0];
  for (const oi of order) {
    const r = RANGES[oi];
    baseCtx.beginPath();
    baseCtx.moveTo(0, h);
    for (let x = 0; x <= W + 0.001; x += 0.01) baseCtx.lineTo(x * scale, ridgeOf(r, x) * scale);
    baseCtx.lineTo(w, h); baseCtx.closePath();
    const g = baseCtx.createLinearGradient(0, (r.base - 0.6) * scale, 0, r.base * scale);
    if (oi === 3) { g.addColorStop(0, '#efe9cb'); g.addColorStop(1, '#cfe4cd'); }
    else if (oi === 2) { g.addColorStop(0, '#45b98f'); g.addColorStop(0.5, '#1d7261'); g.addColorStop(1, '#0d3b34'); }
    else { g.addColorStop(0, '#2a9078'); g.addColorStop(0.45, '#145448'); g.addColorStop(1, '#082a26'); }
    baseCtx.fillStyle = g; baseCtx.fill();

  baseCtx.lineCap = 'round';

    const pal = oi === 3 ? PALS[1] : (r.near ? PALS[6] : PALS[2]);
    let k = 0;
    for (let c = 0.012; c < 0.62; c += 0.013, k++) {

        if (!pen) { baseCtx.moveTo(x * scale, y * scale); pen = true; }

  baseCtx.beginPath();
  baseCtx.moveTo(0, h);
  for (let x = 0; x <= W + 0.001; x += 0.01) baseCtx.lineTo(x * scale, riverTop(x) * scale);
  baseCtx.lineTo(w, h); baseCtx.closePath();

  gR.addColorStop(0, '#2a9078'); gR.addColorStop(0.5, '#175f52'); gR.addColorStop(1, '#0e453c');
  baseCtx.fillStyle = gR; baseCtx.fill();
  // 静态流线笔触

  for (let i = 0; i < 26000; i++) {
    let x = rnd() * W, y = rnd();
    const m = i % 5;
    if (m === 0 || m === 1 || m === 2) { x = rnd() * W; y = 0.10 + rnd() * 0.66; }
    else if (m === 3) { x = rnd() * W; y = riverTop(x) + 0.01 + rnd() * (1 - riverTop(x) - 0.02); }
    else { const v = SWIRL[Math.floor(rnd() * SWIRL.length)], a = rnd() * TAU, r = v.r * (0.4 + rnd() * 1.5);
      x = v.x + Math.cos(a) * r; y = v.y + Math.sin(a) * r * 0.9; }

let particles = [];

    const top = ridgeOf(RANGES[oi], x);

    const info = cellInfo(p.x, p.y);

    const alpha = (0.28 + 0.4 * Math.sin(p.phase + p.age * 0.025) ** 2) * info.em * info.g;

      const aq = Math.min(7, Math.round(alpha * 7));
      const wq = Math.min(3, Math.round(p.width * 2.5));
      const key = ci * 32 + aq * 4 + wq;
      let b = buckets.get(key);
      if (!b) {

        buckets.set(key, b);

    if (g <= 0.02) continue;
    const gm = sp.gold ? params.gold : 1;
    if (gm <= 0.02) continue;
    const tw = (0.25 + 0.55 * Math.sin(simT * 2 + sp.ph) ** 2) * gm;
    inkCtx.globalAlpha = tw * g;
    inkCtx.fillStyle = sp.c;
    const s = sp.s * scale / 800;
    inkCtx.fillRect(sp.x * scale - s / 2, sp.y * scale - s / 2, s, s);
  }
  inkCtx.globalAlpha = 1;
  if (growth) {
    for (const s of growth) {
      if (s.rOut2 <= 0) continue;
      const u = Math.min(1, Math.max(0, (introT - s.t0) / s.dur));
      const fade = Math.min(1, Math.max(0, (introT - s.t0) / 0.5)) * Math.pow(1 - u, 1.6);
      if (fade <= 0.01) continue;
      const r = (s.warm ? 0.09 : 0.085) * scale;
      const col = s.warm ? '247,232,192' : '190,240,220';
      const a0 = s.warm ? 0.035 : 0.025;
      const g = inkCtx.createRadialGradient(s.x * scale, s.y * scale, 0, s.x * scale, s.y * scale, r);
      g.addColorStop(0, `rgba(${col},${a0 * fade})`);
      g.addColorStop(0.4, `rgba(${col},${a0 * 0.45 * fade})`);
      g.addColorStop(1, `rgba(${col},0)`);
      inkCtx.fillStyle = g;
      inkCtx.fillRect(s.x * scale - r, s.y * scale - r, r * 2, r * 2);
    }
  }
  if (gpu) gpu.advance(ink, dt, growth);
  if (show) present();
}
function present() { if (gpu) gpu.render(); else ctx2d.drawImage(ink, 0, 0); }

/* ---------- 生长开场 ---------- */
const SEEDS = [
  { x: 0.78, y: 0.16, t0: 0.15, dur: 6.4, maxR: 1.05, warm: true },
  { x: 0.15, y: 0.30, t0: 0.90, dur: 5.9, maxR: 0.95, warm: true },
  { x: 0.40, y: 0.36, t0: 1.60, dur: 5.5, maxR: 0.90, warm: true },
  { x: 0.55, y: 0.86, t0: 2.20, dur: 5.6, maxR: 0.95, warm: false },
  { x: 0.17, y: 0.66, t0: 2.80, dur: 5.2, maxR: 0.90, warm: false },
  { x: 0.72, y: 0.48, t0: 3.30, dur: 5.2, maxR: 0.90, warm: false },
];
const INTRO_END = 8.6;
let introT = 0;
const easeGrow = u => u;
function updateGrowth(t) {
  introT = t;
  for (const s of SEEDS) {
    const u = Math.min(1, Math.max(0, (t - s.t0) / s.dur));
    s.r = u <= 0 ? 0 : s.maxR * easeGrow(u);
    s.rOut = s.r + FEATHER;
    s.rOut2 = s.rOut * s.rOut;
  }
}
function refreshGrowth() {
  const w = under.width, h = under.height;
  maskCtx.clearRect(0, 0, w, h);
  maskCtx.globalCompositeOperation = 'lighter';
  for (const s of growth) {
    if (s.rOut2 <= 0) continue;
    const R = s.rOut * scale;
    const g = maskCtx.createRadialGradient(s.x * scale, s.y * scale, 0, s.x * scale, s.y * scale, R);
    const inner = Math.max(0, Math.min(1, s.r / s.rOut));
    g.addColorStop(0, 'rgba(255,255,255,1)');
    g.addColorStop(inner, 'rgba(255,255,255,1)');
    g.addColorStop(1, 'rgba(255,255,255,0)');
    maskCtx.fillStyle = g;
    maskCtx.fillRect(s.x * scale - R, s.y * scale - R, R * 2, R * 2);
  }
  maskCtx.globalCompositeOperation = 'source-over';
  bIntroCtx.clearRect(0, 0, w, h);
  bIntroCtx.drawImage(under, 0, 0);
  bIntroCtx.globalCompositeOperation = 'destination-in';
  bIntroCtx.drawImage(maskC, 0, 0);
  bIntroCtx.globalCompositeOperation = 'source-over';
}

/* ---------- 状态机 ---------- */
let phase = 'boot';
let introStart = 0;
let running = true;
let warmLeft = 0, last = 0, acc = 0;
let fps = 0, fpsCount = 0, fpsAt = 0;
function setStatus(t) { statusEl.textContent = t; }
function beginIntro(now) {
  phase = 'intro'; introStart = now; introT = 0;
  growth = SEEDS; updateGrowth(0);
  skipBtn.hidden = false; pauseBtn.disabled = true;
  setStatus('青绿正在生长…');
}
function endIntro() {
  growth = null;
  if (gpu) gpu.setBase(under);
  phase = 'live'; last = 0;
  skipBtn.hidden = true; pauseBtn.disabled = false;
  setStatus(running ? '流动中 · 空格暂停' : '已暂停');
}
function skipIntro() {
  if (phase !== 'intro') return;
  growth = null;
  if (gpu) gpu.setBase(under);
  for (let i = 0; i < 12; i++) step(1, false);
  present();
  endIntro();
}
let setupEpoch = 0;
function setup(replayIntro) {
  const rect = frameEl.getBoundingClientRect();
  scale = Math.min(800, Math.max(600, rect.width * Math.min(devicePixelRatio || 1, 2) / W));
  const pw = Math.round(scale * W), ph = Math.round(scale);
  for (const c of [sky, under, ink, maskC, baseIntro]) { c.width = pw; c.height = ph; }
  if (gpu) gpu.resize(pw, ph);
  seed = 12060413;
  buildRidgeTabs();
  buildPuffs();
  paintUnder();
  buildSparkles();
  if (gpu) gpu.setBase(under);
  particles = Array.from({ length: Math.round(params.density * Q_FACTOR[quality]) }, () => spawn(true));
  warmLeft = 48;
  const epoch = ++setupEpoch;
  if (replayIntro && !reducedMotion) { beginIntro(performance.now()); return; }
  growth = null;
  phase = 'warm';
  (function warm() {
    if (epoch !== setupEpoch) return;
    for (let i = 0; i < 4 && warmLeft > 0; i++, warmLeft--) step(1, false);
    present();
    if (warmLeft > 0) requestAnimationFrame(warm);
    else { phase = 'live'; last = 0; setStatus(running ? '流动中 · 空格暂停' : '已暂停'); }
  })();
}
function frame(now) {
  requestAnimationFrame(frame);
  fpsCount++;
  if (now - fpsAt >= 1000) { fps = fpsCount * 1000 / (now - fpsAt); fpsCount = 0; fpsAt = now; }
  if (phase === 'intro') {
    const t = (now - introStart) / 1000;
    updateGrowth(t);
    if (!last) last = now;
    acc += Math.min(80, now - last); last = now;
    if (acc >= 1000 / 30) { const dt = Math.min(2, acc / (1000 / 30)); acc = 0; step(dt, true); }
    if (t >= INTRO_END) endIntro();
    return;
  }
  if (document.hidden || !running || phase === 'warm' || phase === 'boot') { last = now; return; }
  if (!last) last = now;
  acc += Math.min(80, now - last); last = now;
  if (acc >= 1000 / 30) { const dt = Math.min(2, acc / (1000 / 30)) * params.speed; acc = 0; step(dt, true); }
  if (phase === 'live' && now - govAt > 2500) {
    govAt = now;
    if (fps > 0 && fps < 48 && quality < 2) { quality++; applyDensity(); }
  }
}
let quality = 0, govAt = 0;
const Q_FACTOR = [1, 0.65, 0.45];
function applyDensity() {
  const target = Math.round(params.density * Q_FACTOR[quality]);
  while (particles.length < target) particles.push(spawn(true));
  particles.length = target;
}

/* ---------- UI ---------- */
const sliders = { speed: $('#speed'), density: $('#density'), mist: $('#mist'), gold: $('#gold'), bloom: $('#bloom'), exposure: $('#exposure') };
const outs = { speed: $('#speedOut'), density: $('#densityOut'), mist: $('#mistOut'), gold: $('#goldOut'), bloom: $('#bloomOut'), exposure: $('#exposureOut') };
function syncOutputs() {
  sliders.speed.value = params.speed; outs.speed.textContent = params.speed.toFixed(2);
  sliders.density.value = params.density; outs.density.textContent = params.density;
  sliders.mist.value = params.mist; outs.mist.textContent = params.mist.toFixed(2);
  sliders.gold.value = params.gold; outs.gold.textContent = params.gold.toFixed(2);
  sliders.bloom.value = params.bloom; outs.bloom.textContent = params.bloom.toFixed(2);
  sliders.exposure.value = params.exposure; outs.exposure.textContent = params.exposure.toFixed(2);
}
sliders.speed.oninput = e => { params.speed = +e.target.value; outs.speed.textContent = params.speed.toFixed(2); remember(); };
sliders.density.oninput = e => { params.density = +e.target.value; outs.density.textContent = params.density; applyDensity(); remember(); };
sliders.mist.oninput = e => { params.mist = +e.target.value; outs.mist.textContent = params.mist.toFixed(2); remember(); };
sliders.gold.oninput = e => { params.gold = +e.target.value; outs.gold.textContent = params.gold.toFixed(2); remember(); };
sliders.bloom.oninput = e => { params.bloom = +e.target.value; outs.bloom.textContent = params.bloom.toFixed(2); remember(); };
sliders.exposure.oninput = e => { params.exposure = +e.target.value; outs.exposure.textContent = params.exposure.toFixed(2); remember(); };
function toggle() {
  running = !running;
  pauseBtn.textContent = running ? '暂停' : '继续';
  if (phase === 'live') setStatus(running ? '流动中 · 空格暂停' : '已暂停');
}
pauseBtn.onclick = toggle;
skipBtn.onclick = skipIntro;
$('#redraw').onclick = () => setup(true);
$('#save').onclick = () => {
  const a = document.createElement('a');
  a.download = 'shanshui-flow.png';
  a.href = sky.toDataURL('image/png');
  a.click();
};
$('#full').onclick = () => {
  if (document.fullscreenElement) document.exitFullscreen().catch(() => {});
  else frameEl.requestFullscreen?.().catch(() => {});
};
addEventListener('keydown', e => {
  if (e.target.tagName === 'INPUT') return;
  if (e.code === 'Space') { e.preventDefault(); if (phase === 'live') toggle(); }
  else if (e.key === 'r' || e.key === 'R') setup(true);
  else if (e.key === 'f' || e.key === 'F') $('#full').click();
  else if (e.key === 's' || e.key === 'S') $('#save').click();
});
let resizeTimer;
new ResizeObserver(() => {
  clearTimeout(resizeTimer);
  resizeTimer = setTimeout(() => setup(phase === 'intro'), 200);
}).observe(frameEl);

window.__flow = {
  get t() { return phase === 'intro' ? (performance.now() - introStart) / 1000 : 99; },
  get phase() { return phase; },
  get fps() { return fps; },
  get renderer() { return gpu ? 'webgl2' : 'canvas2d'; },
  params,
  skip: () => skipIntro(),
};

syncOutputs();
setup(!reducedMotion);
requestAnimationFrame(frame);
</script>
</body>
