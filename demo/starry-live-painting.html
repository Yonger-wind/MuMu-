    const b = 0.74 + 0.15 * Math.sin(t / s.per * 6.2832 + s.ph) + 0.11 * Math.sin(t / s.per2 * 6.2832 + s.ph * 2.1);
    const br = lerp(1, b, breathe);
    /* 先落"颜料星体"（旋笔精灵），再叠一层很轻的柔光：
       星是画出来的，不是打出来的光 */
    const g = s.glow * (1 + 0.05 * (br - 0.85));
    ctx.globalAlpha = aStar * 0.62 * br;
    ctx.drawImage(starSpr, s.x - g, s.y - g, g * 2, g * 2);
    ctx.globalAlpha = aStar * 0.20 * br * s.warm;
    const hg = g * 1.5;
    ctx.drawImage(glowSpr, s.x - hg, s.y - hg, hg * 2, hg * 2);
    ctx.globalAlpha = aStar * 0.70 * br;
    const c = s.core * (1 + 0.08 * (br - 0.85));
    ctx.drawImage(coreSpr, s.x - c * 2.0, s.y - c * 2.0, c * 4.0, c * 4.0);
  }
  if (aMoon > 0.004) {
    const S = moonSpr.width, mb = 1 + 0.045 * Math.sin(t / 9.3 * 6.2832) * breathe;
    const mx = 0.862 * W, my = 0.163 * H;
    ctx.globalAlpha = aMoon * 0.42 * mb;
    const hg = S * 0.92;
    ctx.drawImage(glowSpr, mx - hg, my - hg, hg * 2, hg * 2);
    ctx.globalAlpha = aMoon * (0.90 + 0.08 * (mb - 1));
    ctx.drawImage(moonSpr, mx - S / 2, my - S / 2, S, S);
  }
  ctx.globalAlpha = 1;
  ctx.globalCompositeOperation = 'source-over';
}

/* ══════════════════════════════════════════════════════════
   4. 场景几何（山脉 / 村庄 / 树）
   ══════════════════════════════════════════════════════════ */
function ridge(fn, from, to, steps) {
  const pts = [];
  for (let i = 0; i <= steps; i++) {
    const u = from + (to - from) * (i / steps);
    pts.push({ x: u * W, y: fn(u) * H });
  }
  return pts;
}
/* 山脊轮廓：多频不可公度正弦叠加 + 局部高斯丘峰与缺口，
   故意做成"不规则"，避免读成均匀波浪（原画的山是一条起伏很长的斜脊） */
const bump = (u, c, w, a) => a * Math.exp(-Math.pow((u - c) / w, 2));
const ridgeA = (u) => 0.588
  - 0.058 * Math.sin(u * 2.31 + 0.55) - 0.031 * Math.sin(u * 5.13 + 2.10)
  - 0.017 * Math.sin(u * 9.71 + 0.90) - 0.009 * Math.sin(u * 17.30 + 4.20)
  - bump(u, 0.70, 0.11, 0.070) - bump(u, 0.28, 0.075, 0.034) + bump(u, 0.48, 0.055, 0.026)
  - 0.118 * Math.pow(clamp((u - 0.56) / 0.44, 0, 1), 1.25);
const ridgeB = (u) => 0.668
  - 0.044 * Math.sin(u * 3.07 + 2.20) - 0.024 * Math.sin(u * 6.71 + 0.50)
  - 0.013 * Math.sin(u * 12.90 + 3.10)
  - bump(u, 0.83, 0.09, 0.052) - bump(u, 0.15, 0.08, 0.028) + bump(u, 0.52, 0.06, 0.020);
const ridgeC = (u) => 0.726
  - 0.030 * Math.sin(u * 4.11 + 1.10) - 0.017 * Math.sin(u * 8.90 + 2.70)
  - 0.008 * Math.sin(u * 15.70 + 0.40)
  - bump(u, 0.62, 0.10, 0.036) + bump(u, 0.34, 0.07, 0.018);
/* 右侧暗岩：原画右缘那块近乎黑色的山体，给画面一个"压角"的重量 */
const rockR = (u) => 0.505 + 0.055 * Math.sin(u * 7.1 + 1.4) + 0.026 * Math.sin(u * 19.3);

function buildGeometry() {
  const R = rng(4242);
  const houses = [];
  windows = [];
  chimneys = [];
  // 村庄：教堂居中，房舍成簇（保留原布局，只提高辨识度与高度差）
  const church = { x: 0.545 * W, w: 0.052 * W, body: 0.845 * H, top: 0.795 * H, spire: 0.675 * H, sw: 0.014 * W };
  const ROOF_TYPES = ['gable', 'hip', 'steep', 'barn', 'stepped'];
  for (let i = 0; i < 34; i++) {
    const u = 0.30 + R() * 0.62;
    const depth = R();
    const base = lerp(0.800, 0.985, depth) * H;
    const tall = R() < 0.26;                              // 少数窄高屋，拉开高度差
    const w = (tall ? 0.014 + R() * 0.014 : 0.020 + R() * 0.032) * W * lerp(0.8, 1.25, depth);
    const h = (tall ? 0.058 + R() * 0.030 : 0.026 + R() * 0.034) * H * lerp(0.8, 1.3, depth);
    const type = ROOF_TYPES[Math.floor(R() * (R() < 0.62 ? 3 : 5))];
    const roofH = h * (type === 'steep' ? 0.72 + R() * 0.42 : type === 'barn' ? 0.30 + R() * 0.16 : 0.40 + R() * 0.30);
    const hs = { x: u * W, base, w, h, roofH, type, ci: Math.floor(R() * 4), ri: Math.floor(R() * 5), z: depth };
    hs.wallPts = wallOutline(hs);
    hs.roofPts = roofOutline(hs);
    houses.push(hs);
  }
  houses.sort((a, b) => a.z - b.z);

  for (const hs of houses) {
    const t = hs.base - hs.h;
    const cols = hs.w > 0.030 * W ? 3 : 2;
    for (let c = 0; c < cols; c++) {
      if (R() < 0.30) continue;
      windows.push({
        x: hs.x - hs.w / 2 + (c + 0.5) * (hs.w / cols),
        y: t + hs.h * (0.30 + R() * 0.44),
        w: Math.max(1.8, hs.w * 0.15), h: Math.max(2.4, hs.h * 0.19),
        base: 0.34 + R() * 0.48, p1: 3.1 + R() * 6.7, p2: 7.9 + R() * 12.3, ph: R() * 6.28,
        dip: R() < 0.30 ? (13 + R() * 24) : 0,
        warm: 0.55 + R() * 0.45, z: hs.z
      });
    }
    // 烟囱：只给较近的房屋，少量即可（烟雾是环境运动，不是主角）
    if (hs.z > 0.42 && R() < 0.30) {
      const cw = Math.max(2.2, hs.w * 0.16);
      const cx = hs.x + (R() < 0.5 ? -1 : 1) * hs.w * (0.18 + R() * 0.20);
      const cy = hs.base - hs.h - hs.roofH * (0.45 + R() * 0.35);
      chimneys.push({ x: cx, y: cy, w: cw, h: Math.max(4, hs.h * 0.30), z: hs.z, ph: R() * 6.28, rate: 0.55 + R() * 0.5 });
    }
  }

  // 前景柏树：主树 + 副树（火焰状剪影，由大量纵向卷曲笔触组成；位置与剪影沿用上一轮）
  const trees = [
    { x: 0.158 * W, base: 1.06 * H, top: 0.055 * H, half: 0.062 * W, lean: 0.026, strands: 132, curl: 0.030 },
    { x: 0.262 * W, base: 1.06 * H, top: 0.470 * H, half: 0.030 * W, lean: -0.018, strands: 64, curl: 0.021 },
    { x: 0.948 * W, base: 1.06 * H, top: 0.560 * H, half: 0.021 * W, lean: 0.010, strands: 40, curl: 0.014 }
  ];
  treeStrands = [];
  trees.forEach((tr, ti) => {
    for (let i = 0; i < tr.strands; i++) {
      const off = (i / (tr.strands - 1)) * 2 - 1;                  // -1..1 横向位置
      const cph = rng(i * 97 + ti * 13)() * 6.28;                   // 每束自己的卷曲相位
      const cw = 0.6 + rng(i * 53 + ti * 7)() * 1.5;
      const pts = [];
      const N = 18;
      for (let k = 0; k <= N; k++) {
        const h = k / N;                                            // 0 底 → 1 顶
        // 火焰形：下部宽厚、中部鼓出、上部收尖（指数放缓，避免读成草叶）
        const taper = Math.pow(1 - h, 0.42) * (0.80 + 0.34 * Math.sin(h * 6.2 + off * 1.9 + cph * 0.3))
          * (1 + 0.30 * Math.exp(-Math.pow((h - 0.30) / 0.19, 2)));
        const spine = tr.x + tr.lean * W * Math.pow(h, 1.7)
          + tr.curl * W * Math.sin(h * 3.4 + cph * 0.5) * (0.6 + h)
          + Math.sin(h * 5.2 + cph) * tr.half * 0.14 * cw;
        const x = spine + off * tr.half * taper;
        const y = lerp(tr.base, tr.top, h) + Math.abs(off) * tr.half * 0.20 * Math.sin(h * 5.1 + cph * 0.4);
        pts.push({ x, y });
      }
      // 受光侧（朝向画面右上的月与星）用较亮的深青，背光侧用深蓝黑 → 体积感
      // 色相只在"深蓝—深青"之间，不引入绿与锈，避免树读成草丛
      const lit = clamp(0.5 + off * 0.5, 0, 1);
      treeStrands.push({
        tree: ti, pts, off, lit,
        w: (7.0 + Math.abs(off) * 3.5 + rng(i * 7 + ti)() * 9.0) * (W / 1440),
        ci: Math.min(6, Math.floor(rng(i * 13 + ti * 5)() * 4 + lit * 3)),
        ph: rng(i * 31 + ti)() * 6.28,
        amp: (0.26 + rng(i * 17 + ti * 3)() * 0.80) * (W / 1440),
        al: 0.40 + rng(i * 23 + ti * 9)() * 0.48,
        xs: new Float64Array(N + 1), ys: new Float64Array(N + 1)   // 复用，避免每帧分配
      });
    }
  });

  geometry = {
    church, houses, trees,
    ridgeA: ridge(ridgeA, 0, 1, 150), ridgeB: ridge(ridgeB, 0, 1, 150), ridgeC: ridge(ridgeC, 0, 1, 150),
    rock: ridge(rockR, 0.855, 1.02, 40)
  };
}
/** 墙体轮廓（各屋顶类型共用） */
function wallOutline(hs) {
  const l = hs.x - hs.w / 2, r = hs.x + hs.w / 2, b = hs.base, t = hs.base - hs.h;
  if (hs.type === 'gable' || hs.type === 'steep') return [{ x: l, y: b }, { x: l, y: t }, { x: r, y: t }, { x: r, y: b }];
  if (hs.type === 'hip') return [{ x: l, y: b }, { x: l + hs.w * 0.12, y: t }, { x: r - hs.w * 0.12, y: t }, { x: r, y: b }];
  if (hs.type === 'barn') return [{ x: l, y: b }, { x: l, y: t + hs.h * 0.12 }, { x: hs.x, y: t }, { x: r, y: t + hs.h * 0.12 }, { x: r, y: b }];
  return [{ x: l, y: b }, { x: l, y: t }, { x: r, y: t }, { x: r, y: b }];   // stepped
}
/** 屋顶脊线（用于厚涂斜笔与轮廓） */
function roofOutline(hs) {
  const l = hs.x - hs.w / 2, r = hs.x + hs.w / 2, t = hs.base - hs.h;
  switch (hs.type) {
    case 'gable': return [{ x: l - hs.w * .08, y: t + 1.5 }, { x: hs.x, y: t - hs.roofH }, { x: r + hs.w * .08, y: t + 1.5 }];
    case 'steep': return [{ x: l - hs.w * .06, y: t + 1.5 }, { x: hs.x - hs.w * .10, y: t - hs.roofH }, { x: hs.x + hs.w * .10, y: t - hs.roofH }, { x: r + hs.w * .06, y: t + 1.5 }];
    case 'hip': return [{ x: l - hs.w * .07, y: t + 1.5 }, { x: l + hs.w * .12, y: t - hs.roofH * .72 }, { x: r - hs.w * .12, y: t - hs.roofH * .72 }, { x: r + hs.w * .07, y: t + 1.5 }];
    case 'barn': return [{ x: l - hs.w * .08, y: t + hs.h * .16 }, { x: l + hs.w * .16, y: t - hs.roofH * .55 }, { x: r - hs.w * .16, y: t - hs.roofH * .55 }, { x: r + hs.w * .08, y: t + hs.h * .16 }];
    default: return [{ x: l - hs.w * .07, y: t + 1.5 }, { x: hs.x, y: t - hs.roofH }, { x: r + hs.w * .07, y: t + 1.5 }];
  }
}

/* ── 烘焙：夜空（Layer1：渐变 + 厚涂底层结构 + 手绘纹理） ── */
/** 锥形缎带：整条路径一次填充（两侧变宽的多边形），
 *  避免逐段描边时圆头端点在节点处叠加出「珠链」亮斑 */
function ribbonTaper(x, pts, wMax, col, a, closed) {
  const n = pts.length;
  if (n < 3) return;
  const L = [], Rv = [];
  for (let i = 0; i < n; i++) {
    const t = i / (n - 1);
    const prof = closed ? 1 : Math.pow(Math.sin(Math.PI * Math.pow(t, 0.85)), 0.75);
    const hw = Math.max(0.4, wMax * (0.32 + 0.68 * prof)) * 0.5;
    const p = pts[i];
    const q = pts[i === 0 ? (closed ? n - 1 : 1) : i - 1];
    const r = pts[i === n - 1 ? (closed ? 0 : n - 2) : i + 1];
    let dx = r.x - q.x, dy = r.y - q.y;
    const dl = Math.hypot(dx, dy) || 1;
    const nx = -dy / dl, ny = dx / dl;
    L.push({ x: p.x + nx * hw, y: p.y + ny * hw });
    Rv.push({ x: p.x - nx * hw, y: p.y - ny * hw });
  }
  x.beginPath();
  x.moveTo(L[0].x, L[0].y);
  for (let i = 1; i < n; i++) x.lineTo(L[i].x, L[i].y);
  if (closed) x.lineTo(L[0].x, L[0].y);
  for (let i = n - 1; i >= 0; i--) x.lineTo(Rv[i].x, Rv[i].y);
  if (closed) x.lineTo(Rv[0].x, Rv[0].y);
  x.closePath();
  x.fillStyle = `rgba(${col[0]},${col[1]},${col[2]},${a})`;
  x.fill();
}
/** 单支油画笔触（颜料块）：沿 ang 方向铺开，宽度按 prof 收尖，
 *  curve 让整支笔弯曲，两端一粗一细 → 读作"下笔"而不是"线段" */
function daub(x, px, py, ang, len, wid, curve, col, alpha, loaded) {
  const n = 5;
  /* loaded：饱笔——落笔钝、收笔提走。默认是两头收尖的逗号笔，
     两种混用才不会让整幅厚涂读成同一种"羽毛"。 */
  const prof = loaded ? [0.62, 1.00, 0.90, 0.54, 0.13] : [0.20, 0.70, 1.00, 0.62, 0.15];
  const dx = Math.cos(ang), dy = Math.sin(ang), nx = -dy, ny = dx;
  x.beginPath();
  for (let i = 0; i < n; i++) {
    const t = i / (n - 1) - 0.5;
    const bow = Math.sin(Math.PI * (t + 0.5)) * curve * wid * 2.1;
    const cx = px + dx * len * t + nx * bow, cy = py + dy * len * t + ny * bow;
    const hw = Math.max(0.35, wid * prof[i]) * 0.5;
    const X = cx + nx * hw, Y = cy + ny * hw;
    i ? x.lineTo(X, Y) : x.moveTo(X, Y);
  }
  for (let i = n - 1; i >= 0; i--) {
    const t = i / (n - 1) - 0.5;
    const bow = Math.sin(Math.PI * (t + 0.5)) * curve * wid * 2.1;
    const cx = px + dx * len * t + nx * bow, cy = py + dy * len * t + ny * bow;
    const hw = Math.max(0.35, wid * prof[i]) * 0.5;
    x.lineTo(cx - nx * hw, cy - ny * hw);
  }
  x.closePath();
  x.fillStyle = `rgba(${col[0]},${col[1]},${col[2]},${alpha})`;
  x.fill();
}
/** 该点的「笔触脊线」强度：越靠近主带与涡环越亮 */
function crestAt(x, y) {
  const u = x / W, v = y / H;
  let c = Math.exp(-Math.pow((v - bandY(u)) / 0.062, 2)) * 0.9;
  for (let i = 0; i < 5; i++) {
    const vo = vortices[i];
    const d = Math.hypot(x - vo.cx, (y - vo.cy) / vo.squash);
    c = Math.max(c, Math.exp(-Math.pow((d - vo.r * 0.72) / (vo.r * 0.42), 2)) * 1.0);
  }
  return clamp(c, 0, 1);
}
function bakeSky() {
  const c = document.createElement('canvas'); c.width = Math.round(W * DPR); c.height = Math.round(H * DPR);
  const x = c.getContext('2d'); x.scale(DPR, DPR);
  const S = W / 1440;

  /* ── 底色：深蓝→群青→地平线处提亮，比上一轮整体提高明度 ── */
  const g = x.createLinearGradient(0, 0, 0, H * 0.80);
  g.addColorStop(0, PAL.nightTop); g.addColorStop(0.34, PAL.nightMid);
  g.addColorStop(0.70, PAL.nightLow); g.addColorStop(1, PAL.horizon);
  x.fillStyle = g; x.fillRect(0, 0, W, H);
  const g2 = x.createLinearGradient(0, H * 0.40, 0, H * 0.76);
  g2.addColorStop(0, 'rgba(126,176,212,0)'); g2.addColorStop(1, 'rgba(176,210,222,.26)');
  x.fillStyle = g2; x.fillRect(0, H * 0.40, W, H * 0.38);

  const R = rng(9001);
  const skyH = H * 0.76;

  /* ── ① 大结构：主带与涡体的宽笔厚涂（画面骨架，稳定不动） ── */
  const bandPts = [];
  for (let i = 0; i <= 110; i++) { const u = i / 110; bandPts.push({ x: u * W, y: bandY(u) * H }); }
  /* 主带的宽笔：切成一段一段，绝不是一条通长的带子。
     通长平行带在竖屏会读成一族同心弧（工程图感），断开后才是一笔一笔撂出来的。 */
  const bandChunk = (pts, wid, col, al, jitter) => {
    let i = 0;
    while (i < pts.length - 6) {
      const e = Math.min(pts.length, i + 7 + Math.floor(R() * 15));
      const seg = pts.slice(i, e).map((p) => ({ x: p.x, y: p.y + (R() - 0.5) * jitter }));
      ribbonTaper(x, seg, wid * (0.62 + R() * 0.85), col, al * (0.70 + R() * 0.75));
      i = e + Math.floor(3 + R() * 11);
    }
  };
  /* 带子的取色压在群青以下（≤4 号）：主带正好穿过大旋涡，
     一旦用浅蓝宽笔，就在涡心撂出几片"亮色贴片"，读成图案而不是颜料。 */
  for (let k = 0; k < 7; k++) {
    const off = (k - 3) * H * 0.030;
    const p = bandPts.map((q, i) => ({ x: q.x, y: q.y + off + Math.sin(i * 0.12 + k) * H * 0.007 }));
    const dark = k % 3 === 0;
    bandChunk(p, (13 + R() * 15) * S, dark ? PAL.stroke[1 + (k % 2)] : PAL.stroke[2 + (k % 3)],
      dark ? 0.24 + R() * 0.14 : 0.13 + R() * 0.10, H * 0.017);
  }
  for (let k = 0; k < 5; k++) {
    const p = bandPts.map((q, i) => ({ x: q.x, y: q.y + (k - 2) * H * 0.056 + Math.sin(i * 0.09 + k * 1.7) * H * 0.011 }));
    bandChunk(p, (8 + R() * 9) * S, PAL.stroke[3 + (k % 2)], 0.09 + R() * 0.08, H * 0.022);
  }
  /* 涡体：螺旋臂为骨 + 少量错位开口弧（半径彼此不等距，避免"环笼"）*/
  for (let i = 0; i < 5; i++) {
    const vo = vortices[i];
    const arms = i === 2 ? 9 : 7;
    for (let k = 0; k < arms; k++) {
      const phase = k / arms * Math.PI * 2 + i * 0.6 + R() * 0.6;
      const pts = spiralPts(vo, vo.r * (0.14 + R() * 0.20), vo.r * (0.88 + R() * 0.60),
        1.1 + R() * 0.9, phase, 0.8 + R() * 1.2);
      const dark = k % 3 === 0;
      /* 螺旋臂也断成几截：一条通长的臂是"线"，断成三四截才是"笔"。
         截段再抖一下：不抖的话每一截都是光滑弧带，读成贴在涡上的亮片。 */
      for (let q = 0; q < 3; q++) {
        const s0 = Math.floor(R() * pts.length * 0.6);
        const e0 = Math.min(pts.length, s0 + Math.floor(pts.length * (0.12 + R() * 0.18)));
        const seg = pts.slice(s0, e0).map((p) => ({ x: p.x, y: p.y + (R() - 0.5) * H * 0.012 }));
        ribbonTaper(x, seg, (6 + R() * 11) * S,
          dark ? PAL.stroke[1 + (k % 3)] : PAL.stroke[2 + (k % 3)],
          dark ? 0.22 + R() * 0.15 : 0.12 + R() * 0.11);
      }
    }
    for (let k = 0; k < 7; k++) {
      const rad = 0.50 + k * 0.31 + R() * 0.75;                   // 半径彼此不等距
      const full = vortexLoopPts(vo, rad, R() * 40, 1.1 + R() * 1.3);
      const s = Math.floor(R() * 22), e = s + Math.floor(full.length * (0.07 + R() * 0.13));
      /* 取色压在中低明度：通长的高亮弧带会读成"剪纸贴片"，
         只有把它当普通一笔颜料压暗，涡体才有厚薄而不是图案。 */
      ribbonTaper(x, full.slice(s, Math.min(e, full.length)), (4 + R() * 9) * S,
        PAL.stroke[1 + (k % 4)], 0.09 + R() * 0.11);
    }
    /* 涡心压暗：让旋涡有深度，而不是一团发光 */
    for (let k = 0; k < 16; k++) {
      const a = R() * 6.2832, rr = vo.r * (0.05 + R() * 0.30);
      daub(x, vo.cx + Math.cos(a) * rr, vo.cy + Math.sin(a) * rr * vo.squash,
        a + Math.PI / 2 * vo.spin, (10 + R() * 20) * S, (3 + R() * 7) * S, 0.6 + R() * 0.8,
        PAL.stroke[R() < 0.6 ? 0 : 1], 0.16 + R() * 0.16);
    }
  }

  /* ── ② 厚涂碎笔：按区域密度铺开，长短粗细与虚实都拉开 ── */
  const total = Math.round(CONFIG.impastoBase * clamp(CONFIG.strokeDensity, 0.5, 1.8)
    * clamp((W * H) / (1440 * 900), 0.60, 1.6));   // 竖屏天空占比更大，不能按面积线性缩减
  let laid = 0, tries = 0;
  while (laid < total && tries++ < total * 6) {
    const px = R() * W, py = Math.pow(R(), 0.9) * skyH;
    if (R() * 1.6 > densityAt(px, py)) continue;
    laid++;
    const f = fieldAt(px, py); const fx = f[0], fy = f[1];
    const ang = Math.atan2(fy, fx) + (R() - 0.5) * 0.34;
    const cr = crestAt(px, py);
    const shape = R();
    const len = (shape < 0.20 ? 6 + R() * 11 : shape < 0.60 ? 14 + R() * 28 : 30 + R() * 46) * S;
    /* 长笔必须又窄又直：一笔撂出去半米还带大弯，就弯成了"钩子/贴片"，
       短笔才允许胖和卷。 */
    const long = shape >= 0.60;
    const wid = len * (long ? 0.10 + R() * 0.12 : 0.16 + R() * 0.28);
    const curl = (R() - 0.5) * (long ? 0.55 : 1.5);
    /* 明度跟随脊线：脊上亮、槽内暗，形成明显的深浅层次。
       上限压在湖蓝（6 号）——浅蓝只留给少数亮笔，天空才不会整片发白。 */
    const ci = clamp(Math.round(0.7 + cr * 4.6 + (R() - 0.5) * 2.8), 0, 6);
    daub(x, px, py, ang, len, wid, curl, PAL.stroke[ci], 0.15 + R() * 0.28 + cr * 0.14,
      R() < 0.45);
  }

  /* ── ③ 深色沟槽：multiply 压出笔触之间的暗缝，避免平涂 ── */
  x.globalCompositeOperation = 'multiply';
  for (let i = 0; i < Math.round(total * 0.26); i++) {
    const px = R() * W, py = R() * skyH;
    const f = fieldAt(px, py);
    const ang = Math.atan2(f[1], f[0]) + (R() - 0.5) * 0.3;
    const len = (14 + R() * 34) * S;
    daub(x, px, py, ang, len, len * (0.18 + R() * 0.22), (R() - 0.5) * 1.1, [14, 26, 62], 0.22 + R() * 0.30);
  }
  x.globalCompositeOperation = 'source-over';

  /* ── ④ 亮笔与暖黄：数量严格受限，只作高光点缀，不发光成"线条" ── */
  x.globalCompositeOperation = 'lighter';
  for (let i = 0; i < Math.round(total * 0.055); i++) {
    const px = R() * W, py = R() * skyH;
    const cr = crestAt(px, py);
    if (R() > 0.25 + cr * 0.7) continue;
    const f = fieldAt(px, py);
    const ang = Math.atan2(f[1], f[0]) + (R() - 0.5) * 0.4;
    const len = (10 + R() * 26) * S;
    daub(x, px, py, ang, len, len * (0.14 + R() * 0.20), (R() - 0.5) * 1.2,
      PAL.stroke[R() < 0.7 ? 7 : 8], 0.10 + R() * 0.20);
  }
  /* 星光附近的极少量暖黄反射 */
  for (const s of stars) {
    for (let i = 0; i < 7; i++) {
      const a = R() * 6.2832, rr = s.glow * (1.05 + R() * 1.5);
      const px = s.x + Math.cos(a) * rr, py = s.y + Math.sin(a) * rr * 0.9;
      const f = fieldAt(px, py);
      daub(x, px, py, Math.atan2(f[1], f[0]), (8 + R() * 16) * S, (2 + R() * 4) * S, (R() - .5) * 1.4,
        PAL.stroke[R() < 0.5 ? 10 : 11], 0.08 + R() * 0.14);
    }
  }
  x.globalCompositeOperation = 'source-over';

  /* ── ⑤ 天地过渡：沿远山脊线上方压一排向下勾的笔，
         与山脉里向上勾的笔咬合，地平线就不是"贴边" ── */
  const rp = geometry.ridgeA;
  for (let i = 0; i < rp.length - 1; i += 2) {
    const p = rp[i];
    if (p.y > skyH) continue;
    for (let k = 0; k < 3; k++) {
      const px = p.x + (R() - 0.5) * W * 0.02;
      const py = p.y - (2 + R() * 22) - k * 6;
      daub(x, px, py, Math.PI / 2 + (R() - 0.5) * 0.7, (10 + R() * 20) * S, (2.4 + R() * 4.4) * S,
        (R() - 0.5) * 1.6, PAL.stroke[5 + Math.floor(R() * 3)], 0.12 + R() * 0.16);
    }
  }

  /* ── ⑥ 画布颗粒烘进底层，省掉每帧全屏 overlay 混合 ── */
  applyGrain(x, W, H, 0.17);
  return c;
}
/** 把 512 图块平铺为画布织纹（soft-light），烘焙进各静态层 */
function applyGrain(x, w, h, alpha) {
  const pat = x.createPattern(grainTile, 'repeat');
  x.save();
  x.globalCompositeOperation = 'soft-light';
  x.globalAlpha = alpha;
  x.fillStyle = pat; x.fillRect(0, 0, w, h);
  x.restore();
}

/* ── 烘焙：山脉（Layer4：远/中/近三层 + 右侧暗岩 + 成簇排线） ── */
/** 冷暖局部偏移：同一层里有的坡面偏紫灰、有的偏青绿，避免整片一个色温 */
function hillWarm(px) { return 0.5 + 0.5 * Math.sin(px / W * 2.6 + 1.1) * Math.cos(px / W * 1.3 - 0.4); }
/** 成簇排线：先选「笔簇」中心，再在簇内连续下笔 → 疏密自然，不是均匀噪点。
 *  dens 按层给：远山稀而淡（退得远），近山密而重（压得住）。 */
function hillCluster(x, R, pts, depth, pal, S, skyLine, dens) {
  const n = pts.length;
  const clusters = Math.round(760 * dens * clamp((W * H) / (1440 * 900), 0.4, 1.8));
  for (let ci = 0; ci < clusters; ci++) {
    const k = Math.floor(R() * (n - 2));
    const p = pts[k], q = pts[k + 1];
    let tx = q.x - p.x, ty = q.y - p.y; const tl = Math.hypot(tx, ty) || 1;
    tx /= tl; ty /= tl;
    const off0 = Math.pow(R(), 1.5) * depth * H;
    const cx0 = p.x + (R() - 0.5) * W * 0.05, cy0 = p.y + off0;
    if (cy0 > H + 20) continue;
    const cnt = 5 + Math.floor(R() * 12);
    const wc = hillWarm(cx0);
    for (let j = 0; j < cnt; j++) {
      const px = cx0 + (R() - 0.5) * W * 0.034;
      const py = cy0 + (R() - 0.5) * H * 0.022 + j * depth * H * 0.010;
      if (py > H + 10) continue;
      const near = clamp((py - p.y) / (depth * H), 0, 1);          // 越往下越暗（体积）
      /* 低频明暗面：整片坡被几个大缓波分成就光面与背光面，笔触跟着明暗走
         才读得出"体块"——均匀铺小笔只会变成一块噪点地毯（规格明令禁止的做法）。 */
      const plane = 0.5 + 0.5 * Math.sin(px / W * 4.1 + py / H * 2.6 + wc * 1.4)
        * Math.cos(px / W * 1.7 - py / H * 3.3);
      const lr = R();
      const len = (lr < 0.60 ? 11 + R() * 21 : lr < 0.86 ? 24 + R() * 34 : 44 + R() * 62)
        * S * (1 - near * 0.22);
      const wid = len * (0.10 + R() * 0.22) + 1.2 * S;
      const ang = Math.atan2(ty, tx) + (R() - 0.5) * (lr > 0.86 ? 0.34 : 0.80);
      const dark = R() < (0.56 - plane * 0.34);
      const col = dark
        ? [10 + wc * 14, 18 + wc * 12, 44 + wc * 10]
        : pal[Math.min(pal.length - 1, Math.floor(R() * pal.length + plane * 1.25))];
      const a = dark ? 0.18 + R() * 0.24
        : (0.15 + R() * 0.25) * (1.16 - near * 0.5) * (0.72 + plane * 0.55);
      daub(x, px, py, ang, len, wid, (R() - 0.5) * 1.3, col, a, R() < 0.40);
      /* 山脊上方少量向上勾的亮笔：与天空笔触咬合，天地不脱节 */
      if (skyLine && py < p.y + 8 && R() < 0.34) {
        daub(x, px, py - 4, ang - Math.PI * 0.14, len * 0.85, wid * 0.95, 0.8 + R() * 0.9,
          [126 + wc * 40, 168 + wc * 26, 212], 0.14 + R() * 0.16);
      }
    }
  }
}
function bakeHills() {
  const c = document.createElement('canvas'); c.width = Math.round(W * DPR); c.height = Math.round(H * DPR);
  const x = c.getContext('2d'); x.scale(DPR, DPR);
  const R = rng(5150);
  const S = W / 1440;
  x.lineCap = 'round';

  /* 远山之上的空气透视：很淡的一条，不做硬边雾带 */
  const haze = x.createLinearGradient(0, H * 0.52, 0, H * 0.66);
  haze.addColorStop(0, 'rgba(60,108,158,0)');
  haze.addColorStop(0.6, 'rgba(66,116,164,.20)');
  haze.addColorStop(1, 'rgba(34,64,108,.06)');
  x.fillStyle = haze; x.fillRect(0, H * 0.52, W, H * 0.15);

  const layers = [
    { pts: geometry.ridgeA, depth: 0.20, top: '#2f5c92', bot: '#1c3c6a', pal: [[46, 86, 140], [32, 64, 118], [62, 110, 160], [84, 132, 172]], seed: 0.0, rimA: 1.0, sky: true, dens: 0.50 },
    { pts: geometry.ridgeB, depth: 0.17, top: '#22456f', bot: '#152c52', pal: [[38, 72, 122], [26, 52, 96], [56, 96, 146], [66, 90, 122]], seed: 2.1, rimA: 0.82, sky: false, dens: 0.95 },
    { pts: geometry.ridgeC, depth: 0.20, top: '#16305a', bot: '#0b1c3e', pal: [[24, 48, 90], [16, 34, 66], [38, 70, 112], [30, 66, 72]], seed: 4.4, rimA: 0.62, sky: false, dens: 1.20 }
  ];
  for (const L of layers) {
    x.beginPath(); x.moveTo(L.pts[0].x, L.pts[0].y);
    for (const p of L.pts) x.lineTo(p.x, p.y);
    x.lineTo(W, H); x.lineTo(0, H); x.closePath();
    const g = x.createLinearGradient(0, L.pts[0].y, 0, H);
    g.addColorStop(0, L.top); g.addColorStop(1, L.bot);
    x.fillStyle = g; x.fill();
    hillCluster(x, R, L.pts, L.depth, L.pal, S, L.sky, L.dens);
    /* 脊线：断成一截一截的亮笔，明度随起伏走。
       连续等粗的亮线是"工程线"的来源，这里刻意留缺口。 */
    for (let i = 1; i < L.pts.length - 1; i += 2) {
      if (R() < 0.20) continue;                          // 缺口
      const p = L.pts[i], q = L.pts[i + 1];
      const ang = Math.atan2(q.y - p.y, q.x - p.x);
      const t = 0.5 + 0.5 * Math.sin(i * 0.31 + L.seed) * Math.cos(i * 0.11 + L.seed * 1.7);
      daub(x, (p.x + q.x) / 2, (p.y + q.y) / 2 + 0.8, ang,
        Math.hypot(q.x - p.x, q.y - p.y) * 2.1,
        (0.9 + t * 1.9) * S + 0.4, (R() - 0.5) * 0.8,
        [142 + t * 48, 184 + t * 28, 224], (0.08 + 0.17 * t) * L.rimA);
    }
  }
  /* 右侧暗岩：压住画面右缘，给纵深一个重音。
     底宽顶窄的"肩"，左界是一条起伏斜线——竖直硬边会读成矩形或帆。 */
  const rk = geometry.rock;
  x.beginPath(); x.moveTo(rk[0].x, rk[0].y);
  for (const p of rk) x.lineTo(p.x, p.y);
  x.lineTo(W, H * 0.96);
  for (let i = 26; i >= 0; i--) {
    const k = i / 26;                                   // 1 底 → 0 顶
    const xl = lerp(rk[0].x, W * 0.715, Math.pow(k, 0.8))
      + W * 0.018 * Math.sin(k * 5.3 + 1.1) * k;
    x.lineTo(xl, lerp(rk[0].y + 6, H * 0.96, k));
  }
  x.closePath();
  const rg = x.createLinearGradient(W * 0.74, H * 0.55, W, H * 0.92);
  rg.addColorStop(0, '#16305a'); rg.addColorStop(1, '#071429');
  x.fillStyle = rg; x.fill();
  for (let i = 0; i < 520; i++) {
    const px = W * (0.725 + R() * 0.275), py = H * (0.52 + R() * 0.44);
    daub(x, px, py, -0.42 + (R() - 0.5) * 1.0, (9 + R() * 26) * S, (1.6 + R() * 4.2) * S,
      (R() - 0.5) * 1.4, R() < 0.58 ? [10, 22, 46] : [42, 70, 114], 0.15 + R() * 0.26);
  }
  /* 左界用身后山色打散：硬直边会读成一块帆，被咬过的边才像山岩 */
  for (let i = 26; i >= 0; i--) {
    const k = i / 26;
    const xl = lerp(rk[0].x, W * 0.715, Math.pow(k, 0.8)) + W * 0.018 * Math.sin(k * 5.3 + 1.1) * k;
    const yl = lerp(rk[0].y + 6, H * 0.96, k);
    for (let j = 0; j < 11; j++) {
      daub(x, xl + R() * W * 0.026, yl + (R() - 0.5) * H * 0.034,
        -0.30 + (R() - 0.5) * 0.9, (13 + R() * 28) * S, (3 + R() * 7) * S,
        (R() - 0.5) * 1.2, R() < 0.5 ? [40, 76, 124] : [58, 96, 142], 0.34 + R() * 0.38);
    }
  }

  /* 近景田地的长笔：横向蜿蜒，与原画下方的条带笔意一致 */
  for (let band = 0; band < 4; band++) {
    const yBase = 0.800 + band * 0.052;
    for (let i = 0; i < 150; i++) {
      const u = R();
      const px = u * W;
      const py = (yBase + 0.016 * Math.sin(u * 5.1 + band * 2.2) + 0.008 * Math.sin(u * 11.3 + band)) * H
        + (R() - 0.5) * H * 0.020;
      const wc = hillWarm(px);
      const warm = R() < 0.14;
      const col = warm ? [112 + wc * 40, 96 + wc * 30, 52 + wc * 24] : [26 + wc * 22, 54 + wc * 26, 92 + wc * 26];
      daub(x, px, py, (R() - 0.5) * 0.28, (16 + R() * 46) * S, (1.6 + R() * 4.2) * S,
        (R() - 0.5) * 0.9, col, 0.12 + R() * 0.22);
    }
  }
  /* 田埂 / 小路的蜿蜒亮线：断成短笔，给前景结构但不出现连续细线 */
  for (let w = 0; w < 3; w++) {
    const yBase = 0.818 + w * 0.056;
    for (let i = 0; i < 90; i += 3) {
      if (R() < 0.26) continue;
      const u = i / 90, u2 = (i + 3) / 90;
      const py = (yBase + 0.020 * Math.sin(u * 5.1 + w * 2.2) + 0.010 * Math.sin(u * 11.3 + w)) * H;
      const py2 = (yBase + 0.020 * Math.sin(u2 * 5.1 + w * 2.2) + 0.010 * Math.sin(u2 * 11.3 + w)) * H;
      const wc = hillWarm(u * W);
      daub(x, u * W, py, Math.atan2(py2 - py, (u2 - u) * W), (u2 - u) * W * 1.7,
        (2.2 - w * 0.5) * S + 0.5, (R() - 0.5) * 0.5,
        [120 + wc * 40, 158 + wc * 26, 200], 0.10 - w * 0.02 + R() * 0.05);
    }
  }
  applyGrain(x, W, H, 0.13);
  return c;
}
/* ── 烘焙：村庄（Layer5 体块：实色墙 + 屋顶面 + 灌木 + 烟囱） ── */
function polyPath(x, pts) {
  x.beginPath(); x.moveTo(pts[0].x, pts[0].y);
  for (let i = 1; i < pts.length; i++) x.lineTo(pts[i].x, pts[i].y);
  x.closePath();
}
function bakeVillage() {
  const c = document.createElement('canvas'); c.width = Math.round(W * DPR); c.height = Math.round(H * DPR);
  const x = c.getContext('2d'); x.scale(DPR, DPR);
  const R = rng(3131);
  const S = W / 1440;
  x.lineCap = 'round';
  const ch = geometry.church;

  /* 教堂：体块 + 尖塔（原画里它是画面唯一的高光白，但这里让它保持冷白蓝，
     避免抢过星空；钟面单独给一点暖色） */
  const cw = ch.w, cl = ch.x - cw / 2, ct = ch.top, cb = ch.body;
  x.fillStyle = 'rgba(4,9,24,.42)';
  x.beginPath(); x.ellipse(ch.x, cb + cw * 0.10, cw * 0.86, cw * 0.14, 0, 0, 6.2832); x.fill();
  x.fillStyle = '#37527f'; x.fillRect(cl, ct, cw, cb - ct);
  for (let i = 0; i < 22; i++) {                              // 墙面横排笔
    const yy = ct + R() * (cb - ct);
    x.strokeStyle = R() < 0.4 ? `rgba(14,28,56,${0.16 + R() * 0.2})` : `rgba(${130 + R() * 60 | 0},${160 + R() * 50 | 0},${196},${0.10 + R() * 0.16})`;
    x.lineWidth = 0.9 + R() * 2.0;
    x.beginPath(); x.moveTo(cl - 2, yy); x.quadraticCurveTo(ch.x, yy + (R() - .5) * 3, cl + cw + 2, yy); x.stroke();
  }
  polyPath(x, [{ x: cl - cw * .06, y: ct + 2 }, { x: ch.x, y: ct - cw * .52 }, { x: cl + cw * 1.06, y: ct + 2 }]);
  x.fillStyle = '#1b2f4f'; x.fill();
  x.strokeStyle = 'rgba(150,190,226,.22)'; x.lineWidth = 1.1; x.stroke();
  /* 尖塔 */
  polyPath(x, [{ x: ch.x - ch.sw / 2, y: ct }, { x: ch.x, y: ch.spire }, { x: ch.x + ch.sw / 2, y: ct }]);
  const sg = x.createLinearGradient(ch.x - ch.sw, ct, ch.x + ch.sw, ch.spire);
  sg.addColorStop(0, '#2a4270'); sg.addColorStop(1, '#4a6b9a');
  x.fillStyle = sg; x.fill();
  x.strokeStyle = 'rgba(196,220,242,.34)'; x.lineWidth = 1.1 * S + .4; x.stroke();
  for (let i = 0; i < 12; i++) {                               // 塔身斜笔
    const yy = ct - R() * (ct - ch.spire);
    const k = (ct - yy) / (ct - ch.spire);
    const hw = ch.sw / 2 * (1 - k);
    x.strokeStyle = `rgba(${120 + R() * 70 | 0},${150 + R() * 60 | 0},196,${0.10 + R() * 0.16})`;
    x.lineWidth = 0.8 + R() * 1.4;
    x.beginPath(); x.moveTo(ch.x - hw, yy); x.lineTo(ch.x + hw, yy - 3); x.stroke();
  }
  x.strokeStyle = 'rgba(214,226,242,.5)'; x.lineWidth = 1.2 * S + .4;
  x.beginPath(); x.moveTo(ch.x, ch.spire); x.lineTo(ch.x, ch.spire - 0.020 * H); x.stroke();
  x.fillStyle = 'rgba(226,200,124,.62)';
  x.beginPath(); x.arc(ch.x, ch.spire + (ct - ch.spire) * 0.52, Math.max(1.8, ch.sw * 0.36), 0, 6.2832); x.fill();

  /* 房舍：实色墙 + 屋顶面 + 手绘笔触 + 接地阴影 + 远处空气透视 */
  for (const hs of geometry.houses) {
    const l = hs.x - hs.w / 2, r = hs.x + hs.w / 2, t = hs.base - hs.h;
    const far = 1 - hs.z;
    x.fillStyle = `rgba(4,9,24,${0.26 + hs.z * 0.26})`;
    x.beginPath();
    x.ellipse(hs.x, hs.base + hs.h * 0.04, hs.w * 0.78, Math.max(1.6, hs.h * 0.10), 0, 0, 6.2832);
    x.fill();
    /* 墙：不透明渐变体块 */
    polyPath(x, hs.wallPts);
    const g = x.createLinearGradient(0, t, 0, hs.base);
    g.addColorStop(0, PAL.wall[hs.ci]);
    g.addColorStop(1, hs.z > 0.6 ? '#16233f' : '#1c2d50');
    x.fillStyle = g; x.fill();
    x.save(); polyPath(x, hs.wallPts); x.clip();
    for (let i = 0; i < 11; i++) {                             // 横排砖笔
      const yy = t + R() * hs.h;
      x.strokeStyle = R() < 0.45
        ? `rgba(10,18,40,${0.14 + R() * 0.18})`
        : `rgba(${126 + R() * 62 | 0},${152 + R() * 54 | 0},${198},${0.08 + R() * 0.14})`;
      x.lineWidth = 0.8 + R() * 1.8;
      x.beginPath(); x.moveTo(l - 2, yy); x.quadraticCurveTo(hs.x, yy + (R() - .5) * 2.6, r + 2, yy); x.stroke();
    }
    for (let i = 0; i < 5; i++) {                              // 竖笔：木纹与阴影
      const xx = l + R() * hs.w;
      x.strokeStyle = `rgba(8,15,36,${0.12 + R() * 0.16})`;
      x.lineWidth = 0.7 + R() * 1.3;
      x.beginPath(); x.moveTo(xx, t); x.lineTo(xx + (R() - .5) * 2, hs.base); x.stroke();
    }
    if (far > 0.45) {                                          // 远房罩一层空气
      x.fillStyle = `rgba(46,84,132,${far * 0.34})`;
      x.fillRect(l - 4, t - hs.roofH - 4, hs.w + 8, hs.base - t + hs.roofH + 8);
    }
    x.restore();
    /* 屋顶：先铺实色面，再顺坡向排瓦笔 */
    polyPath(x, hs.roofPts);
    const t2 = t - hs.roofH;
    const rg = x.createLinearGradient(l, t2, r, t);
    rg.addColorStop(0, PAL.roof[hs.ri]);
    rg.addColorStop(1, hs.ri % 2 ? '#2f2436' : '#182a44');
    x.fillStyle = rg; x.fill();
    x.save(); polyPath(x, hs.roofPts); x.clip();
    const rp = hs.roofPts;
    for (let i = 0; i < 14; i++) {
      const k = R() * (rp.length - 1), ki = Math.floor(k);
      const a = rp[ki], b = rp[Math.min(rp.length - 1, ki + 1)];
      const px = lerp(a.x, b.x, k - ki), py = lerp(a.y, b.y, k - ki);
      const ang = Math.atan2(hs.base - py, hs.x - px) + (R() - 0.5) * 0.5;
      daub(x, px + (R() - .5) * hs.w * 0.5, py + R() * hs.h * 0.4, ang,
        (4 + R() * 10) * S * (hs.w / (0.03 * W)), (1.2 + R() * 2.2) * S, (R() - .5) * 0.8,
        R() < 0.5 ? [182, 200, 226] : [12, 22, 44], 0.10 + R() * 0.20);
    }
    x.restore();
    /* 轮廓：用深色而不是白线，避免"贴纸描边" */
    polyPath(x, hs.wallPts);
    x.strokeStyle = `rgba(8,16,36,${0.34 + hs.z * 0.2})`; x.lineWidth = 1.0; x.stroke();
    polyPath(x, hs.roofPts);
    x.strokeStyle = `rgba(176,200,228,${0.10 + hs.z * 0.10})`; x.lineWidth = 0.8; x.stroke();
  }
  /* 烟囱：小体块，位置由 buildGeometry 决定（烟雾在动态层画） */
  for (const cm of chimneys) {
    x.fillStyle = 'rgba(6,12,30,.5)';
    x.fillRect(cm.x - cm.w / 2 + 1, cm.y - cm.h, cm.w, cm.h + 2);
    x.fillStyle = '#2a3a5c';
    x.fillRect(cm.x - cm.w / 2, cm.y - cm.h, cm.w, cm.h);
    x.fillStyle = 'rgba(196,214,236,.22)';
    x.fillRect(cm.x - cm.w / 2, cm.y - cm.h, cm.w * 0.34, cm.h);
  }
  /* 屋间灌木：原画里村庄被一团团蓝绿灌木包住，这一步把房子"种进"地景 */
  const bushes = Math.round(64 * clamp((W * H) / (1440 * 900), 0.4, 1.6));
  for (let i = 0; i < bushes; i++) {
    const u = 0.28 + R() * 0.66;
    const depth = R();
    const bx = u * W + (R() - 0.5) * W * 0.03;
    const by = lerp(0.815, 0.995, depth) * H;
    const br = (0.008 + R() * 0.018) * W * lerp(0.75, 1.3, depth);
    const teal = R() < 0.26;                              // 以蓝黑为主，蓝绿只是少量偏色
    x.fillStyle = teal ? `rgba(13,36,42,${0.24 + R() * 0.20})` : `rgba(11,25,52,${0.22 + R() * 0.20})`;
    x.beginPath(); x.ellipse(bx, by - br * 0.30, br, br * 0.78, 0, 0, 6.2832); x.fill();
    for (let k = 0; k < 16; k++) {                       // 团内的卷笔
      const a = R() * 6.2832, rr = br * (0.2 + R() * 0.85);
      daub(x, bx + Math.cos(a) * rr, by - br * 0.3 + Math.sin(a) * rr * 0.7,
        a * 0.4 - 0.6, (5 + R() * 12) * S, (1.4 + R() * 2.6) * S, 0.9 + R() * 1.2,
        teal ? (R() < 0.5 ? [18, 46, 50] : [32, 66, 66]) : (R() < 0.5 ? [20, 40, 78] : [52, 88, 132]),
        0.13 + R() * 0.22);
    }
  }
  /* 前景草垛 / 田埂笔触 */
  for (let i = 0; i < 900; i++) {
    const px = R() * W, py = H * (0.845 + Math.pow(R(), 1.4) * 0.17);
    const warm = R() < 0.16;
    x.strokeStyle = warm
      ? `rgba(${150 + R() * 60 | 0},${120 + R() * 50 | 0},${54 + R() * 40 | 0},${0.08 + R() * 0.14})`
      : `rgba(${26 + R() * 44 | 0},${50 + R() * 46 | 0},${84 + R() * 54 | 0},${0.10 + R() * 0.22})`;
    x.lineWidth = 0.9 + R() * 2.4;
    const ln = (8 + R() * 24) * S;
    const up = 4 + R() * 9;
    x.beginPath(); x.moveTo(px, py); x.quadraticCurveTo(px + ln * .5, py - up, px + ln, py - 1); x.stroke();
  }
  applyGrain(x, W, H, 0.11);
  return c;
}
/* ── 画布颗粒 + 织纹（油画纹理）：512 无缝图块 + pattern ── */
const TILE = 512;
function bakeGrain() {
  const c = document.createElement('canvas'); c.width = c.height = TILE;
  const x = c.getContext('2d');
  const R = rng(60606);
  const img = x.createImageData(TILE, TILE);
  const d = img.data;
  for (let i = 0; i < d.length; i += 4) {
    const v = 128 + (R() * 30 - 15);
    d[i] = d[i + 1] = d[i + 2] = v; d[i + 3] = 255;
  }
  x.putImageData(img, 0, 0);
  // 亚麻画布织纹（4px 周期，图块可无缝平铺）
  x.globalAlpha = 0.14; x.strokeStyle = 'rgba(128,128,128,1)'; x.lineWidth = 1;
  for (let gx = 0; gx < TILE; gx += 4) { x.beginPath(); x.moveTo(gx + 0.5, 0); x.lineTo(gx + 0.5, TILE); x.stroke(); }
  for (let gy = 0; gy < TILE; gy += 4) { x.beginPath(); x.moveTo(0, gy + 0.5); x.lineTo(TILE, gy + 0.5); x.stroke(); }
  x.globalAlpha = 1;
  return c;
}

/* ══════════════════════════════════════════════════════════
   5. 前景树（笔触一次性烘焙 + 每帧竖条错位）
   ══════════════════════════════════════════════════════════ */
/* 前景树：整棵树的笔触一次性烘到位图上，每帧只按竖条做几像素的错位。
   逐笔重绘要四千次 fill，帧预算撑不住；竖条错位既省，又读得出"风穿过树冠"。 */
function bakeTree() {
  const c = document.createElement('canvas');
  c.width = Math.round(W * DPR); c.height = Math.round(H * DPR);
  const x = c.getContext('2d'); x.scale(DPR, DPR);
  x.lineCap = 'round';
  const K = W / 1440;
  const hash = (a) => { const z = Math.sin(a * 127.1 + 311.7) * 43758.5453; return z - Math.floor(z); };
  const taperAt = (h) => Math.pow(1 - h, 0.42) * (0.80 + 0.34 * Math.sin(h * 6.2))
    * (1 + 0.30 * Math.exp(-Math.pow((h - 0.30) / 0.19, 2)));

  for (let ti = 0; ti < geometry.trees.length; ti++) {
    const tr = geometry.trees[ti];
    x.beginPath();
    const L = [], Rt = [];
    for (let k = 0; k <= 22; k++) {
      const h = k / 22;
      const tp = taperAt(h);
      const spine = tr.x + tr.lean * W * Math.pow(h, 1.7) + tr.curl * W * Math.sin(h * 3.4);
      const y = lerp(tr.base, tr.top, h);
      L.push({ x: spine - tr.half * tp, y });
      Rt.push({ x: spine + tr.half * tp * 0.94, y });
    }
    x.moveTo(L[0].x, L[0].y);
    for (const p of L) x.lineTo(p.x, p.y);
    for (let i = Rt.length - 1; i >= 0; i--) x.lineTo(Rt[i].x, Rt[i].y);
    x.closePath();
    /* 剪影位置与形状沿用上一轮，只把"纯黑"换成压暗的深蓝：树是重音但不是洞 */
    const g = x.createLinearGradient(tr.x - tr.half, tr.top, tr.x + tr.half * 0.6, tr.base);
    g.addColorStop(0, 'rgba(21,48,76,.90)');
    g.addColorStop(0.42, 'rgba(12,29,54,.93)');
    g.addColorStop(1, 'rgba(7,16,32,.96)');
    x.fillStyle = g; x.fill();
    x.save(); polyPath(x, L.concat(Rt.slice().reverse())); x.clip();
    const R2 = rng(313 + ti * 17);
    for (let i = 0; i < 420; i++) {
      const hh = R2(), rx = R2() - 0.5, ry = R2(), ag = R2(), ln = R2(), cc = R2(), aa = R2();
      const spine = tr.x + tr.lean * W * Math.pow(hh, 1.7) + tr.curl * W * Math.sin(hh * 3.4);
      const px = spine + rx * tr.half * 2.1 * taperAt(hh);
      const py = lerp(tr.base, tr.top, hh) + (ry - 0.5) * (tr.base - tr.top) * 0.05;
      const len = (12 + ln * 30) * K;
      /* 受光侧（画面右）挑亮蓝，背光侧挑深蓝黑 → 用明暗差读出体积，而不是靠描边 */
      const ci = rx > 0 ? 4 + Math.floor(cc * 4) : Math.floor(cc * 4);
      daub(x, px, py, -Math.PI / 2 + (ag - 0.5) * 0.95, len, len * (0.26 + cc * 0.30),
        (cc - 0.5) * 1.5, PAL.tree[Math.min(PAL.tree.length - 1, ci)], 0.20 + aa * 0.44);
    }
    /* 少量横斜的破笔：把纵向的节奏打断，树才不像一绺一绺的头发 */
    for (let i = 0; i < 130; i++) {
      const hh = R2(), rx = R2() - 0.5, ag = R2(), cc = R2(), aa = R2();
      const spine = tr.x + tr.lean * W * Math.pow(hh, 1.7) + tr.curl * W * Math.sin(hh * 3.4);
      const px = spine + rx * tr.half * 2.0 * taperAt(hh);
      const py = lerp(tr.base, tr.top, hh);
      const len = (10 + cc * 26) * K;
      daub(x, px, py, (ag < 0.5 ? -1 : 1) * (0.85 + R2() * 0.7), len, len * (0.22 + aa * 0.22),
        (aa - 0.5) * 1.3, PAL.tree[Math.min(PAL.tree.length - 1, Math.floor(cc * PAL.tree.length))],
        0.14 + aa * 0.26);
    }
    x.restore();
  }

  /* 笔束：沿剪影的纵向短笔，与星云同一套笔形（逗号与短条），不再是通长的叶片 */
  for (let si = 0; si < treeStrands.length; si++) {
    const s = treeStrands[si];
    const n = s.pts.length;
    for (let k = 1; k < n - 1; k++) {
      if (hash(si * 113 + k * 29) < 0.16) continue;              // 少量留白，笔不排满
      const a2 = s.pts[k + 1].x - s.pts[k].x, b2 = s.pts[k + 1].y - s.pts[k].y;
      const h0 = k / (n - 1);
      const ang = Math.atan2(b2, a2) + (hash(si * 13 + k * 7) - 0.5) * 0.60;
      const len = s.w * (1.4 + hash(si * 31 + k * 3) * 2.6);
      const wid = s.w * (0.30 + hash(si * 57 + k * 11) * 0.40) * (0.55 + 0.45 * Math.sin(Math.PI * h0));
      daub(x, s.pts[k].x, s.pts[k].y, ang, len, wid, (hash(si * 17 + k) - 0.5) * 1.8,
        PAL.tree[s.ci], s.al * (0.40 + hash(si * 91 + k * 5) * 0.46));
    }
  }

  /* 边缘的少量冷高光：把树从背景里"剥"出来，同时不产生描边发光感 */
  for (const tr of geometry.trees) {
    for (let k = 0; k < 20; k++) {
      const h = 0.06 + (k / 20) * 0.92;
      const spine = tr.x + tr.lean * W * Math.pow(h, 1.7) + tr.curl * W * Math.sin(h * 3.4 + 0.3);
      const y = lerp(tr.base, tr.top, h);
      const px = spine + tr.half * taperAt(h) * 0.96;
      const len = (10 + 16 * (1 - h)) * K;
      daub(x, px, y, -Math.PI / 2 + 0.18, len, len * 0.26, 0.7,
        [52, 104, 124], 0.10 + 0.16 * (1 - h));
    }
  }
  return c;
}
function drawTree(alpha) {
  if (alpha <= 0.004) return;
  if (!treeCv) treeCv = bakeTree();
  const t = clock, K = W / 1440, SL = 26, sw = W / SL;
  ctx.globalCompositeOperation = 'source-over';
  ctx.globalAlpha = alpha;
  for (let i = 0; i < SL; i++) {
    const f = i / (SL - 1);
    const dx = (Math.sin(t * 0.46 + i * 0.62) * 0.62 + Math.sin(t * 0.27 + i * 1.31) * 0.38)
      * 3.4 * K * (0.35 + 0.65 * Math.sin(Math.PI * f));
    const sx = Math.round(i * sw * DPR);
    ctx.drawImage(treeCv, sx, 0, Math.round(sw * DPR) + 2, treeCv.height,
      i * sw - dx, 0, sw + 2 / DPR, H);
  }
  ctx.globalAlpha = 1;
}
/* ══════════════════════════════════════════════════════════
   6. 光粒子 / 暖窗
   ══════════════════════════════════════════════════════════ */
/* ── 光点：少数几个"骑在星云上的光"，不是粒子雨 ───────────── */
function buildMotes() {
  const R = rng(1221);
  motes = [];
  for (let i = 0; i < 140; i++) {
    let x = 0, y = 0, tries = 0;
    do { x = R() * W; y = R() * H * 0.66; tries++; }
    while (tries < 7 && densityAt(x, y) < 0.80);            // 只落在主带与涡环附近
    motes.push({
      x, y,
      r: (0.8 + R() * 1.5) * (W / 1440),
      a: 0.09 + R() * 0.20,
      per: 5.5 + R() * 13.5, ph: R() * 6.28,
      sp: 0.30 + R() * 0.85
    });
  }
}
function drawMotes(alpha) {
  if (alpha <= 0.004) return;
  const t = clock, n = Math.min(motes.length, CONFIG.particleCount);
  const step = 0.016 * CONFIG.flowSpeed;
  ctx.globalCompositeOperation = 'lighter';
  for (let i = 0; i < n; i++) {
    const m = motes[i];
    const f = fieldAt(m.x, m.y);
    /* 只做流线推移：不整体上飘、不随机重生 ⇒ 光点是"沿星云缓慢移动"，
       且轨迹与笔触同向，循环回原处 */
    m.x += f[0] * m.sp * step * 0.55;
    m.y += f[1] * m.sp * step * 0.55;
    if (m.x > W + 14) m.x -= W + 28; else if (m.x < -14) m.x += W + 28;
    if (m.y > H * 0.74 || m.y < -14) m.y = H * 0.30;
    const puls = 0.55 + 0.45 * Math.sin(t / m.per * 6.2832 + m.ph);
    const rr = m.r * (2.2 + puls * 1.1);
    ctx.globalAlpha = alpha * m.a * puls;
    ctx.drawImage(coreSpr, m.x - rr, m.y - rr, rr * 2, rr * 2);
  }
  ctx.globalAlpha = 1;
  ctx.globalCompositeOperation = 'source-over';
}

/* ── 炊烟：几柱很慢的烟，只在较近人家的烟囱上 ─────────────── */
function drawSmoke(alpha) {
  if (alpha <= 0.004 || !chimneys.length) return;
  const t = clock, K = W / 1440;
  ctx.globalCompositeOperation = 'source-over';
  for (const c of chimneys) {
    const per = 13 + c.rate * 8;                            // 一柱烟的周期：很慢
    for (let k = 0; k < 3; k++) {
      const a = (t / per + k / 3 + c.ph) % 1;               // 0 出生 → 1 消散
      const rise = a * H * (0.085 + 0.045 * c.z);
      const sway = Math.sin(t * 0.17 + c.ph * 3 + k * 2.1) * (5 + a * 24) * K;
      const rr = (4.5 + a * 26) * K * (0.7 + c.z * 0.55);
      const al = Math.sin(Math.PI * a) * 0.20;
      if (al <= 0.006) continue;
      ctx.globalAlpha = alpha * al;
      ctx.drawImage(puffSpr, c.x - rr + sway, c.y - rise - rr * 0.9, rr * 2, rr * 2);
    }
  }
  ctx.globalAlpha = 1;
}

/* ── 暖窗：先落"颜料"，再叠很薄的一层空气柔光 ─────────────── */
function drawWindows(alpha) {
  if (alpha <= 0.004) return;
  const t = clock;
  ctx.globalCompositeOperation = 'source-over';
  for (const w of windows) {
    let a = w.base * (0.76 + 0.14 * Math.sin(t / w.p1 * 6.2832 + w.ph)
      + 0.10 * Math.sin(t / w.p2 * 6.2832 + w.ph * 2.3));
    if (w.dip) {                                            // 偶尔暗一下：不规律呼吸
      const k = (t / w.dip + w.ph) % 1;
      a *= lerp(1, 0.45, Math.max(0, 1 - Math.abs(k - 0.5) * 6));
    }
    a = clamp(a, 0, 1) * alpha;
    w._a = a;
    if (a <= 0.004) continue;
    /* 色温随 w.warm 变化：暖黄 ↔ 暖橙，一窗一色，不是一片同色贴片 */
    const g2 = Math.round(lerp(178, 228, w.warm)), b2 = Math.round(lerp(92, 152, w.warm));
    ctx.globalAlpha = a * 0.92;
    ctx.fillStyle = `rgb(255,${g2},${b2})`;
    if (w.round) { ctx.beginPath(); ctx.arc(w.x, w.y, w.w, 0, 6.2832); ctx.fill(); }
    else ctx.fillRect(w.x - w.w / 2, w.y - w.h / 2, w.w, w.h);
  }
  ctx.globalCompositeOperation = 'lighter';
  for (const w of windows) {
    const a = w._a;
    if (!a || a <= 0.004) continue;
    const g = Math.max(5, w.w * 2.4);
    ctx.globalAlpha = a * 0.26 * w.warm;
    ctx.drawImage(glowSpr, w.x - g, w.y - g, g * 2, g * 2);
  }
  ctx.globalAlpha = 1;
  ctx.globalCompositeOperation = 'source-over';
}

/* ══════════════════════════════════════════════════════════
   7. 苏醒：笔触显影（不画线框，也不做图层交叉淡入）
   —— 每帧只把「一套完整场景」画进离屏画布，再用不断累积的笔触
      遮罩裁出已经画上画布的部分。遮罩只增不减 ⇒ 结构上不可能出现
      重影；转场一结束遮罩通道整个弃用，稳态直接画同一套场景，
      两边像素一致，所以交接处不会"跳"。
   ══════════════════════════════════════════════════════════ */
let groundCv = null;                       // 上了深蓝底料的画布
let treeCv = null;                         // 前景树：笔触一次性烘焙
const WHITE = [255, 255, 255];
const M = { dabs: [], i: 0, t: -1 };       // 落笔计划 + 游标

/** 底料画布：苏醒阶段 1 只有它——横刮开的深蓝底料 + 亚麻织纹 */
function bakeGround() {
  const c = document.createElement('canvas');
  c.width = cv.width; c.height = cv.height;
  const x = c.getContext('2d');
  x.setTransform(DPR, 0, 0, DPR, 0, 0);
  const g = x.createLinearGradient(0, 0, 0, H);
  g.addColorStop(0, '#050f26'); g.addColorStop(0.48, '#0a1c3e'); g.addColorStop(1, '#0e2749');
  x.fillStyle = g; x.fillRect(0, 0, W, H);
  const R = rng(555);
  for (let i = 0; i < 260; i++) {
    daub(x, R() * W, R() * H, (R() - 0.5) * 0.07, W * (0.16 + R() * 0.46),
      9 + R() * 24, (R() - 0.5) * 0.5, R() < 0.5 ? [5, 14, 34] : [17, 36, 70],
      0.05 + R() * 0.10);
  }
  if (grainTile) {
    x.globalCompositeOperation = 'soft-light';
    x.globalAlpha = 0.9; x.fillStyle = x.createPattern(grainTile, 'repeat');
    x.fillRect(0, 0, W, H);
    x.globalAlpha = 1; x.globalCompositeOperation = 'source-over';
  }
  return c;
}

/** 落笔计划：每支笔一个绝对时刻并排序。
 *  帧率只决定"每帧落几支"，不决定画面构成 ⇒ 快慢机看到的画是一样的。 */
function buildMask() {
  const R = rng(6161), K = W / 1440, dabs = [];
  const add = (x, y, ang, len, wid, curve, at, a) =>
    dabs.push({ x, y, ang, len, wid, curve, at: clamp(at, 0, P6), a: a === undefined ? 1 : a });
  const vx = vortices[0].cx, vy = vortices[0].cy;
  const out = (px, py) => clamp(Math.hypot(px - vx, (py - vy) / 0.8) / (W * 0.60), 0, 1);

  /* ── 阶段 2（P2→P3）：山脉 → 村庄 → 前景树 ─────────────── */
  const slopeAt = (u) => (ridgeA(clamp(u + 0.01, 0, 1)) - ridgeA(clamp(u - 0.01, 0, 1))) * H / (0.02 * W);

  /* ── 铺底 block-in：先用成片半透的宽笔把"哪里有什么"占住 ──────
     油画是先薄薄铺一大片暗色定形体，再往上摞笔。少了这一步，
     苏醒期只剩散落的亮笔，读不出山势、云团和树的体块——就是"撒纸片"。
     遮罩里这些大笔只给 0.55 的不透明度：叠几笔才够实，单笔边缘是虚的，
     才不会在画面上留下硬边的"撕纸形"。 */
  const SOFT = 0.55;
  for (let i = 0; i < 340; i++) {                       // 天空：由大旋涡向外铺
    const px = R() * W, py = R() * H * 0.74;
    add(px, py, (R() - 0.5) * 0.7, W * (0.06 + R() * 0.11), H * (0.030 + R() * 0.045),
      (R() - 0.5) * 0.5,
      P2 + T.land * clamp(0.02 + 0.34 * Math.pow(out(px, py), 0.8) + 0.14 * R(), 0, 1), SOFT);
  }
  for (let i = 0; i < 300; i++) {                       // 山体与近地：顺山势的宽笔
    const u = R(), top = ridgeA(u) * H;
    const py = lerp(top - H * 0.03, H * 1.02, Math.pow(R(), 0.7));
    add(u * W, py, Math.atan(slopeAt(u)) * 0.6 + (R() - 0.5) * 0.34,
      W * (0.035 + R() * 0.075), H * (0.024 + R() * 0.050), (R() - 0.5) * 0.5,
      P2 + T.land * clamp(0.02 + 0.40 * (0.55 * u + 0.45 * R()), 0, 1), SOFT);
  }
  for (let i = 0; i < 64; i++) {                        // 前景树：自下往上的体块
    const s = treeStrands[Math.floor(R() * treeStrands.length)];
    const f = Math.pow(R(), 0.65);
    const p = s.pts[Math.min(s.pts.length - 1, Math.floor(f * (s.pts.length - 1)))];
    add(p.x, p.y, (R() - 0.5) * 0.9, W * (0.018 + R() * 0.034), H * (0.020 + R() * 0.038),
      (R() - 0.5) * 0.7, P2 + T.land * clamp(0.46 + 0.40 * (1 - f) + 0.08 * R(), 0, 1), SOFT);
  }

  for (let i = 0; i < 1040; i++) {                        // 山体：顺山势的长短笔
    const u = R(), top = ridgeA(u) * H;
    const py = lerp(top - 8, H * 1.03, Math.pow(R(), 0.72));
    const k = clamp(0.03 + 0.34 * (0.45 * u + 0.55 * R())
      + 0.20 * clamp((py - top) / Math.max(1, H - top), 0, 1) + 0.05 * R(), 0, 1);
    const len = (15 + R() * 38) * K;
    add(u * W, py, Math.atan(slopeAt(u)) + (R() - 0.5) * 0.36,
      len, len * (0.26 + R() * 0.28), (R() - 0.5) * 1.0, P2 + T.land * k);
  }
  for (let i = 0; i < 520; i++) {                        // 村庄与近地：短横笔排屋舍
    const u = 0.18 + R() * 0.82, py = lerp(0.775, 1.0, Math.pow(R(), 0.6)) * H;
    const k = clamp(0.30 + 0.34 * (0.5 * u + 0.5 * R()) + 0.06 * R(), 0, 1);
    const len = (8 + R() * 22) * K;
    add(u * W, py, (R() - 0.5) * 0.24, len, len * (0.30 + R() * 0.34),
      (R() - 0.5) * 0.6, P2 + T.land * k);
  }
  // 前景树：沿已有的剪影笔束自下往上铺，保证形状与位置与原画一致
  for (let i = 0; i < 900; i++) {
    const s = treeStrands[Math.floor(R() * treeStrands.length)];
    const k = Math.floor(R() * (s.pts.length - 1)), f = R();
    const p0 = s.pts[k], p1 = s.pts[k + 1];
    const px = lerp(p0.x, p1.x, f), py = lerp(p0.y, p1.y, f);
    const ang = Math.atan2(p1.y - p0.y, p1.x - p0.x);
    const nx = -Math.sin(ang), ny = Math.cos(ang), off = (R() - 0.5) * 26 * K;
    const h = clamp((s.tree === 0 ? (1.06 * H - py) / (1.06 * H - 0.055 * H) : 1 - f), 0, 1);
    const k2 = clamp(0.56 + 0.40 * h + 0.06 * R(), 0, 1);
    const len = (12 + R() * 24) * K;
    add(px + nx * off, py + ny * off, ang + (R() - 0.5) * 0.30,
      len, len * (0.34 + R() * 0.34), (R() - 0.5) * 1.1, P2 + T.land * k2);
  }

  /* ── 阶段 3（P3→P4）：星云——顺旋涡方向，由大旋涡向外铺开 ── */
  for (const s of strokes) {                              // 1) 沿流线的笔触
    const r = s.p; if (!r) continue;
    const m = r.m, step = Math.max(1, Math.round(m / 3));
    for (let k = 0; k < m; k += step) {
      const px = r.d[k * 4], py = r.d[k * 4 + 1];
      const ang = Math.atan2(-r.d[k * 4 + 2], r.d[k * 4 + 3]);
      const len = (24 + R() * 34) * K;
      add(px, py, ang + (R() - 0.5) * 0.48, len, len * (0.30 + R() * 0.26),
        (R() - 0.5) * 1.2, P3 + T.nebula * clamp(0.03 + 0.68 * Math.pow(out(px, py), 0.85) + 0.24 * R(), 0, 1));
    }
  }
  for (let i = 0; i < 1700; i++) {                        // 2) 补笔：顺流与横切混合
    const px = R() * W, py = R() * H * 0.70;
    if (py > ridgeA(px / W) * H - 8) continue;             // 地平线以下交给阶段 2
    if (densityAt(px, py) < 0.50 && R() < 0.55) continue;  // 稀疏区少补
    const f = fieldAt(px, py);
    const ang = Math.atan2(f[1], f[0]) + (R() < 0.22 ? Math.PI / 2 : 0) + (R() - 0.5) * 1.05;
    const len = (20 + R() * 44) * K;
    add(px, py, ang, len, len * (0.28 + R() * 0.28), (R() - 0.5) * 1.3,
      P3 + T.nebula * clamp(0.08 + 0.72 * out(px, py) + 0.26 * R(), 0, 1));
  }

  /* ── 阶段 4（P4→P5）：灯光依次点亮，笔触继续收边 ────────── */
  for (let i = 0; i < 760; i++) {
    const px = R() * W, py = R() * H * 0.99;
    if (densityAt(px, py) < 0.45 && R() < 0.5) continue;
    const f = fieldAt(px, py);
    const len = (16 + R() * 40) * K;
    add(px, py, Math.atan2(f[1], f[0]) + (R() - 0.5) * 1.4,
      len, len * (0.30 + R() * 0.34), (R() - 0.5) * 1.2,
      P4 + T.light * clamp(0.02 + 0.92 * R(), 0, 1));
  }

  /* ── 阶段 5（P5→P6）：收拢——最后几支大笔把空隙铺满 ─────── */
  for (let i = 0; i < 22; i++) {
    const k = i / 22;
    add(W * 0.5, lerp(-H * 0.04, H * 1.04, k), (R() - 0.5) * 0.04,
      W * 1.5, H * 0.12, (R() - 0.5) * 0.4, P5 + T.fuse * clamp(0.06 + 0.72 * k, 0, 1));
  }
  for (let j = 0; j < 3; j++) {                            // 收尾：整幅扫三笔
    add(W * 0.5, H * (0.18 + j * 0.32), 0, W * 2.7, H * 0.64, 0, P5 + T.fuse * (0.80 + 0.06 * j));
  }

  dabs.sort((a, b) => a.at - b.at);
  M.dabs = dabs; M.i = 0; M.t = -1;
  maskCtx.setTransform(1, 0, 0, 1, 0, 0);
  maskCtx.clearRect(0, 0, maskCv.width, maskCv.height);
  maskCtx.setTransform(DPR, 0, 0, DPR, 0, 0);
}

/** 把时刻 t 之前该落的笔落到遮罩上（只增不减） */
function paintMaskUpTo(t) {
  let gap = M.t < 0 ? t : t - M.t;
  if (gap < 0) {                                          // 重播 / 时间回退：遮罩归零
    maskCtx.setTransform(1, 0, 0, 1, 0, 0);
    maskCtx.clearRect(0, 0, maskCv.width, maskCv.height);
    maskCtx.setTransform(DPR, 0, 0, DPR, 0, 0);
    M.i = 0; gap = t;
  }
  M.t = t;
  maskCtx.globalCompositeOperation = 'source-over';
  maskCtx.globalAlpha = 1;
  const d = M.dabs;
  /* 额度按"跳过的时间"给：正常每帧用不完，seek / 后台回前台能一次补满 ⇒ 画面与帧率无关 */
  const lim = Math.min(d.length, M.i + Math.max(1400, Math.ceil(gap * 520)));
  while (M.i < lim && d[M.i].at <= t) {
    const b = d[M.i++];
    daub(maskCtx, b.x, b.y, b.ang, b.len, b.wid, b.curve, WHITE, b.a);
  }
}

/* ══════════════════════════════════════════════════════════
   8. 苏醒时间轴 → 各层权重（全部单调，P6 处恰好等于稳态值）
   ══════════════════════════════════════════════════════════ */
function weights(t) {
  const w = {
    ground: 1, sky: 1, neb: 1, hill: 1, vill: 1, tree: 1,
    star: 1, moon: 1, win: 1, smoke: 1, mote: 1,
    flow: 1, breathe: 1, grain: 1, reveal: 1, transition: false
  };
  if (CONFIG.reducedMotion || t >= P6) return w;
  w.transition = true;
  const L1 = clamp(t / T.canvas, 0, 1);
  const L2 = clamp((t - P2) / T.land, 0, 1);
  const L3 = clamp((t - P3) / T.nebula, 0, 1);
  const L4 = clamp((t - P4) / T.light, 0, 1);
  const L5 = clamp((t - P5) / T.fuse, 0, 1);
  /* 一 深蓝画布逐渐出现 */
  w.ground = easeOut(L1);
  /* 灯光：月 → 星 → 暖窗 → 炊烟 → 光点，依次点亮（不是一次亮起） */
  w.moon = seg(L4, 0.00, 0.32);
  w.star = seg(L4, 0.08, 0.52);
  w.win = seg(L4, 0.38, 0.82);
  w.smoke = seg(L4, 0.52, 1.00);
  w.mote = seg(L4, 0.60, 1.00) * (0.55 + 0.45 * L5);
  /* 运动强度逐级升起：刚落下的颜料还是湿的，最后才进入持续动态 */
  w.flow = clamp(0.03 + 0.20 * L2 + 0.25 * L3 + 0.30 * L4 + 0.22 * easeInOut(L5), 0, 1);
  w.breathe = clamp(0.10 * L3 + 0.40 * L4 + 0.50 * L5, 0, 1);
  /* 织纹先明显后被颜料盖住 */
  w.grain = lerp(0.62, 1, 0.5 * L2 + 0.5 * L3);
  /* 湿颜料：刚铺上的笔只是透着一层底料薄色，随阶段逐级"干透"到最终明度。
     没有这一层，稀疏期就是一把撒在深蓝纸上的亮色纸片，而不是一张正在画的画。
     单调升到 P5 处恰好为 1，P6 交接不跳变。 */
  w.reveal = clamp(0.40 + 0.26 * L2 + 0.20 * L3 + 0.14 * easeInOut(L4), 0, 1);
  return w;
}

/* ══════════════════════════════════════════════════════════
   9. 合成：一套场景，两种通道（显影期 / 稳态）
   ══════════════════════════════════════════════════════════ */
function drawScene(w) {
  ctx.setTransform(DPR, 0, 0, DPR, 0, 0);
  ctx.globalAlpha = 1; ctx.globalCompositeOperation = 'source-over';
  // L1 夜空底色
  ctx.fillStyle = PAL.nightTop; ctx.fillRect(0, 0, W, H);
  if (w.sky > 0.004) { ctx.globalAlpha = w.sky; ctx.drawImage(sky, 0, 0, W, H); }
  ctx.globalAlpha = 1;
  // L2 动态星云笔触
  drawNebula(w.neb, w.flow * CONFIG.flowSpeed);
  // L3 星与月
  drawStars(w.star, w.moon, w.breathe);
  // L4 山脉
  if (w.hill > 0.004) { ctx.globalAlpha = w.hill; ctx.drawImage(hill, 0, 0, W, H); ctx.globalAlpha = 1; }
  // L5 村庄体块 + 炊烟 + 暖窗
  if (w.vill > 0.004) { ctx.globalAlpha = w.vill; ctx.drawImage(village, 0, 0, W, H); ctx.globalAlpha = 1; }
  drawSmoke(w.smoke);
  drawWindows(w.win);
  // L6 前景树（只负责构图与纵深）
  drawTree(w.tree);
  // L7 骑在星云上的少量光点
  drawMotes(w.mote);
  ctx.globalAlpha = 1; ctx.globalCompositeOperation = 'source-over';
}
/** 两条通道共用的最后一道：布纹软光 + 暗角 */
function drawFinish(w) {
  if (CONFIG.grainAlpha > 0.005) {
    ctx.globalCompositeOperation = 'soft-light';
    ctx.globalAlpha = CONFIG.grainAlpha * w.grain;
    ctx.fillStyle = grainPat;
    ctx.fillRect(0, 0, W, H);
    ctx.globalAlpha = 1; ctx.globalCompositeOperation = 'source-over';
  }
  ctx.fillStyle = vign; ctx.fillRect(0, 0, W, H);
}

function render() {
  const w = weights(clock);
  if (!w.transition) { drawScene(w); drawFinish(w); return w; }

  /* 显影期：完整场景 → tmp，再按遮罩裁出"已经画上的部分" */
  paintMaskUpTo(clock);
  const old = ctx;
  ctx = tmpCtx; drawScene(w);
  tmpCtx.globalCompositeOperation = 'destination-in';
  tmpCtx.globalAlpha = 1;
  /* 遮罩虚一笔：直接拿硬边笔形去裁画面，每一块都像撕下来的纸片。
     裁之前把遮罩羽化几个像素，笔与笔之间才化得开——读作"刚撂上去的湿颜料"，
     而不是贴在画上的剪贴块。只在显影期付这一次 blur 的代价。 */
  tmpCtx.filter = `blur(${Math.max(2, Math.round(4 * DPR))}px)`;
  tmpCtx.drawImage(maskCv, 0, 0, W, H);
  tmpCtx.filter = 'none';
  tmpCtx.globalCompositeOperation = 'source-over';
  ctx = old;

  ctx.setTransform(DPR, 0, 0, DPR, 0, 0);
  ctx.globalAlpha = 1; ctx.globalCompositeOperation = 'source-over';
  ctx.fillStyle = PAL.veil; ctx.fillRect(0, 0, W, H);
  ctx.globalAlpha = w.ground;                       // 阶段 1：底料画布浮现
  ctx.drawImage(groundCv, 0, 0, W, H);
  ctx.globalAlpha = w.reveal;                       // 阶段 2~5：颜料逐笔压上去（湿→干）
  ctx.drawImage(tmpCv, 0, 0, W, H);
  drawFinish(w);
  return w;
}

/* ══════════════════════════════════════════════════════════
   10. 生命周期
   ══════════════════════════════════════════════════════════ */
function rebuild(full) {
  layout();
  if (!grainTile) grainTile = bakeGrain();
  buildStars();
  buildVortices();
  if (full) { buildStrokes(); buildMotes(); }
  buildGeometry();
  sky = bakeSky(); hill = bakeHills(); village = bakeVillage();
  grainPat = ctx.createPattern(grainTile, 'repeat');
  buildSprites();
  treeCv = bakeTree();
  groundCv = bakeGround();
  buildMask();
  vign = (() => {
    const g = ctx.createRadialGradient(W * 0.5, H * 0.46, Math.min(W, H) * 0.30, W * 0.5, H * 0.5, Math.max(W, H) * 0.78);
    g.addColorStop(0, 'rgba(0,0,0,0)'); g.addColorStop(0.62, 'rgba(3,6,20,.16)'); g.addColorStop(1, 'rgba(2,4,14,.55)');
    return g;
  })();
}

function frame(now) {
  if (!running) return;
  raf = requestAnimationFrame(frame);
  if (!last) last = now;
  let dt = (now - last) / 1000; last = now;
  if (dt > 0.05) dt = 0.05;                       // 切后台回来不跳帧
  clock += dt * CONFIG.awakeningSpeed;
  render();
  if (dt > 0) { fpsAcc += 1 / dt; fpsN++; }
  if (fpsN >= 30) { fpsShown = Math.round(fpsAcc / fpsN); fpsAcc = 0; fpsN = 0; fpsEl.textContent = fpsShown + ' FPS'; }
}
function start() { if (running) return; running = true; last = 0; raf = requestAnimationFrame(frame); }
function stop() { running = false; cancelAnimationFrame(raf); }

const fpsEl = document.getElementById('fps');

function boot() {
  rebuild(true);
  if (CONFIG.reducedMotion) { clock = P6 + 1; render(); return; }
  clock = 0; start();
}

let rsTimer = 0;
window.addEventListener('resize', () => {
  clearTimeout(rsTimer);
  rsTimer = setTimeout(() => { const c = clock; rebuild(true); clock = c; if (CONFIG.reducedMotion) render(); }, 180);
});
document.addEventListener('visibilitychange', () => {
  if (document.hidden) stop();
  else if (!CONFIG.reducedMotion) start();
});

/* ── 交互 ───────────────────────────────────────────────── */
const panel = document.getElementById('panel');
const kFlow = document.getElementById('k-flow'), kDens = document.getElementById('k-dens');
const kMote = document.getElementById('k-mote'), kTime = document.getElementById('k-time');
const vFlow = document.getElementById('v-flow'), vDens = document.getElementById('v-dens');
const vMote = document.getElementById('v-mote'), vTime = document.getElementById('v-time');

function syncPanel() {
  vFlow.textContent = CONFIG.flowSpeed.toFixed(2) + '×';
  vDens.textContent = CONFIG.strokeDensity.toFixed(2) + '×';
  vMote.textContent = String(CONFIG.particleCount);
  vTime.textContent = CONFIG.awakeningSpeed.toFixed(2) + '×';
}
kFlow.addEventListener('input', () => { CONFIG.flowSpeed = +kFlow.value; syncPanel(); });
kMote.addEventListener('input', () => { CONFIG.particleCount = +kMote.value; syncPanel(); });
kTime.addEventListener('input', () => { CONFIG.awakeningSpeed = +kTime.value; syncPanel(); });
kDens.addEventListener('input', () => {
  CONFIG.strokeDensity = +kDens.value; syncPanel();
  clearTimeout(rsTimer); rsTimer = setTimeout(() => { buildStrokes(); buildMask(); }, 220);
});
document.getElementById('btn-tune').addEventListener('click', () => panel.classList.toggle('on'));
document.getElementById('btn-replay').addEventListener('click', () => { clock = 0; if (CONFIG.reducedMotion) { CONFIG.reducedMotion = false; start(); } });

/* ── 开发层开关：正式展示只有画面，调试面板 / 帧率读数按需打开 ── */
CONFIG.dev = /[?&]dev=1/.test(location.search);
document.body.classList.toggle('dev', CONFIG.dev);

window.addEventListener('keydown', (e) => {
  const k = e.key.toLowerCase();
  if (k === 'r') { clock = 0; if (CONFIG.reducedMotion) { CONFIG.reducedMotion = false; start(); } }
  if (!CONFIG.dev) return;                    // 非开发模式下这些快捷键不接管界面
  if (k === 'c') panel.classList.toggle('on');
  if (k === 'f') fpsEl.classList.toggle('on');
});

/* prefers-reduced-motion：直接给完整静态成品画面 */
const mq = window.matchMedia('(prefers-reduced-motion: reduce)');
CONFIG.reducedMotion = mq.matches;
if (mq.addEventListener) mq.addEventListener('change', (e) => { CONFIG.reducedMotion = e.matches; if (e.matches) { stop(); clock = P6 + 1; render(); } else { clock = 0; start(); } });

/* 调试出口（供自动化截图 / 帧率检查使用） */
window.__sn = {
  CONFIG,
  get stats() {
    return {
      fps: fpsShown, strokes: strokes.length, motes: Math.min(motes.length, CONFIG.particleCount),
      dabs: M.dabs.length, laid: M.i, windows: windows.length, chimneys: chimneys.length,
      dpr: +DPR.toFixed(2), t: +clock.toFixed(2), W: Math.round(W), H: Math.round(H)
    };
  },
  seek(t) { clock = t; if (!running) render(); },
  freeze(t) { stop(); clock = t; render(); return t; },
  unfreeze() { if (!CONFIG.reducedMotion) start(); },
  shotPhase(name) {
    const map = {
      canvas: P2 * 0.55, land: P2 + T.land * 0.55, sweep: P3 + T.nebula * 0.42,
      nebula: P3 + T.nebula * 0.82, light: P4 + T.light * 0.62, fuse: P5 + T.fuse * 0.55,
      live: P6 + 4, static: P6 + 4
    };
    const t = map[name]; this.seek(t); return t;
  }
};

syncPanel();
boot();
</script>
</body>
</html>
