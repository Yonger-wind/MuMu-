<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>星月夜 · 会呼吸的画（2D 固定镜头）</title>
<meta name="description" content="纯 2D 分层插画 + 动态油画笔触的《星月夜》实时艺术场景，固定镜头，含五段画面苏醒过程。零依赖单文件。" />
<style>
  :root { color-scheme: dark; }
  * { box-sizing: border-box; }
  html, body { height: 100%; margin: 0; }
  body {
    background: #04081c;
    color: #cfd9ea;
    font-family: "Songti SC", "Source Han Serif SC", "Noto Serif CJK SC", Georgia, serif;
    overflow: hidden;
  }
  /* 舞台：固定镜头，任何 transform / scale 都不允许出现在这里 */
  #stage { position: fixed; inset: 0; }
  #paint { display: block; width: 100%; height: 100%; }

  /* ── 极简 UI：不参与画面，不做 HUD ───────────────── */
  .sig {
    position: fixed; left: 22px; bottom: 20px; z-index: 5;
    font-size: 12px; letter-spacing: .34em; line-height: 1.9;
    color: rgba(206, 219, 236, .40);
    user-select: none; pointer-events: none;
    transition: opacity .8s ease;
  }
  .sig b { display: block; font-size: 15px; font-weight: 400; letter-spacing: .5em; color: rgba(224, 232, 245, .62); }

  .acts { position: fixed; right: 20px; bottom: 20px; z-index: 6; display: flex; gap: 10px; }
  .acts button {
    appearance: none; border: 1px solid rgba(178, 198, 228, .22);
    background: rgba(9, 16, 40, .42); color: rgba(214, 226, 242, .74);
    font: inherit; font-size: 12px; letter-spacing: .2em;
    padding: 7px 14px; border-radius: 2px; cursor: pointer;
    transition: border-color .25s, color .25s, background .25s;
  }
  .acts button:hover { border-color: rgba(226, 208, 138, .55); color: #f0e6c8; background: rgba(16, 26, 58, .6); }

  /* 调参面板：默认收起，按 C 或点「调参」展开 */
  #panel {
    position: fixed; right: 20px; top: 20px; z-index: 7; width: 232px;
    padding: 14px 16px 12px; border-radius: 3px;
    border: 1px solid rgba(178, 198, 228, .16);
    background: rgba(6, 12, 32, .68); backdrop-filter: blur(6px);
    font-size: 12px; letter-spacing: .06em;
    opacity: 0; transform: translateY(-6px); pointer-events: none;
    transition: opacity .3s ease, transform .3s ease;
  }
  #panel.on { opacity: 1; transform: none; pointer-events: auto; }
  #panel h4 { margin: 0 0 10px; font-size: 12px; font-weight: 400; letter-spacing: .28em; color: rgba(226, 214, 176, .78); }
  #panel label { display: block; margin: 0 0 9px; }
  #panel .row { display: flex; justify-content: space-between; color: rgba(200, 213, 232, .68); margin-bottom: 3px; }
  #panel .row i { font-style: normal; color: rgba(226, 214, 176, .85); font-variant-numeric: tabular-nums; }
  #panel input[type=range] { width: 100%; height: 3px; appearance: none; background: rgba(150, 175, 210, .28); border-radius: 2px; }
  #panel input[type=range]::-webkit-slider-thumb {
    appearance: none; width: 11px; height: 11px; border-radius: 50%;
    background: #e6d18b; cursor: pointer;
  }
  #panel .tip { margin-top: 8px; color: rgba(178, 194, 216, .44); line-height: 1.7; }

  #fps { position: fixed; left: 22px; top: 20px; z-index: 6; font-size: 11px; letter-spacing: .18em;
         color: rgba(190, 206, 228, .34); font-variant-numeric: tabular-nums; opacity: 0; transition: opacity .3s; }
  #fps.on { opacity: 1; }

  @media (max-width: 640px) {
    .sig { left: 14px; bottom: 58px; font-size: 10px; }
    .sig b { font-size: 13px; }
    .acts { right: 14px; bottom: 16px; }
    #panel { right: 12px; top: 12px; width: 208px; }
  }

  /* ── 正式展示只保留画面 ────────────────────────────────
     签名、按钮、调参面板、帧率读数全部属于开发层；
     只有 URL 带 ?dev=1（或按 C / F）时才出现，不影响艺术画面。 */
  body:not(.dev) .sig,
  body:not(.dev) .acts,
  body:not(.dev) #panel,
  body:not(.dev) #fps { display: none !important; }
</style>
</head>
<body>
<div id="stage"><canvas id="paint"></canvas></div>

<div class="sig"><b>星月夜</b>THE WORLD AWAKENS · 2D FIXED CAMERA</div>
<div id="fps"></div>
<div class="acts">
  <button id="btn-tune" type="button">调参</button>
  <button id="btn-replay" type="button">重播苏醒</button>
</div>

<div id="panel">
  <h4>动画调参</h4>
  <label>
    <div class="row"><span>星云流速</span><i id="v-flow">1.00×</i></div>
    <input id="k-flow" type="range" min="0" max="2.5" step="0.05" value="1" />
  </label>
  <label>
    <div class="row"><span>笔触密度</span><i id="v-dens">1.00×</i></div>
    <input id="k-dens" type="range" min="0.35" max="2.2" step="0.05" value="1" />
  </label>
  <label>
    <div class="row"><span>光粒子数量</span><i id="v-mote">90</i></div>
    <input id="k-mote" type="range" min="0" max="260" step="5" value="90" />
  </label>
  <label>
    <div class="row"><span>苏醒节奏</span><i id="v-time">1.00×</i></div>
    <input id="k-time" type="range" min="0.5" max="2" step="0.05" value="1" />
  </label>
  <div class="tip">密度改动会重建笔触流线；流速与粒子即时生效。快捷键 C 面板 · F 帧率 · R 重播。</div>
</div>

<script>
'use strict';
/* ==========================================================================
   星月夜 · 会呼吸的画
   纯 2D 固定镜头动态艺术场景（零依赖 / 单文件 / Canvas 2D + rAF）

   分层（严格按 Layer1→Layer6 顺序合成，全程无镜头位移）：
     L1 夜空背景      —— 烘焙：渐变 + 手绘纹理
     L2 动态星云      —— 沿「旋涡闭合流线 / S 形带状流线」 advect 的油画笔触
     L3 星与月        —— 径向渐变柔光呼吸 + 月相微亮变化
     L4 远景山脉      —— 烘焙：手绘轮廓 + 顺山势的排线
     L5 村庄          —— 烘焙：房舍体块 + 动态暖窗不规则明暗
     L6 前景树        —— 逐帧局部形变的深色柏树火焰笔触
     ＋ 光粒子 / 画布颗粒 / 暗角 / 五段苏醒

   可调参数集中在 CONFIG 与右上角「调参」面板。
   ========================================================================== */

/* ── 可调参数 ───────────────────────────────────────────────── */
const CONFIG = {
  flowSpeed: 1.00,        // 星云笔触整体流速倍率
  strokeDensity: 1.00,    // 笔触密度倍率（改动需重建）
  particleCount: 40,      // 光点数量（刻意保持很少：它们是"骑在星云上的光"，不是粒子雨）
  awakeningSpeed: 1.00,   // 苏醒节奏倍率
  dprCap: 2,              // 设备像素比上限
  baseSpeed: 0.016,       // 基础流速 = baseSpeed × 舞台宽（px/s）——比上一轮更慢更克制
  strokeBase: 760,        // 动态星云笔触数（画面质感靠烘焙厚涂，不靠动态笔触堆量）
  impastoBase: 5200,      // 烘焙厚涂碎笔基数（油画质感的主来源）
  glowFraction: 0.12,     // 动态笔触中「发光」的比例，其余全部是实色颜料
  moteMaxLife: 26,
  grainAlpha: 0.05,
  reducedMotion: false,
  dev: false
};

/* 苏醒时间轴（秒）：五段绘画显现
   P1 深蓝画布浮现 → P2 山脉与树木以笔触显形 → P3 星云由多方向蓝笔构建
   → P4 月、星、村灯依次点亮 → P5 融成完整油画并进入持续动态 */
const T = { canvas: 3.0, land: 6.2, nebula: 7.6, light: 4.6, fuse: 2.6 };
const P2 = T.canvas, P3 = P2 + T.land, P4 = P3 + T.nebula, P5 = P4 + T.light, P6 = P5 + T.fuse;

/* ── 调色板（深蓝 / 群青 / 湖蓝 / 金黄）─────────────────────
   索引 0→11 明度递增。画面以 1~6 为主体，7~8 只做少量高光，
   10~11 暖黄严格限量（只出现在星光附近与窗灯）。 */
const PAL = {
  nightTop: '#081838', nightMid: '#0f2a5c', nightLow: '#17417f', horizon: '#27609f',
  veil: '#03061a',
  stroke: [
    [10, 24, 62], [17, 38, 92], [26, 56, 130], [36, 76, 166],
    [52, 104, 196], [78, 138, 214], [116, 176, 228], [160, 205, 238],
    [205, 226, 244], [150, 176, 168], [232, 206, 128], [248, 232, 176]
  ],
  /* 烘焙厚涂取色权重：中段（群青—湖蓝）占大头，暗部与高光都留足量 */
  strokeW: [0.10, 0.15, 0.16, 0.15, 0.13, 0.11, 0.08, 0.05, 0.02, 0.03, 0.015, 0.005],
  /* 动态笔触取色：深蓝—群青是主体，湖蓝只做局部提亮，浅蓝压到最低。
     上一版把 5~7 号当默认色，天空读成一片碎瓷；现在亮色只归涡体与主带。 */
  flowW: [0.03, 0.10, 0.19, 0.21, 0.18, 0.13, 0.08, 0.04, 0.012, 0.018, 0.016, 0.004],
  hill: ['#2a5183', '#1f3f6e', '#16305c', '#0f2348'],
  hillRim: ['rgba(176,212,240,.42)', 'rgba(140,186,226,.34)', 'rgba(104,152,200,.26)'],
  wall: ['#2c446f', '#33507e', '#24385e', '#3a5a88'],
  roof: ['#16223d', '#1d2e4c', '#2a3550', '#3d3140', '#24405a'],
  warm: '#ffd486',
  smoke: 'rgba(150,180,208,',
  /* 前景树：深蓝—深青为主，少量暗锈与橄榄，去掉大面积纯黑 */
  tree: ['#061020', '#0a1a2e', '#0e2340', '#132c4c', '#123252', '#173f60', '#1d4a6c', '#245a80', '#2c6a8e', '#1a2a44']
};

/* ── 工具 ─────────────────────────────────────────────────── */
const clamp = (v, a, b) => v < a ? a : v > b ? b : v;
const lerp = (a, b, t) => a + (b - a) * t;
const easeOut = (t) => 1 - Math.pow(1 - clamp(t, 0, 1), 3);
const easeInOut = (t) => { t = clamp(t, 0, 1); return t < .5 ? 4 * t * t * t : 1 - Math.pow(-2 * t + 2, 3) / 2; };
/** 带偏移的缓动：把全局进度 q 映射到某一段 [from,to] 内的缓动值 */
const seg = (q, from, to) => easeInOut((q - from) / (to - from));

function rng(seed) { // mulberry32，保证每次刷新画面一致
  let a = seed >>> 0;
  return function () {
    a = (a + 0x6D2B79F5) >>> 0;
    let t = a;
    t = Math.imul(t ^ (t >>> 15), 1 | t);
    t = (t + Math.imul(t ^ (t >>> 7), 61 | t)) ^ t;
    return ((t ^ (t >>> 14)) >>> 0) / 4294967296;
  };
}

/* ── 画布与状态 ───────────────────────────────────────────── */
const cv = document.getElementById('paint');
let ctx = cv.getContext('2d', { alpha: false });   // 可临时切到离屏上下文（苏醒通道）

let W = 0, H = 0, DPR = 1, SPEED = 24;
let sky = null, hill = null, village = null, grainTile = null, moonSpr = null, glowSpr = null, coreSpr = null, starSpr = null, puffSpr = null;
let vign = null;
/* 苏醒用：tmp = 当帧完整场景；mask = 已"画上"的颜料覆盖层（只增不减） */
let tmpCv = null, tmpCtx = null, maskCv = null, maskCtx = null, maskDone = false;

let strokes = [], motes = [], stars = [], vortices = [], windows = [], chimneys = [];
let geometry = null;      // 山脊 / 房舍 / 树
let treeStrands = [];
let grainPat = null;

let clock = 0, last = 0, raf = 0, running = false;
let fpsAcc = 0, fpsN = 0, fpsShown = 0;

/* ══════════════════════════════════════════════════════════
   1. 布局与速度场
   ══════════════════════════════════════════════════════════ */
function layout() {
  W = cv.clientWidth || window.innerWidth;
  H = cv.clientHeight || window.innerHeight;
  DPR = Math.min(window.devicePixelRatio || 1, CONFIG.dprCap);
  if (W * H > 1_600_000) DPR = Math.min(DPR, 1.5);      // 大屏降 DPR 保帧率
  DPR = Math.max(1, DPR);
  cv.width = Math.round(W * DPR);
  cv.height = Math.round(H * DPR);
  ctx.setTransform(DPR, 0, 0, DPR, 0, 0);
  SPEED = Math.max(9, CONFIG.baseSpeed * W);
  /* 苏醒期用的两张离屏：只在转场中合成，转场结束后完全不再参与绘制 */
  const mk = () => { const c = document.createElement('canvas'); c.width = cv.width; c.height = cv.height; return c; };
  if (!tmpCv) tmpCv = document.createElement('canvas');
  if (!maskCv) maskCv = document.createElement('canvas');
  tmpCv.width = cv.width; tmpCv.height = cv.height;
  maskCv.width = cv.width; maskCv.height = cv.height;
  tmpCtx = tmpCv.getContext('2d');
  maskCtx = maskCv.getContext('2d');
  maskCtx.setTransform(DPR, 0, 0, DPR, 0, 0);
  tmpCtx.setTransform(DPR, 0, 0, DPR, 0, 0);
}

/** 天空主带（S 形）中心线，返回归一化 y */
function bandY(u) {
  return 0.335 - 0.125 * Math.sin(u * Math.PI * 1.12 + 0.18) + 0.045 * Math.sin(u * 6.1 + 1.2);
}

/** 区域笔触密度：涡体与主带最密，四角与地平线附近最疏。
 *  这是「不同区域不同密度」的唯一来源，画面因此不会处处一样。 */
function densityAt(px, py) {
  const u = px / W, v = py / H;
  let d = 0.30 + 0.85 * Math.exp(-Math.pow((v - bandY(u)) / 0.115, 2));
  for (let i = 0; i < 5; i++) {
    const vo = vortices[i];
    const r = Math.hypot(px - vo.cx, (py - vo.cy) / vo.squash) / vo.r;
    d = Math.max(d, 0.34 + 0.95 * Math.exp(-Math.pow((r - 0.62) / 0.55, 2)));
  }
  if (v > 0.60) d *= Math.max(0.15, 1 - (v - 0.60) / 0.22);   // 靠近地平线收疏
  return clamp(d, 0.10, 1.6);
}

/** 区域"节拍"：不同区域用不同的运动快慢，避免整片天空同步移动 */
function tempoAt(px, py) {
  const u = px / W, v = py / H;
  return 0.62 + 0.46 * Math.sin(u * 2.3 + 0.4) + 0.30 * Math.sin(v * 3.1 + u * 1.7 + 2.2);
}

function buildVortices() {
  const R = W * 0.001;
  vortices = [
    { cx: 0.425 * W, cy: 0.275 * H, r: 165 * R, k: 2.05, spin: 1, squash: 0.70 },   // 大旋涡
    { cx: 0.655 * W, cy: 0.400 * H, r: 118 * R, k: 1.55, spin: -1, squash: 0.72 },  // 次旋涡
    { cx: 0.858 * W, cy: 0.168 * H, r: 96 * R, k: 1.15, spin: 1, squash: 0.80 },    // 月晕涡
    { cx: 0.235 * W, cy: 0.470 * H, r: 74 * R, k: 0.85, spin: -1, squash: 0.66 },
    { cx: 0.085 * W, cy: 0.330 * H, r: 58 * R, k: 0.62, spin: 1, squash: 0.74 }
  ];
  // 亮星周围的小涡：让附近笔触自然绕出「有机光晕」，而不是画同心圆
  for (const s of stars) vortices.push({ cx: s.x, cy: s.y, r: s.glow * 1.7, k: 0.40, spin: s.spin, squash: 0.92 });
}

/** 速度场（px/s），时间无关 → 流线可预计算 */
const _f = [0, 0];
function fieldAt(x, y) {
  const u = x / W, v = y / H;
  let vx = SPEED * (0.82 + 0.42 * Math.sin(v * 5.1 + u * 1.7 + 0.6));
  let vy = SPEED * (0.32 * Math.sin(u * 6.3 - v * 2.3 + 1.1) + 0.18 * Math.cos(u * 3.2 + 0.4));
  const dy = bandY(u) - v;
  vy += SPEED * 0.50 * Math.tanh(dy * 7);
  vx += SPEED * 0.42 * Math.exp(-Math.abs(dy) * 6);
  for (let i = 0; i < vortices.length; i++) {
    const vo = vortices[i];
    const dx = x - vo.cx, dyy = (y - vo.cy) / vo.squash;
    const d = Math.hypot(dx, dyy) + 1e-6;
    const g = Math.exp(-(d * d) / (vo.r * vo.r));
    const s = (vo.k * SPEED) * g;
    const tx = -dyy / d * vo.spin, ty = dx / d * vo.spin;
    vx += tx * s - (dx / d) * s * 0.15;
    vy += ty * s - (dyy / d) * s * 0.15 * 0.6;
  }
  _f[0] = vx; _f[1] = vy;
  return _f;
}

/* ── 路径重采样为等距点列（含单位法线） ─────────────────── */
const STEP_PX = 5;
function resample(pts, closed) {
  const n = pts.length;
  if (n < 2) return null;
  const cum = [0];
  for (let i = 1; i < n; i++) cum.push(cum[i - 1] + Math.hypot(pts[i].x - pts[i - 1].x, pts[i].y - pts[i - 1].y));
  if (closed) cum.push(cum[n - 1] + Math.hypot(pts[0].x - pts[n - 1].x, pts[0].y - pts[n - 1].y));
  const total = cum[cum.length - 1];
  if (total < STEP_PX * 2) return null;
  const m = Math.max(2, Math.round(total / STEP_PX) + (closed ? 0 : 1));
  const out = new Float32Array(m * 4);
  let j = 0;
  for (let i = 0; i < m; i++) {
    const target = closed ? (i / m) * total : (i / (m - 1)) * total;
    while (j < cum.length - 2 && cum[j + 1] < target) j++;
    const a = pts[j % n], b = pts[(j + 1) % n];
    const segLen = (cum[j + 1] - cum[j]) || 1;
    const t = clamp((target - cum[j]) / segLen, 0, 1);
    out[i * 4] = lerp(a.x, b.x, t);
    out[i * 4 + 1] = lerp(a.y, b.y, t);
  }
  for (let i = 0; i < m; i++) {
    const p = i, nx = (i + 1) % m, pv = (i - 1 + m) % m;
    let tx = out[nx * 4] - out[pv * 4], ty = out[nx * 4 + 1] - out[pv * 4 + 1];
    if (!closed && i === 0) { tx = out[1 * 4] - out[0]; ty = out[1 * 4 + 1] - out[1]; }
    if (!closed && i === m - 1) { tx = out[(m - 1) * 4] - out[(m - 2) * 4]; ty = out[(m - 1) * 4 + 1] - out[(m - 2) * 4 + 1]; }
    const L = Math.hypot(tx, ty) || 1;
    out[i * 4 + 2] = -ty / L;          // 法线 x
    out[i * 4 + 3] = tx / L;           // 法线 y
  }
  return { d: out, m, len: total, closed: !!closed };
}

/** 沿场积分一条开放流线 */
function integrateStream(x0, y0, steps, dt) {
  const pts = [];
  let x = x0, y = y0;
  const back = [];
  for (let i = 0; i < steps; i++) {
    back.push({ x, y });
    const f = fieldAt(x, y); const fx = f[0], fy = f[1];
    x -= fx * dt; y -= fy * dt;
  }
  back.reverse();
  pts.push(...back);
  x = x0; y = y0;
  for (let i = 0; i < steps; i++) {
    const f = fieldAt(x, y); const fx = f[0], fy = f[1];
    x += fx * dt; y += fy * dt;
    pts.push({ x, y });
  }
  return resample(pts, false);
}

/** 绕涡心的闭合有机环线（保证笔触循环运动无缝）。
 *  每条环线由 seed 派生出独立的偏心量 / 转角 / 扁率 / 谐波相位，
 *  使同一涡心附近的环线彼此错位穿插，而不是干净的嵌套同心环。 */
function vortexLoopPts(vo, radMul, seed, wob) {
  const pts = [];
  const base = vo.r * radMul;
  const h = (k) => { const v = Math.sin(seed * 127.1 + k * 311.7) * 43758.5453; return v - Math.floor(v); };
  const p1 = h(1) * 6.2832, p2 = h(2) * 6.2832, p3 = h(3) * 6.2832, p4 = h(4) * 6.2832;
  const rot = h(5) * Math.PI;
  const ex = (h(6) - 0.5) * vo.r * 0.55, ey = (h(7) - 0.5) * vo.r * 0.40;
  const sq = clamp(vo.squash + (h(8) - 0.5) * 0.46, 0.40, 1.06);
  const cosr = Math.cos(rot), sinr = Math.sin(rot);
  for (let i = 0; i < 64; i++) {
    const a = i / 64 * Math.PI * 2;
    const rr = base * (1 + wob * (0.15 * Math.sin(a * 2 + p1) + 0.11 * Math.sin(a * 3 + p2)
      + 0.07 * Math.sin(a * 5 + p3) + 0.045 * Math.sin(a * 7 + p4)));
    const bx = Math.cos(a) * rr, by = Math.sin(a) * rr * sq;
    pts.push({ x: vo.cx + ex + bx * cosr - by * sinr, y: vo.cy + ey + bx * sinr + by * cosr });
  }

}
function vortexLoop(vo, radMul, seed, wob) {
  return resample(vortexLoopPts(vo, radMul, seed, wob), true);
}
/** 螺旋臂：从内半径旋到外半径，梵高涡体的真实形态 */
function spiralPts(vo, r0, r1, turns, phase, wob) {
  const pts = [];
  const N = 84;
  for (let i = 0; i <= N; i++) {
    const t = i / N;
    const a = phase + t * turns * Math.PI * 2;
    const rr = lerp(r0, r1, t) * (1 + wob * (0.10 * Math.sin(a * 3 + phase) + 0.06 * Math.sin(a * 5 + phase * 2)));
    pts.push({ x: vo.cx + Math.cos(a) * rr, y: vo.cy + Math.sin(a) * rr * vo.squash });
  }
  return pts;
}

/* ══════════════════════════════════════════════════════════
   2. 笔触（星云）—— 三种形状 + 四种运动 + 实色/发光分流
   ══════════════════════════════════════════════════════════ */
/** 按权重表取调色板索引 */
function pickWeighted(w, r) {
  let acc = 0;
  for (let i = 0; i < w.length; i++) { acc += w[i]; if (r < acc) return i; }
  return w.length - 1;
}
/* 形状族：dash 短促厚点 / comma 弧形逗号笔 / arc 长弧笔 / brush 饱笔（一头钝一头提走）
   长弧笔给方向感，饱笔给厚涂的"一笔到底"，短点只做破笔——
   碎瓷感来自两端都收尖的羽毛形占比过高，真实画笔落笔钝、收笔尖，这里补上不对称笔形。
   n 是每支笔沿流线采样的点数：采得太少，多边形边缘会露出锯齿（放大看像撕破的布条）。 */
const SHAPE = {
  dash: { n: 3, prof: [0.30, 1.00, 0.24], len: [5, 13], wr: [0.30, 0.54], curve: [0.10, 0.42] },
  comma: { n: 7, prof: [0.14, 0.52, 0.86, 1.00, 0.72, 0.40, 0.12], len: [18, 40], wr: [0.14, 0.30], curve: [0.34, 0.92] },
  arc: { n: 11, prof: [0.08, 0.28, 0.52, 0.76, 0.94, 1.00, 0.86, 0.66, 0.42, 0.20, 0.07], len: [40, 78], wr: [0.06, 0.14], curve: [0.12, 0.46] },
  brush: { n: 9, prof: [0.66, 1.00, 0.96, 0.84, 0.66, 0.46, 0.28, 0.14, 0.06], len: [26, 60], wr: [0.11, 0.22], curve: [0.18, 0.62] }
};

function buildStrokes() {
  const R = rng(20261125);
  const area = clamp((W * H) / (1440 * 900), 0.62, 2.2);   // 竖屏按面积线性缩减会太稀
  const count = Math.round(CONFIG.strokeBase * CONFIG.strokeDensity * area);
  strokes = [];
  let guard = 0;
  while (strokes.length < count && guard++ < count * 14) {
    /* ① 按区域密度采样落点：涡体与主带密，四角与地平线疏 */
    const px = R() * W, py = Math.pow(R(), 0.86) * H * 0.70;
    if (R() * 1.6 > densityAt(px, py)) continue;

    const kind = R();
    let path, sp, lenMul = 1;
    if (kind < 0.40) {                                   // 绕涡：闭合环线（循环无缝）
      const vo = vortices[Math.floor(R() * Math.min(vortices.length, 6))];
      const rm = (0.14 + R() * R() * 0.98) * (0.86 + R() * 0.30);
      // 每条自己的半径再抖 ±15%：同心环之所以读得出，是因为半径成整齐的一族
      path = vortexLoop(vo, rm, R(), 1.0 + R() * 1.3);
      sp = (0.7 + R() * 0.8) * (1 / (0.5 + rm));
      lenMul = 1.0;
    } else if (kind < 0.80) {                            // 顺带：沿 S 带的开放流线
      const u = R();
      const y = (bandY(u) + (R() - 0.5) * 0.34) * H;
      path = integrateStream(u * W, y, 20, 0.32);
      sp = 0.6 + R() * 1.1;
      lenMul = 1.35;
    } else {                                             // 外围：薄雾短笔
      const u = R(), v = R() * 0.60;
      path = integrateStream(u * W, v * H, 9, 0.28);
      sp = 0.30 + R() * 0.5;
      lenMul = 0.72;
    }
    if (!path || path.m < 4) continue;

    /* ② 形状族：短点 / 逗号弧 / 长弧 / 饱笔，各取自己的长度与宽长比 */
    const sr = R();
    const sh = sr < 0.16 ? SHAPE.dash : sr < 0.40 ? SHAPE.comma : sr < 0.60 ? SHAPE.arc : SHAPE.brush;
    const len0 = lerp(sh.len[0], sh.len[1], Math.pow(R(), 1.1)) * lenMul * (W / 1440);
    /* 同族里再拉开尺度：多数是中笔，少数拖成一支长笔，少数只剩一点颜料。
       长短一致才会读出"整齐的鱼鳞阵列"，拉开才有厚涂的随意感。 */
    const sizeMul = 0.62 + Math.pow(R(), 1.8) * 1.15;
    /* 闭合环上的笔不许缠过环周的 1/10：小半径环上缠多了会读成一弯"亮色贴片"，
       而不是撂在涡上的一笔。 */
    const len = path.closed ? Math.min(len0 * sizeMul, path.len * 0.10) : len0 * sizeMul;
    const wr = lerp(sh.wr[0], sh.wr[1], R()) / Math.pow(sizeMul, 0.45);
    /* 长笔必须收窄（宽长比 ≤0.15）：又长又宽就是一面旗，不是一支笔。
       短点不受此限——它的身份本来就是"厚颜料的一点"。 */
    const wrCap = len > 34 * (W / 1440) ? Math.min(wr, 0.15) : wr;
    const w = Math.max(1.0, len * wrCap);

    /* ③ 运动分四类：静止 / 慢 / 中 / 快，并叠加所属区域的节拍 */
    const mr = R();
    const motion = mr < 0.26 ? 0 : mr < 0.58 ? 1 : mr < 0.86 ? 2 : 3;
    const mul = motion === 0 ? 0 : motion === 1 ? 0.22 + R() * 0.26 : motion === 2 ? 0.55 + R() * 0.45 : 1.05 + R() * 0.7;

    /* ④ 取色：明度跟着区域走。涡体与主带提亮，四角与地平线压暗——
       处处一样亮会把天空读成一片碎瓷，厚涂要靠明暗层才读得出来。 */
    const lit = clamp((densityAt(px, py) - 0.40) / 0.90, 0, 1);
    let ci = pickWeighted(PAL.flowW, R());
    ci = clamp(Math.round(ci * (0.56 + 0.58 * lit) + lit * 1.05), 1, 8);
    const nearStar = stars.reduce((b, s) => Math.min(b, Math.hypot(px - s.x, py - s.y)), 1e9);
    if (nearStar < 46 && R() < 0.26) ci = R() < 0.4 ? 10 : 7;
    const glow = ci >= 7 && R() < CONFIG.glowFraction * (ci >= 10 ? 3.2 : 1);
    const al = glow ? 0.09 + R() * 0.17
      : clamp((0.17 + Math.pow(R(), 0.85) * 0.44) * (ci <= 3 ? 1.16 : 0.90), 0, 0.70);

    strokes.push({
      p: path, u: R() * path.len, len, w, ci, al, glow,
      sp: sp * mul * tempoAt(px, py),
      ph: R() * 6.28,
      per: 3.4 + R() * 7.2,                              // 每支笔触自己的摆动周期
      bend: lerp(sh.curve[0], sh.curve[1], R()) * (0.5 + R()),
      prof: sh.prof, n: sh.n,
      xs: new Float64Array(sh.n * 2), ys: new Float64Array(sh.n * 2)
    });
  }
}

/* 分桶：同一（颜色 × 透明度档 × 实色/发光）一次 fill，避免上千次 draw call */
const A_LEVELS = 6;
function drawNebula(alpha, flow) {
  if (alpha <= 0.004) return;
  const t = clock;
  const buckets = new Map();
  for (let i = 0; i < strokes.length; i++) {
    const s = strokes[i], p = s.p, d = p.d, m = p.m;
    if (s.al < 0.02) continue;
    // 沿流线推进：闭合环线无缝循环；开放流线两端淡出后回卷（不出现折返滑动）
    let u = s.u + t * SPEED * s.sp * flow;
    u = ((u % p.len) + p.len) % p.len;
    const fade = p.closed ? 1 : clamp(Math.min(u, p.len - u) / (p.len * 0.17), 0, 1);
    const a = s.al * fade;
    if (a < 0.035) continue;
    const level = clamp(Math.round(a * A_LEVELS), 1, A_LEVELS);
    const key = (s.ci * 8 + level) | (s.glow ? 4096 : 0);
    let arr = buckets.get(key);
    if (!arr) { arr = []; buckets.set(key, arr); }

    /* 笔触本体：沿切线铺开 n 个采样点，宽度按 prof 收尖，
       法线方向叠加「笔肚弯曲 + 缓慢摆动」→ 读作油画笔触而非直线 */
    const n = s.n, xs = s.xs, ys = s.ys, half = s.len / 2;
    /* 弯度封顶：一笔最多弯到自身长度的两成，再弯就成了钩子/贴片而不是笔触 */
    const bendK = Math.min(s.bend * s.w, s.len * 0.20);
    const bend = bendK * (Math.sin(t / s.per * 6.2832 + s.ph) * 0.55 + 0.55);
    let ok = true;
    for (let q = 0; q < n; q++) {
      let pos = u - half + s.len * (q / (n - 1));
      let k;
      if (p.closed) {
        pos = ((pos % p.len) + p.len) % p.len;
        k = Math.floor(pos / STEP_PX) % m;
      } else {
        if (pos < 0 || pos > p.len - 1) { ok = false; break; }
        k = Math.min(m - 1, Math.floor(pos / STEP_PX));
      }
      const k2 = Math.min(m - 1, k + 1), f = clamp(pos / STEP_PX - k, 0, 1);
      const px = lerp(d[k * 4], d[k2 * 4], f), py = lerp(d[k * 4 + 1], d[k2 * 4 + 1], f);
      const nx = d[k * 4 + 2], ny = d[k * 4 + 3];
      const bow = Math.sin(Math.PI * (q / (n - 1))) * bend;      // 弧形（逗号笔）
      const hw = s.w * s.prof[q] * 0.5;
      xs[q] = px + nx * (hw + bow); ys[q] = py + ny * (hw + bow);
      xs[2 * n - 1 - q] = px - nx * (hw - bow * 0.55); ys[2 * n - 1 - q] = py - ny * (hw - bow * 0.55);
    }
    if (!ok) continue;
    arr.push(xs, ys);
  }
  /* 先铺实色颜料（source-over），再补极少数发光笔触 —— 明暗虚实靠实色层，
     发光只是零星高光，画面才不会读成"发光线条" */
  for (let pass = 0; pass < 2; pass++) {
    ctx.globalCompositeOperation = pass ? 'lighter' : 'source-over';
    for (const [key, arr] of buckets) {
      const isGlow = (key & 4096) !== 0;
      if (isGlow !== !!pass) continue;
      const c = PAL.stroke[(key >> 3) & 15];
      ctx.fillStyle = `rgb(${c[0]},${c[1]},${c[2]})`;
      ctx.globalAlpha = alpha * ((key & 7) / A_LEVELS) * (isGlow ? 0.55 : 1);
      ctx.beginPath();
      for (let k = 0; k < arr.length; k += 2) {
        const xs = arr[k], ys = arr[k + 1], cnt = xs.length;
        ctx.moveTo(xs[0], ys[0]);
        for (let q = 1; q < cnt; q++) ctx.lineTo(xs[q], ys[q]);
        ctx.closePath();
      }
      ctx.fill();
    }
  }
  ctx.globalAlpha = 1;
  ctx.globalCompositeOperation = 'source-over';
}

   3. 星与月

  [0.330, 0.328, 0.58, 1], [0.352, 0.528, 1.00, -1], [0.128, 0.472, 0.66, 1],
  [0.040, 0.448, 0.42, -1], [0.228, 0.168, 0.74, 1], [0.520, 0.196, 0.44, -1],

  const R = rng(77123);

    scale: s[2], spin: s[3],

function makeGlow(size, r, g, b, stops) {

  for (const s of stops) gr.addColorStop(s[0], `rgba(${r},${g},${b},${s[1]})`);
  x.fillStyle = gr; x.fillRect(0, 0, size, size);

}

  g.addColorStop(.40, 'rgba(206,196,126,.20)'); g.addColorStop(.68, 'rgba(150,164,124,.07)');
